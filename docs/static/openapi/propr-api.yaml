      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success. The response body is not documented yet.
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: browserSession
      x-undocumented: true
      x-legacy-error: true
  /mcp/consent:
    get:
      operationId: getMcpConsent
      summary: GET /mcp/consent
      description: This route is registered but not documented yet.
      tags:
        - MCP
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success. The response body is not documented yet.
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: browserSession
      x-undocumented: true
      x-legacy-error: true
    post:
      operationId: postMcpConsent
      summary: POST /mcp/consent
      description: This route is registered but not documented yet.
      tags:
        - MCP
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success. The response body is not documented yet.
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: browserSession
      x-undocumented: true
      x-legacy-error: true
  /register:
    post:
      operationId: registerMcpClient
      summary: Register an MCP OAuth client
      description: "RFC 7591 dynamic client registration. Clients register as public clients (`token_endpoint_auth_method: none`). Served by the MCP SDK's OAuth router at the API origin root, and only while MCP is enabled. See the MCP guide (docs/features/mcp)."
      tags:
        - MCP
      security: []
      requestBody:
        required: true
        description: RFC 7591 client metadata, for example `client_name` and `redirect_uris`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "201":
          description: The registered client, including its `client_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"
        "400":
          description: RFC 7591 error, for example `invalid_client_metadata`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          description: MCP is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: public
      x-legacy-error: true
  /revoke:
    post:
      operationId: revokeMcpToken
      summary: Revoke an MCP access or refresh token
      description: RFC 7009 revocation. The `application/x-www-form-urlencoded` body carries `token`, optionally `token_type_hint`, and `client_id`. Served by the MCP SDK's OAuth router at the API origin root, and only while MCP is enabled. See the MCP guide (docs/features/mcp).
      tags:
        - MCP
      security: []
      responses:
        "200":
          description: The token is revoked, or was not valid. The body is `{}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"
        "400":
          description: RFC 7009 error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          description: MCP is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: public
      x-legacy-error: true
  /token:
    post:
      operationId: issueMcpToken
      summary: Exchange an authorization code or refresh token
      description: "OAuth 2.1 token endpoint for public clients (`token_endpoint_auth_method: none`). The `application/x-www-form-urlencoded` body carries `grant_type` (`authorization_code` with `code`, `code_verifier` and `redirect_uri`, or `refresh_token` with `refresh_token`), `client_id` and optionally `resource`. Served by the MCP SDK's OAuth router at the API origin root, and only while MCP is enabled. See the MCP guide (docs/features/mcp)."
      tags:
        - MCP
      security: []
      responses:
        "200":
          description: "RFC 6749 token response: `access_token`, `token_type`, `expires_in`, `scope` and `refresh_token`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"
        "400":
          description: RFC 6749 error, for example `invalid_grant`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          description: MCP is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: public
      x-legacy-error: true
  /webhook:
    post:
      operationId: receiveGitHubWebhook
      summary: Receive a GitHub webhook delivery
      description: Registered only when `GITHUB_EVENT_INTAKE_MODE=direct_webhook`. Deliveries must be signed with `GH_WEBHOOK_SECRET`.
      tags:
        - Webhooks
      security:
        - webhookSignature: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          description: GitHub event name.
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub delivery identifier.
          schema:
            type: string
      requestBody:
        required: true
        description: The GitHub event payload.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Accepted.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: webhook
      x-legacy-error: true
components:
  schemas:
    AssignableUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AttributedUser"
        truncated:
          type: boolean
          description: True when the repository has more assignable users than were listed.
      required:
        - users
        - truncated
      additionalProperties: false
      description: Users that can be assigned to issues and pull requests of a repository.
    AttributedUser:
      type: object
      properties:
        id:
          type: string
          description: Stable GitHub numeric user id.
        login:
          type: string
        displayName:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
      required:
        - id
        - login
        - displayName
        - avatarUrl
      additionalProperties: false
      description: A GitHub user work is assigned or attributed to.
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        username:
          type: string
        displayName:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - admin
            - member
        permissions:
          type: array
          items:
            type: string
            enum:
              - instance.manage_agents
              - instance.manage_members
              - instance.manage_runtime
              - instance.manage_settings
        authorizationSource:
          type: string
          enum:
            - bootstrap
            - local
            - managed
            - implicit
            - demo
      required:
        - id
        - login
        - username
        - role
        - permissions
        - authorizationSource
      additionalProperties: false
      description: The signed-in GitHub user and their instance role.
    AutomationExtensions:
      type: object
      properties:
        servers:
          maxItems: 32
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_-]{0,47}$
        skills:
          maxItems: 32
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - servers
        - skills
      additionalProperties: false
      description: Library server names and skill bundle ids added to an automation on top of what applies automatically. Setting or changing them requires instance.manage_settings.
    Compatibility:
      type: object
      properties:
        version:
          type: string
          description: ProPR release version of the API server.
        apiCompatibility:
          type: string
          description: API compatibility date clients negotiate against.
        uiCompatibility:
          type: string
          description: Oldest web UI compatibility date the API accepts.
        desktopAuthentication:
          $ref: "#/components/schemas/DesktopAuthenticationCapabilities"
      required:
        - version
        - apiCompatibility
        - uiCompatibility
        - desktopAuthentication
      additionalProperties: false
      description: Version and capability metadata used for client compatibility negotiation.
    CostExport:
      type: object
      properties:
        period:
          anyOf:
            - type: string
              enum:
                - 24h
                - 7d
                - 30d
                - 90d
                - 1y
                - all
            - type: "null"
          description: The requested period; null for all time.
        repository:
          type: string
          description: "`all` or `owner/repo`."
        group_by:
          type: array
          items:
            type: string
            enum:
              - day
              - repository
              - agent
              - model
              - reasoning_level
              - execution_type
              - outcome
          description: The grouping dimensions, in column order.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CostRow"
          description: Ascending by each dimension in column order; unrecorded values last.
        totals:
          $ref: "#/components/schemas/CostFigures"
      required:
        - period
        - repository
        - group_by
        - rows
        - totals
      additionalProperties: false
      description: Recorded LLM executions grouped by the requested dimensions.
    CostFigures:
      type: object
      properties:
        executions:
          type: integer
          minimum: 0
          description: Agent executions in the row.
        tasks:
          type: integer
          minimum: 0
          description: Distinct tasks with at least one execution in the row.
        input_tokens:
          type: integer
          minimum: 0
          description: Input tokens, cache reads and writes included, as each execution was priced.
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
          description: Of `input_tokens`, prompt-cache writes.
        cache_read_input_tokens:
          type: integer
          minimum: 0
          description: Of `input_tokens`, prompt-cache reads.
        cost_usd:
          anyOf:
            - type: number
              minimum: 0
            - type: "null"
          description: Recorded cost in USD; null when no execution in the row recorded a cost.
      required:
        - executions
        - tasks
        - input_tokens
        - output_tokens
        - cache_creation_input_tokens
        - cache_read_input_tokens
        - cost_usd
      additionalProperties: false
      description: Execution, task, token and cost totals.
    CostRow:
      type: object
      properties:
        day:
          description: UTC day the execution started, `YYYY-MM-DD`. Present when grouped by it; null when unrecorded.
          type:
            - string
            - "null"
        repository:
          description: "`owner/repo` of the execution's task. Present when grouped by it; null when unrecorded."
          type:
            - string
            - "null"
        agent:
          description: Agent alias that ran the execution. Present when grouped by it; null when unrecorded.
          type:
            - string
            - "null"
        model:
          description: Model name. Present when grouped by it; null when unrecorded.
          type:
            - string
            - "null"
        reasoning_level:
          description: Effective reasoning level (effort). Present when grouped by it; null when unrecorded.
          type:
            - string
            - "null"
        execution_type:
          description: Execution type, for example `implementation` or `review`. Present when grouped by it; null when unrecorded.
          type:
            - string
            - "null"
        outcome:
          description: Present when grouped by outcome.
          type: string
          enum:
            - success
            - failed
        executions:
          type: integer
          minimum: 0
          description: Agent executions in the row.
        tasks:
          type: integer
          minimum: 0
          description: Distinct tasks with at least one execution in the row.
        input_tokens:
          type: integer
          minimum: 0
          description: Input tokens, cache reads and writes included, as each execution was priced.
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
          description: Of `input_tokens`, prompt-cache writes.
        cache_read_input_tokens:
          type: integer
          minimum: 0
          description: Of `input_tokens`, prompt-cache reads.
        cost_usd:
          anyOf:
            - type: number
              minimum: 0
            - type: "null"
          description: Recorded cost in USD; null when no execution in the row recorded a cost.
      required:
        - executions
        - tasks
        - input_tokens
        - output_tokens
        - cache_creation_input_tokens
        - cache_read_input_tokens
        - cost_usd
      additionalProperties: false
      description: One group of recorded executions.
    DemoModeStatus:
      type: object
      properties:
        demoMode:
          type: boolean
      required:
        - demoMode
      additionalProperties: false
    DesktopAuthenticationCapabilities:
      type: object
      properties:
        protocolVersion:
          type: number
          const: 2
        browserPairing:
          type: boolean
        instanceBearerTokens:
          type: boolean
        socketIoBearerAuthentication:
          type: boolean
      required:
        - protocolVersion
        - browserPairing
        - instanceBearerTokens
        - socketIoBearerAuthentication
      additionalProperties: false
    DesktopDiscovery:
      type: object
      properties:
        schemaVersion:
          type: integer
        product:
          type: string
          const: ProPR
        canonicalEndpoint:
          type:
            - string
            - "null"
        publicInstanceIdentity:
          anyOf:
            - type: object
              properties: {}
              additionalProperties: {}
            - type: "null"
        version:
          type: string
        apiCompatibility:
          type: string
        uiCompatibility:
          type: string
        desktopAuthentication:
          $ref: "#/components/schemas/DesktopAuthenticationCapabilities"
      required:
        - schemaVersion
        - product
        - canonicalEndpoint
        - publicInstanceIdentity
        - version
        - apiCompatibility
        - uiCompatibility
        - desktopAuthentication
      additionalProperties: {}
      description: Public, credential-free discovery metadata for desktop and CLI pairing.
    DesktopPairingActivationReceipt:
      type: object
      properties:
        status:
          type: string
          const: active
        receipt:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
        activatedAt:
          type: string
          format: date-time
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the instance token expires; `null` when it does not.
      required:
        - status
        - receipt
        - activatedAt
        - expiresAt
      additionalProperties: false
      description: The instance token is active.
    DesktopPairingCancellation:
      type: object
      properties:
        status:
          type: string
          const: cancelled
        cancelledAt:
          type: string
          format: date-time
      required:
        - status
        - cancelledAt
      additionalProperties: false
      description: The provisional instance token was revoked.
    DesktopPairingPending:
      type: object
      properties:
        status:
          type: string
          const: pending
        interval:
          type: integer
          minimum: 1
          maximum: 60
          description: Seconds to wait before the next poll.
      required:
        - status
        - interval
      additionalProperties: false
      description: The pairing is not approved yet (HTTP 202).
    DesktopPairingPoll:
      anyOf:
        - $ref: "#/components/schemas/DesktopPairingPending"
        - $ref: "#/components/schemas/DesktopPairingProvisional"
      description: State of a pairing, by `status`.
    DesktopPairingPollRequest:
      type: object
      properties:
        deviceSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - deviceSecret
      additionalProperties: false
    DesktopPairingProvisional:
      type: object
      properties:
        status:
          type: string
          const: provisional
        token:
          type: string
          pattern: ^propr_it_[A-Za-z0-9_-]{43}$
          description: Instance token. It works only after the pairing is activated.
        tokenType:
          type: string
          const: Bearer
        activationTicket:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        activationExpiresAt:
          type: string
          format: date-time
          description: Activate or cancel before this time.
        instanceId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$
          description: "`publicInstanceIdentity.instanceId` from discovery."
        origin:
          type: string
          description: Canonical API origin the client discovered, for example `https://propr.example.com`.
        scope:
          type: string
          const: desktop-instance
        credentialGeneration:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
          description: Client-chosen generation that identifies this credential.
      required:
        - status
        - token
        - tokenType
        - activationTicket
        - activationExpiresAt
        - instanceId
        - origin
        - scope
        - credentialGeneration
      additionalProperties: false
      description: The pairing was approved and a provisional instance token was issued (HTTP 200).
    DesktopPairingStart:
      type: object
      properties:
        pairingId:
          type: string
          pattern: ^dpr_[A-Za-z0-9_-]{22}$
        deviceSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Secret the client presents on every later pairing request. Never shown to the browser.
        approvalUrl:
          type: string
          description: Same-origin URL the user opens to approve the pairing.
        expiresAt:
          type: string
          format: date-time
          description: The pairing expires at this time, at most 30 minutes after it started.
        interval:
          type: integer
          minimum: 1
          maximum: 60
          description: Seconds to wait between polls.
      required:
        - pairingId
        - deviceSecret
        - approvalUrl
        - expiresAt
        - interval
      additionalProperties: false
      description: A started pairing.
    DesktopPairingStartRequest:
      type: object
