    post:
      operationId: resumeFollowupHandoff
      summary: Re-arm an operator-held handoff and run a recovery pass keyed to this pull request
      description: |-
        Without flags, an `awaiting_operator` record returns to `active` and one strictly keyed recovery pass runs: it resumes the exact missing publication phase idempotently and then releases the branch. Work the user cancelled is refused with code `requires_cancellation_authorization` until the request carries `authorizeCancelled: true` (for example after fixing a `worktree_missing` hold: restore the worktree, then resume). Publication side effects are limited to the addressed pull request.

        Requires the `instance.manage_runtime` instance permission.
      tags:
        - Administration
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          description: Repository owner (case-insensitive).
          schema:
