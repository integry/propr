components:
  schemas:
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        username:
          type: string
        displayName:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - admin
            - member
        permissions:
          type: array
          items:
            type: string
            enum:
              - instance.manage_agents
              - instance.manage_members
              - instance.manage_runtime
              - instance.manage_settings
        authorizationSource:
          type: string
          enum:
            - bootstrap
            - local
            - managed
            - implicit
            - demo
      required:
        - id
        - login
        - username
        - role
        - permissions
        - authorizationSource
      additionalProperties: false
      description: The signed-in GitHub user and their instance role.
    Compatibility:
      type: object
      properties:
        version:
          type: string
          description: ProPR release version of the API server.
        apiCompatibility:
          type: string
          description: API compatibility date clients negotiate against.
        uiCompatibility:
          type: string
          description: Oldest web UI compatibility date the API accepts.
        desktopAuthentication:
          $ref: "#/components/schemas/DesktopAuthenticationCapabilities"
      required:
        - version
        - apiCompatibility
        - uiCompatibility
        - desktopAuthentication
      additionalProperties: false
      description: Version and capability metadata used for client compatibility negotiation.
    DemoModeStatus:
      type: object
      properties:
        demoMode:
          type: boolean
      required:
        - demoMode
      additionalProperties: false
    DesktopAuthenticationCapabilities:
      type: object
      properties:
        protocolVersion:
          type: number
          const: 2
        browserPairing:
          type: boolean
        instanceBearerTokens:
          type: boolean
        socketIoBearerAuthentication:
          type: boolean
      required:
        - protocolVersion
        - browserPairing
        - instanceBearerTokens
        - socketIoBearerAuthentication
      additionalProperties: false
    DesktopDiscovery:
      type: object
      properties:
        schemaVersion:
          type: integer
        product:
          type: string
          const: ProPR
        canonicalEndpoint:
          type:
            - string
            - "null"
        publicInstanceIdentity:
          anyOf:
            - type: object
              properties: {}
              additionalProperties: {}
            - type: "null"
        version:
          type: string
        apiCompatibility:
          type: string
        uiCompatibility:
          type: string
        desktopAuthentication:
          $ref: "#/components/schemas/DesktopAuthenticationCapabilities"
      required:
        - schemaVersion
        - product
        - canonicalEndpoint
        - publicInstanceIdentity
        - version
        - apiCompatibility
        - uiCompatibility
        - desktopAuthentication
      additionalProperties: {}
      description: Public, credential-free discovery metadata for desktop and CLI pairing.
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: string
          description: Stable, machine-readable error code, for example `TASK_NOT_FOUND`.
        message:
          type: string
          description: Human-readable explanation that is safe to show to an operator.
        hint:
          description: Optional next step that resolves the error.
          type: string
      required:
        - code
        - message
      additionalProperties: false
      description: The common error envelope. New routes return it for every 4xx and 5xx response.
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
      description: Liveness probe result.
    JsonObject:
      type: object
      properties: {}
      additionalProperties: {}
      description: A JSON object whose fields are not documented yet.
    LegacyError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          description: Machine-readable code, present on authentication and some validation errors.
          type: string
        message:
          description: Longer explanation, present on some authentication errors.
          type: string
      required:
        - error
      additionalProperties: {}
      description: "The ad-hoc error shape most existing routes return. Operations that use it carry `x-legacy-error: true`."
    NotificationUnreadCount:
      type: object
      properties:
        unreadCount:
          type: integer
          minimum: 0
      required:
        - unreadCount
      additionalProperties: false
    TaskEvent:
      type: object
      properties:
        state:
          type: string
          description: Lifecycle state entered at this point.
        timestamp:
          type: string
          description: When the state was entered (ISO 8601).
        reason:
          type:
            - string
            - "null"
        message:
          type: string
        metadata:
          anyOf:
            - type: object
              properties: {}
              additionalProperties: {}
            - type: "null"
      required:
        - state
        - timestamp
      additionalProperties: {}
      description: One entry of a task's lifecycle history.
    TaskFollowupRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536
          description: Comment text posted on the task's pull request or issue.
        target:
          description: Force the comment onto the pull request.
          type: string
          const: pull_request
      required:
        - body
      additionalProperties: false
    TaskFollowupResult:
      type: object
      properties:
        success:
          type: boolean
        state:
          type: string
          enum:
            - queued
            - unknown
        posted:
          type: boolean
        commentId:
          type: integer
        jobId:
          type: string
        sourceTaskId:
          type: string
        message:
          description: Present when the queue submission could not be confirmed.
          type: string
      required:
        - success
        - state
        - posted
        - commentId
        - jobId
        - sourceTaskId
      additionalProperties: false
      description: "Result of posting a follow-up comment. `state: unknown` means inspect the job before retrying."
    TaskHistory:
      type: object
      properties:
        taskId:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/TaskEvent"
          description: Lifecycle events, oldest first.
        taskInfo:
          anyOf:
            - type: object
              properties: {}
              additionalProperties: {}
            - type: "null"
          description: Repository, issue, pull request and agent details of the task.
        budget:
          description: Spend so far against the task's cost cap, when a cap applies.
          type: object
          properties: {}
          additionalProperties: {}
      required:
        - taskId
        - history
        - taskInfo
      additionalProperties: {}
      description: A task together with its lifecycle events.
    TaskPage:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskSummary"
        total:
          type: integer
          description: Matching runs, or matching tasks with `groupBy=task`.
        offset:
          type: integer
        limit:
          type: integer
        totalRuns:
          description: "With `groupBy=task`: matching runs across all tasks."
          type: integer
      required:
        - tasks
        - total
        - offset
        - limit
      additionalProperties: false
      description: A page of task runs.
    TaskSubmission:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - prepared
            - creating
            - issue_created
            - queued
            - failed
        issueNumber:
          anyOf:
            - type: integer
            - type: "null"
        issueUrl:
          type:
            - string
            - "null"
        taskId:
          type:
            - string
            - "null"
        error:
          type:
            - string
            - "null"
      required:
        - id
        - state
        - issueNumber
        - issueUrl
        - taskId
        - error
      additionalProperties: false
      description: Progress of a task submission. `queued` means the run was enqueued.
    TaskSubmissionRequest:
      type: object
      properties:
        repository:
          type: string
          pattern: ^[\w.-]+\/[\w.-]+$
          description: "`owner/name` of an enabled repository you can push to."
        instruction:
          type: string
          minLength: 1
          maxLength: 50000
          description: What the agent should do; becomes the GitHub issue body.
        agentAlias:
          description: Agent to route to. Omit to use the instance default.
          type: string
        model:
          description: Model of the agent. Omit to use the agent default.
          type: string
        todoIds:
          description: Repository to-dos this submission resolves.
          type: array
          items:
            type: string
        autoMerge:
          type: boolean
        runUltrafix:
          type: boolean
        ultrafixGoal:
          description: "Requires `runUltrafix: true`."
          type: integer
          minimum: 1
          maximum: 10
        ultrafixMaxCycles:
          description: "Requires `runUltrafix: true`."
          type: integer
          minimum: 1
          maximum: 10
        maxCostUsd:
          description: Per-task spend cap in USD; 0 or omitted uses the repository or instance cap.
          type: number
          minimum: 0
          maximum: 100000
      required:
        - repository
        - instruction
      additionalProperties: false
      description: A request to open a GitHub issue and start an implementation run for it.
    TaskSummary:
      type: object
      properties:
        id:
          type: string
          description: Task (run) identifier.
        issueId:
          type: string
          description: Same value as `id`; kept for older clients.
        repository:
          type: string
          description: "`owner/name` of the repository."
        repositoryOwner:
          type:
            - string
            - "null"
        repositoryName:
          type:
            - string
            - "null"
        issueNumber:
          anyOf:
            - type: integer
            - type: "null"
        prNumber:
          anyOf:
            - type: integer
            - type: "null"
        linkedIssueNumber:
          anyOf:
            - type: integer
            - type: "null"
        title:
          type:
            - string
            - "null"
        subtitle:
          type:
            - string
            - "null"
        status:
          type: string
          description: Worker lifecycle state, for example `processing`, `completed` or `failed`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        processedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        failedReason:
          type:
            - string
            - "null"
        commitHash:
          type:
            - string
            - "null"
        progress:
          type: number
          description: "Coarse progress percentage: 0, 50 or 100."
        modelName:
          type:
            - string
            - "null"
        llmProvider:
          type:
            - string
            - "null"
        planIssueStatus:
          type:
            - string
            - "null"
        score:
          description: Final review score of the run, when it was reviewed.
          type:
            - number
            - "null"
      required:
        - id
        - issueId
        - repository
        - repositoryOwner
        - repositoryName
        - issueNumber
        - prNumber
        - linkedIssueNumber
        - title
        - subtitle
        - status
        - createdAt
        - updatedAt
        - completedAt
        - processedAt
        - failedReason
        - commitHash
        - progress
        - modelName
        - llmProvider
        - planIssueStatus
        - score
      additionalProperties: {}
      description: One task run as listed by `GET /api/tasks`.
  responses:
    EnvelopeUnauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvelopeForbidden:
      description: The caller lacks the instance permission named in `x-propr-permission`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvelopeUnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LegacyUnauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyForbidden:
      description: The caller lacks the instance permission named in `x-propr-permission`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyUnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Browser session created by the GitHub OAuth login.
    bearerAuth:
      type: http
      scheme: bearer
      description: A GitHub token (when `ENABLE_BEARER_AUTH` is not `false`) or a desktop/CLI instance token (`propr_it_…`).
    mcpOAuth:
      type: oauth2
      description: OAuth 2.1 access token issued to MCP clients. Every token carries `read`; tools require further scopes.
      flows:
        authorizationCode:
          authorizationUrl: /authorize
          tokenUrl: /token
          scopes:
            read: MCP `read` scope
            plan: MCP `plan` scope
            publish: MCP `publish` scope
            execute: MCP `execute` scope
            review: MCP `review` scope
            merge: MCP `merge` scope
            deploy: MCP `deploy` scope
            manage: MCP `manage` scope
    webhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC SHA-256 signature of the body with `GH_WEBHOOK_SECRET`.
