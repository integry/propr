  /api/task-submissions:
    post:
      operationId: createTaskSubmission
      summary: Submit a task
      description: |-
        Opens a GitHub issue in the repository with the instruction, applies the routing labels and enqueues the implementation run.

        Submissions are idempotent per user and `Idempotency-Key`: repeating a request with the same key and content returns the existing submission and resumes it if it stopped part way. Reusing a key with different content is rejected with `409`.

        Send JSON, or `multipart/form-data` with the JSON in a `payload` field and up to 10 `files` attachments.
      tags:
        - Task submissions
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-chosen identity of this submission, for example a UUID.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskSubmissionRequest"
          multipart/form-data:
            schema:
              type: object
              required:
                - payload
              properties:
                payload:
                  type: string
                  description: The `TaskSubmissionRequest` as a JSON string.
                  contentMediaType: application/json
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    contentMediaType: application/octet-stream
      responses:
        "200":
          description: The issue was created and the run is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSubmission"
        "202":
          description: The submission is in progress or stopped part way (`failed`); poll or retry it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSubmission"
        "400":
          description: Missing key, invalid body, or the repository, agent or model cannot be used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "403":
          description: You lack write access to the repository, or the instance is in demo mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "409":
          description: The key was already used with different content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: member
      x-legacy-error: true
  /api/task-submissions/{key}:
    get:
      operationId: getTaskSubmission
      summary: Get a task submission
      tags:
        - Task submissions
      security:
        - sessionCookie: []
