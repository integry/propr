      required:
        - code
        - message
      additionalProperties: false
      description: The common error envelope. New routes return it for every 4xx and 5xx response.
    ExtensionItemEnabledRequest:
      type: object
      properties:
        item:
          anyOf:
            - type: object
              properties:
                kind:
                  type: string
                  const: server
                name:
                  type: string
