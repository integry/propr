        base:
          type: string
        state:
          type: string
          enum:
            - open
            - merged
            - closed
        draft:
          type: boolean
        verdict:
          type: string
          enum:
            - ready
            - waiting
            - blocked
            - merged
            - closed
            - unknown
          description: "`merged`/`closed` from the PR state; otherwise `blocked` if any gate fails, else `waiting` if any gate waits, else `unknown` if any gate is unknown, else `ready`."
        gates:
          type: array
          items:
            type: object
            properties:
              gate:
                type: string
                enum:
                  - open
                  - not_draft
                  - checks
                  - mergeable
                  - human_review
                  - ai_review
                  - ultrafix
                  - active_work
                  - policy
              status:
                type: string
                enum:
                  - pass
                  - waiting
                  - fail
                  - unknown
                  - not_applicable
              reason:
                type: string
                description: "Stable reason code. open: `pull_request_open`, `pull_request_merged`, `pull_request_closed`; not_draft: `not_draft`, `draft`; checks: `checks_passing`, `checks_not_passing`, `no_ci`, `waiting_for_ci`, `unavailable`; mergeable: `mergeable`, `merge_conflict`, `branch_behind_base`, `branch_protection_blocked`, `merge_state_unknown`; human_review: `approved`, `no_changes_requested`, `changes_requested`, `review_required`, `review_state_unavailable`; ai_review: `goal_reached`, `no_review`, `review_stale_head`, `score_below_goal`, `review_scores_unavailable`; ultrafix: `ultrafix_succeeded`, `ultrafix_active`, `ultrafix_pending`, `ultrafix_failed`, `ultrafix_state_unavailable`, `ultrafix_not_requested`; active_work: `no_active_work`, `propr_work_active`, `active_work_unavailable`; policy: an auto-merge policy reason (`armed`, `skipped_*`), `auto_merge_not_requested`, `auto_merge_request_unavailable` or `pull_request_changed`."
              detail:
                type: string
            required:
              - gate
              - status
              - reason
            additionalProperties: false
          description: "Every gate, in this order: open, not_draft, checks, mergeable, human_review, ai_review, ultrafix, active_work, policy."
        blockingReasons:
          type: array
          items:
            type: string
          description: Reason codes of gates with status `fail`.
        waitingReasons:
          type: array
          items:
            type: string
          description: Reason codes of gates with status `waiting` or `unknown`.
        review:
          anyOf:
            - type: object
              properties:
                score:
                  type: number
                goal:
                  type: number
                goalReached:
                  type: boolean
                reviewedHead:
                  type:
                    - string
                    - "null"
                matchesCurrentHead:
                  type: boolean
              required:
                - score
                - goal
                - goalReached
                - reviewedHead
                - matchesCurrentHead
              additionalProperties: false
            - type: "null"
          description: Latest persisted ProPR AI review; null when there is none.
        ultrafix:
          anyOf:
            - type: object
              properties:
                active:
                  type: boolean
                completionStatus:
                  anyOf:
                    - type: string
                      enum:
                        - succeeded
                        - failed
                    - type: "null"
                labelPresent:
                  type: boolean
              required:
                - active
                - completionStatus
                - labelPresent
              additionalProperties: false
            - type: "null"
          description: Null when the Ultrafix state could not be read.
        checks:
          type: object
          properties:
            reason:
              type: string
              enum:
                - checks_passing
                - checks_not_passing
                - no_ci
                - waiting_for_ci
                - unavailable
            blockingFailed:
              type: array
              items:
                type: string
            blockingPending:
              type: array
              items:
                type: string
            nonBlockingCount:
              type: integer
              minimum: 0
          required:
