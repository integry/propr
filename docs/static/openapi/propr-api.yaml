  /api/repository-events:
    get:
      operationId: listRepositoryEvents
      summary: List repository change events after a cursor
      description: "Reads the durable change-event journal of one repository (pull request, epic queue and plan issue changes) after `afterCursor`, in journal order, optionally filtered by domain, type, pull request and plan. Delivery is at-least-once: resume with the cursor of the last event you processed. A call without a cursor starts at the current end of the journal and returns the current cursor with no history, unless `fromStart=true`. The caller needs read access to the repository on GitHub (the check MCP `list_pull_requests` applies); events of other repositories are never returned."
      tags:
        - Repositories
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: repository
          in: query
          required: true
          description: "`owner/repo`. The caller must be able to read it on GitHub, and it must be configured and enabled on this instance."
          schema:
            type: string
        - name: afterCursor
          in: query
          required: false
          description: Opaque cursor from an earlier response for this repository. Only events after it are returned.
          schema:
            type: string
            maxLength: 512
        - name: fromStart
          in: query
          required: false
          description: "Without `afterCursor`: `true` starts at the oldest retained event. By default a call without a cursor starts at the current end of the journal and returns no history."
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: domains
          in: query
          required: false
          description: "Comma-separated domains: `pull_request`, `epic_queue`, `plan_issue`."
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: "Comma-separated event types: `opened`, `head_changed`, `review_scored`, `ultrafix_started`, `ultrafix_ended`, `auto_merge_decision`, `merged`, `closed`, `started`, `advanced`, `blocked`, `completed`, `status_changed`."
          schema:
            type: string
        - name: pullRequest
          in: query
          required: false
          description: Only events of this pull request number.
          schema:
            type: integer
            minimum: 1
        - name: planId
          in: query
          required: false
          description: Only events of this plan.
          schema:
            type: string
            maxLength: 255
        - name: limit
          in: query
          required: false
          description: Most events returned; defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Matching events and the cursor to resume from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryEventList"
        "400":
          description: "`INVALID_INPUT` (a malformed parameter), `CURSOR_INVALID` (the cursor is malformed or was not issued here) or `CURSOR_WRONG_REPOSITORY` (the cursor belongs to another repository). The `hint` says how to recover."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/EnvelopeUnauthorized"
        "404":
          description: "`REPOSITORY_NOT_ACCESSIBLE`: the repository is not configured and enabled here, or the caller cannot read it on GitHub."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "`CURSOR_EXPIRED`: the cursor is older than the retained journal, so events after it may have been pruned. This is never reported as an empty result."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/EnvelopeUnexpectedError"
      x-propr-query-type: RepositoryEventsQuery
      x-propr-auth: member
  /api/repository-events/wait:
    get:
      operationId: waitRepositoryEvents
      summary: Wait for repository change events after a cursor
      description: "Blocks for at most `timeoutSeconds` (default 15, max 30) until a matching event exists after the cursor, then returns it like the list read. Returns at once when matching events already exist. A timeout is an ordinary `200` with `outcome: timeout` and the starting cursor unchanged. Disconnecting only releases the waiter. Concurrent waits per owner are limited on each API process, counted together with MCP `wait_repository_events`."
      tags:
        - Repositories
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: repository
          in: query
          required: true
          description: "`owner/repo`. The caller must be able to read it on GitHub, and it must be configured and enabled on this instance."
          schema:
            type: string
        - name: afterCursor
          in: query
          required: false
          description: Opaque cursor from an earlier response for this repository. Only events after it are returned.
          schema:
            type: string
            maxLength: 512
        - name: fromStart
          in: query
          required: false
          description: "Without `afterCursor`: `true` starts at the oldest retained event. By default a call without a cursor starts at the current end of the journal and returns no history."
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: domains
          in: query
          required: false
          description: "Comma-separated domains: `pull_request`, `epic_queue`, `plan_issue`."
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: "Comma-separated event types: `opened`, `head_changed`, `review_scored`, `ultrafix_started`, `ultrafix_ended`, `auto_merge_decision`, `merged`, `closed`, `started`, `advanced`, `blocked`, `completed`, `status_changed`."
          schema:
            type: string
        - name: pullRequest
          in: query
          required: false
          description: Only events of this pull request number.
          schema:
            type: integer
            minimum: 1
        - name: planId
          in: query
          required: false
          description: Only events of this plan.
          schema:
            type: string
            maxLength: 255
        - name: limit
          in: query
          required: false
          description: Most events returned; defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: timeoutSeconds
          in: query
          required: false
          description: Seconds to block when no matching event exists yet; defaults to 15.
          schema:
            type: number
            minimum: 0
            maximum: 30
      responses:
        "200":
          description: Matching events, or a timeout with the unchanged cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryEventWait"
        "400":
          description: "`INVALID_INPUT`, `CURSOR_INVALID` or `CURSOR_WRONG_REPOSITORY`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/EnvelopeUnauthorized"
        "404":
          description: "`REPOSITORY_NOT_ACCESSIBLE`: the repository is not configured and enabled here, or the caller cannot read it on GitHub."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "`CURSOR_EXPIRED`: the cursor is older than the retained journal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "`WAIT_LIMIT`: too many repository event waits are open for this owner on this server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
