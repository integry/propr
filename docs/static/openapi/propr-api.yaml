# packages/api/openapi. Do not edit; `npm run gen:openapi:check` fails when stale.
openapi: 3.1.0
info:
  title: ProPR Dashboard API
  version: 2026-06-27
  summary: REST API of a self-hosted ProPR instance.
  description: |-
    The HTTP API the ProPR web UI, desktop app and CLI use. It is served by the dashboard API process under `/api`.

    ## Authentication

    Unless an operation says otherwise, send one of:

    - the browser session cookie set by `GET /api/auth/github`;
    - `Authorization: Bearer <GitHub token>`, accepted while `ENABLE_BEARER_AUTH` is not `false` (the default);
    - `Authorization: Bearer propr_it_…`, a desktop or CLI instance token issued by pairing.

    The caller's GitHub account must be allowed on the instance. Operations with `x-propr-permission` also need that instance permission (admins have all of them). Demo instances reject every mutating request.

    ## Errors

    New routes answer every error with the `ErrorEnvelope` (`code`, `message`, optional `hint`). Existing routes still return the ad-hoc `LegacyError` (`{ "error": "…" }`) and are marked `x-legacy-error: true`.

    ## Coverage

    Every registered route is listed. Routes without an annotation carry `x-undocumented: true`; `info.x-route-coverage` counts them.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-route-coverage:
    total: 230
    documented: 32
    undocumented: 198
servers:
  - url: "{origin}"
    description: Your ProPR API origin, for example the value of `API_PUBLIC_URL`.
    variables:
      origin:
        default: http://localhost:4000
tags:
  - name: System
    description: Health, compatibility and status.
  - name: Authentication
    description: Browser login and the signed-in user.
  - name: Tasks
    description: Task runs, their events, output and follow-ups.
  - name: Task submissions
    description: Idempotent creation of new tasks from an instruction.
  - name: Goals
    description: Long-running goals and their inputs.
  - name: Planner
    description: Plan Studio drafts, revisions and generation.
  - name: Repositories
    description: "Repository context: summaries, chat, to-dos, media and GitHub metadata."
  - name: Observability
    description: Dashboard, statistics, queue, activity and LLM metrics.
  - name: Notifications
    description: Inbox notifications, preferences and Web Push subscriptions.
  - name: Voice
    description: Spoken briefings.
  - name: Desktop
    description: Desktop and CLI discovery, pairing and instance tokens.
  - name: Configuration
    description: Instance settings. Most routes require a management permission.
  - name: Agents
    description: Agent login, images, runtime packages and health.
  - name: Administration
    description: Instance members and MCP administration.
  - name: MCP
    description: The Model Context Protocol endpoint and its browser pages.
  - name: Webhooks
    description: GitHub webhook intake.
