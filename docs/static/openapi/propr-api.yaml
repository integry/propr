    FollowupHandoffRecoverySummary:
      type: object
      properties:
        inspected:
          type: integer
          minimum: 0
        published:
          type: integer
          minimum: 0
          description: Interrupted work recovered and published exactly once.
        noChanges:
          type: integer
          minimum: 0
          description: Interrupted runs that produced nothing; their requests were returned to the queue (settlement `returned_to_queue`).
        settled:
          type: integer
          minimum: 0
          description: Runs whose no-change completion, failure or usage-limit retry the normal path had already delivered or scheduled; recorded without republishing or requeueing.
        cleanupPending:
          type: integer
          minimum: 0
          description: Publication settled but branch release still owed; retried on the next pass.
        skippedLiveAgent:
          type: integer
          minimum: 0
        failedClosed:
          type: integer
          minimum: 0
          description: Records whose container evidence was unavailable or ambiguous; left untouched.
        awaitingOperator:
          type: integer
          minimum: 0
        lockedByOtherWriter:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
          description: Records whose recovery failed (for example unreachable remote evidence); retained for the next pass.
      required:
        - inspected
        - published
        - noChanges
        - settled
        - cleanupPending
        - skippedLiveAgent
        - failedClosed
        - awaitingOperator
        - lockedByOtherWriter
        - errors
      additionalProperties: false
      description: Counts of one recovery pass. Keyed passes inspect at most the addressed pull request.
    FollowupHandoffReleaseRequest:
      type: object
      properties:
        force:
          description: Also release a branch whose retained worktree still holds unpublished work. Never deletes worktree files, and never overrides a live or unverifiable agent.
          type: boolean
      additionalProperties: false
    FollowupHandoffReleaseResult:
      type: object
      properties:
        released:
          type: boolean
        reason:
          description: Refusal code when `released` is false, for example `agent_still_running`, `liveness_unavailable`, `lease_held_by_live_writer`, `worktree_holds_unpublished_work`, `branch_still_registered` (a Git worktree registration still holds the branch, even after a forced detach), `worktree_registrations_unavailable` or `cancelled_claims_withdrawal_failed` (the claimed comments of a cancelled request could not be withdrawn from the pending list, so releasing could let them run).
          type: string
      required:
        - released
      additionalProperties: false
      description: "Outcome of a release request; refusals answer `409` with `released: false`."
    FollowupHandoffResumeRequest:
      type: object
      properties:
        authorizeCancelled:
          description: Set `true` to explicitly authorize publishing work the user cancelled. Without it, resume re-arms the operator-held record and refuses cancelled work with code `requires_cancellation_authorization`.
          type: boolean
      additionalProperties: false
    FollowupHandoffResumeResult:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/FollowupHandoffRecoverySummary"
        status:
          anyOf:
            - $ref: "#/components/schemas/FollowupHandoffStatus"
            - type: "null"
          description: State after the keyed recovery pass; `null` once the handoff retired completely.
      required:
        - summary
        - status
      additionalProperties: false
    FollowupHandoffStatus:
      type: object
      properties:
        repository:
          type: string
          description: Lowercase `owner/repo` of the pull request the handoff belongs to.
        pullRequest:
          type: integer
          exclusiveMinimum: 0
        taskId:
          type: string
          description: Task whose interrupted follow-up publication the handoff records.
        predecessorTaskIds:
          type: array
          items:
            type: string
          description: Source task lineage recorded when the agent launched.
        successorTaskId:
          description: Task that adopted the handoff during recovery, when any.
          type:
            - string
            - "null"
        phase:
          type: string
          enum:
            - agent_running
            - agent_exited
            - committed
            - pushed
            - comment_published
            - cleanup_pending
          description: Exact publication step recovery resumes from. `cleanup_pending` means everything is published and only branch release is owed.
        status:
          type: string
          enum:
            - active
            - awaiting_operator
            - released
          description: "`active` records are recovered automatically; `awaiting_operator` records never publish without an explicit operator decision."
        statusReason:
          description: Why the handoff is held or failed closed, for example `cancelled_by_user`, `worktree_missing`, `head_advanced_externally`, `usage_limit_retry_unconfirmed`, `liveness_unavailable`. A mutable diagnostic; see `settlement` for the durable outcome.
          type:
            - string
            - "null"
        settlement:
          anyOf:
            - type: string
              enum:
                - returned_to_queue
                - usage_limit_retry_scheduling
                - usage_limit_retry_scheduled
            - type: "null"
          description: "Durable owner of the claimed comments once the attempt settles without publishing: `returned_to_queue` (recovery returned them to the pending list), `usage_limit_retry_scheduled` (a scheduled usage-limit retry job owns them; recovery never requeues them) or `usage_limit_retry_scheduling` (the worker stopped around the queue add; held for an operator as `usage_limit_retry_unconfirmed`). Unlike `statusReason`, later diagnostics never overwrite it, so the `noChanges`/`settled` counters stay correct."
        operatorAuthorized:
          type: boolean
          description: Whether an operator explicitly authorized publishing user-cancelled work.
        liveness:
          type: string
          description: Agent container liveness evidence, for example `running`, `stopped`, `not_found` or `unavailable` (recovery fails closed on the latter).
        branchName:
          type: string
          description: PR head branch still attached to the retained worktree until cleanup releases it.
        commitHash:
          description: Commit recovery is bound to publish, once recorded.
          type:
            - string
            - "null"
        completionCommentUrl:
          description: Delivered completion comment; recovery never overwrites it.
          type:
            - string
            - "null"
        nextAction:
          type: string
          description: Operator guidance for the current state.
        retainedWorktreePath:
          type: string
          description: Host path of the retained worktree. Deliberately admin-only; never shown on member routes.
        updatedAt:
          type: number
          description: Unix milliseconds of the last durable update.
      required:
        - repository
        - pullRequest
        - taskId
        - predecessorTaskIds
        - successorTaskId
        - phase
        - status
        - statusReason
        - settlement
        - operatorAuthorized
        - liveness
        - branchName
        - commitHash
        - completionCommentUrl
        - nextAction
        - retainedWorktreePath
        - updatedAt
      additionalProperties: false
      description: Operator-facing status of one durable follow-up publication handoff.
