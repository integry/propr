          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          description: MCP is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: public
      x-legacy-error: true
  /revoke:
    post:
      operationId: revokeMcpToken
      summary: Revoke an MCP access or refresh token
      description: RFC 7009 revocation. The `application/x-www-form-urlencoded` body carries `token`, optionally `token_type_hint`, and `client_id`. Served by the MCP SDK's OAuth router at the API origin root, and only while MCP is enabled. See the MCP guide (docs/features/mcp).
      tags:
        - MCP
      security: []
      responses:
        "200":
          description: The token is revoked, or was not valid. The body is `{}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"
        "400":
          description: RFC 7009 error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          description: MCP is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: public
      x-legacy-error: true
  /token:
    post:
      operationId: issueMcpToken
      summary: Exchange an authorization code or refresh token
      description: "OAuth 2.1 token endpoint for public clients (`token_endpoint_auth_method: none`). The `application/x-www-form-urlencoded` body carries `grant_type` (`authorization_code` with `code`, `code_verifier` and `redirect_uri`, or `refresh_token` with `refresh_token`), `client_id` and optionally `resource`. Served by the MCP SDK's OAuth router at the API origin root, and only while MCP is enabled. See the MCP guide (docs/features/mcp)."
      tags:
        - MCP
      security: []
      responses:
        "200":
          description: "RFC 6749 token response: `access_token`, `token_type`, `expires_in`, `scope` and `refresh_token`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"
        "400":
          description: RFC 6749 error, for example `invalid_grant`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          description: MCP is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: public
      x-legacy-error: true
  /webhook:
    post:
      operationId: receiveGitHubWebhook
      summary: Receive a GitHub webhook delivery
      description: Registered only when `GITHUB_EVENT_INTAKE_MODE=direct_webhook`. Deliveries must be signed with `GH_WEBHOOK_SECRET`.
      tags:
        - Webhooks
      security:
        - webhookSignature: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          description: GitHub event name.
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub delivery identifier.
          schema:
            type: string
      requestBody:
        required: true
        description: The GitHub event payload.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Accepted.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: webhook
      x-legacy-error: true
components:
  schemas:
    AssignableUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AttributedUser"
        truncated:
          type: boolean
          description: True when the repository has more assignable users than were listed.
      required:
        - users
        - truncated
      additionalProperties: false
      description: Users that can be assigned to issues and pull requests of a repository.
    AttributedUser:
      type: object
      properties:
        id:
          type: string
          description: Stable GitHub numeric user id.
        login:
          type: string
        displayName:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
      required:
        - id
        - login
        - displayName
        - avatarUrl
      additionalProperties: false
      description: A GitHub user work is assigned or attributed to.
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        username:
          type: string
        displayName:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - admin
            - member
        permissions:
          type: array
          items:
            type: string
            enum:
              - instance.manage_agents
              - instance.manage_members
              - instance.manage_runtime
              - instance.manage_settings
        authorizationSource:
          type: string
          enum:
            - bootstrap
            - local
            - managed
            - implicit
            - demo
      required:
        - id
        - login
        - username
        - role
        - permissions
        - authorizationSource
      additionalProperties: false
      description: The signed-in GitHub user and their instance role.
    Compatibility:
      type: object
      properties:
        version:
          type: string
          description: ProPR release version of the API server.
        apiCompatibility:
          type: string
          description: API compatibility date clients negotiate against.
        uiCompatibility:
          type: string
          description: Oldest web UI compatibility date the API accepts.
        desktopAuthentication:
          $ref: "#/components/schemas/DesktopAuthenticationCapabilities"
      required:
        - version
        - apiCompatibility
        - uiCompatibility
        - desktopAuthentication
      additionalProperties: false
      description: Version and capability metadata used for client compatibility negotiation.
    DemoModeStatus:
      type: object
      properties:
        demoMode:
          type: boolean
      required:
        - demoMode
      additionalProperties: false
    DesktopAuthenticationCapabilities:
      type: object
      properties:
        protocolVersion:
          type: number
          const: 2
        browserPairing:
          type: boolean
        instanceBearerTokens:
          type: boolean
        socketIoBearerAuthentication:
          type: boolean
      required:
        - protocolVersion
        - browserPairing
        - instanceBearerTokens
        - socketIoBearerAuthentication
      additionalProperties: false
    DesktopDiscovery:
      type: object
      properties:
        schemaVersion:
          type: integer
        product:
          type: string
          const: ProPR
        canonicalEndpoint:
          type:
            - string
            - "null"
        publicInstanceIdentity:
          anyOf:
            - type: object
              properties: {}
              additionalProperties: {}
            - type: "null"
        version:
          type: string
        apiCompatibility:
          type: string
        uiCompatibility:
          type: string
        desktopAuthentication:
          $ref: "#/components/schemas/DesktopAuthenticationCapabilities"
      required:
        - schemaVersion
        - product
        - canonicalEndpoint
        - publicInstanceIdentity
        - version
        - apiCompatibility
        - uiCompatibility
        - desktopAuthentication
      additionalProperties: {}
      description: Public, credential-free discovery metadata for desktop and CLI pairing.
    DesktopPairingActivationReceipt:
      type: object
      properties:
        status:
          type: string
          const: active
        receipt:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
        activatedAt:
          type: string
          format: date-time
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the instance token expires; `null` when it does not.
      required:
        - status
        - receipt
        - activatedAt
        - expiresAt
      additionalProperties: false
      description: The instance token is active.
    DesktopPairingCancellation:
      type: object
      properties:
        status:
          type: string
          const: cancelled
        cancelledAt:
          type: string
          format: date-time
      required:
        - status
        - cancelledAt
      additionalProperties: false
      description: The provisional instance token was revoked.
    DesktopPairingPending:
      type: object
      properties:
        status:
          type: string
          const: pending
        interval:
          type: integer
          minimum: 1
          maximum: 60
          description: Seconds to wait before the next poll.
      required:
        - status
        - interval
      additionalProperties: false
      description: The pairing is not approved yet (HTTP 202).
    DesktopPairingPoll:
      anyOf:
        - $ref: "#/components/schemas/DesktopPairingPending"
        - $ref: "#/components/schemas/DesktopPairingProvisional"
      description: State of a pairing, by `status`.
    DesktopPairingPollRequest:
      type: object
      properties:
        deviceSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - deviceSecret
      additionalProperties: false
    DesktopPairingProvisional:
      type: object
      properties:
        status:
          type: string
          const: provisional
        token:
          type: string
          pattern: ^propr_it_[A-Za-z0-9_-]{43}$
          description: Instance token. It works only after the pairing is activated.
        tokenType:
          type: string
          const: Bearer
        activationTicket:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        activationExpiresAt:
          type: string
          format: date-time
          description: Activate or cancel before this time.
        instanceId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$
          description: "`publicInstanceIdentity.instanceId` from discovery."
        origin:
          type: string
          description: Canonical API origin the client discovered, for example `https://propr.example.com`.
        scope:
          type: string
          const: desktop-instance
        credentialGeneration:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
          description: Client-chosen generation that identifies this credential.
      required:
        - status
        - token
        - tokenType
        - activationTicket
        - activationExpiresAt
        - instanceId
        - origin
        - scope
        - credentialGeneration
      additionalProperties: false
      description: The pairing was approved and a provisional instance token was issued (HTTP 200).
    DesktopPairingStart:
      type: object
      properties:
        pairingId:
          type: string
          pattern: ^dpr_[A-Za-z0-9_-]{22}$
        deviceSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Secret the client presents on every later pairing request. Never shown to the browser.
        approvalUrl:
          type: string
          description: Same-origin URL the user opens to approve the pairing.
        expiresAt:
          type: string
          format: date-time
          description: The pairing expires at this time, at most 30 minutes after it started.
        interval:
          type: integer
          minimum: 1
          maximum: 60
          description: Seconds to wait between polls.
      required:
        - pairingId
        - deviceSecret
        - approvalUrl
        - expiresAt
        - interval
      additionalProperties: false
      description: A started pairing.
    DesktopPairingStartRequest:
      type: object
      properties:
        clientName:
          type: string
          minLength: 1
          maxLength: 80
          description: Shown on the approval page; 1 to 80 printable characters.
        instanceId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$
          description: "`publicInstanceIdentity.instanceId` from discovery."
        origin:
          type: string
          description: Canonical API origin the client discovered, for example `https://propr.example.com`.
        scope:
          type: string
          const: desktop-instance
        credentialGeneration:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
          description: Client-chosen generation that identifies this credential.
      required:
        - clientName
        - instanceId
        - origin
        - scope
        - credentialGeneration
      additionalProperties: false
      description: Starts a pairing for the instance named by the binding fields.
    DesktopPairingTicket:
      type: object
      properties:
        deviceSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        activationTicket:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: "`activationTicket` from the provisional poll response."
        instanceId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$
          description: "`publicInstanceIdentity.instanceId` from discovery."
        origin:
          type: string
          description: Canonical API origin the client discovered, for example `https://propr.example.com`.
        scope:
          type: string
          const: desktop-instance
        credentialGeneration:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
          description: Client-chosen generation that identifies this credential.
      required:
        - deviceSecret
        - activationTicket
        - instanceId
        - origin
        - scope
        - credentialGeneration
      additionalProperties: false
      description: Proof of a provisional pairing, used to activate or cancel it.
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: string
          description: Stable, machine-readable error code, for example `TASK_NOT_FOUND`.
        message:
          type: string
          description: Human-readable explanation that is safe to show to an operator.
        hint:
          description: Optional next step that resolves the error.
          type: string
      required:
        - code
        - message
      additionalProperties: false
      description: The common error envelope. New routes return it for every 4xx and 5xx response.
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
      description: Liveness probe result.
    JsonObject:
      type: object
      properties: {}
      additionalProperties: {}
      description: A JSON object whose fields are not documented yet.
    LegacyError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          description: Machine-readable code, present on authentication and some validation errors.
          type: string
        message:
          description: Longer explanation, present on some authentication errors.
          type: string
      required:
        - error
      additionalProperties: {}
      description: "The ad-hoc error shape most existing routes return. Operations that use it carry `x-legacy-error: true`."
    NotificationUnreadCount:
      type: object
      properties:
        unreadCount:
          type: integer
          minimum: 0
      required:
        - unreadCount
      additionalProperties: false
    TaskAssignees:
      type: object
      properties:
        subject:
          $ref: "#/components/schemas/TaskSubject"
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/AttributedUser"
        synced:
          type: boolean
          description: True when `assignees` was just read from GitHub; false when it is the stored set.
      required:
        - subject
        - assignees
        - synced
      additionalProperties: false
      description: The assignees of a task's GitHub issue or pull request.
    TaskAssigneesResult:
      type: object
      properties:
        subject:
          $ref: "#/components/schemas/TaskSubject"
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/AttributedUser"
          description: The assignees GitHub confirmed.
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/AttributedUser"
          description: Requested users GitHub did not assign; empty on success.
      required:
        - subject
        - assignees
        - rejected
      additionalProperties: false
      description: The assignment GitHub confirmed after a change.
    TaskAssigneesUpdate:
      type: object
      properties:
        logins:
          maxItems: 10
          type: array
          items:
            type: string
          description: GitHub logins to assign. With `replace`, an empty list clears the assignment.
        mode:
          description: "`replace` (default) makes `logins` the whole set; `add` keeps current assignees."
          type: string
          enum:
            - add
            - replace
      required:
        - logins
      additionalProperties: false
      description: A change to a task's assignees.
    TaskEvent:
      type: object
      properties:
        state:
          type: string
          description: Lifecycle state entered at this point.
        timestamp:
          type: string
          description: When the state was entered (ISO 8601).
        reason:
          type:
            - string
            - "null"
        message:
          type: string
        metadata:
          anyOf:
            - type: object
              properties: {}
              additionalProperties: {}
            - type: "null"
      required:
        - state
        - timestamp
      additionalProperties: {}
      description: One entry of a task's lifecycle history.
    TaskFollowupRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536
          description: Comment text posted on the task's pull request or issue.
        target:
          description: Force the comment onto the pull request.
          type: string
          const: pull_request
      required:
        - body
      additionalProperties: false
    TaskFollowupResult:
      type: object
      properties:
        success:
          type: boolean
        state:
          type: string
          enum:
            - queued
            - unknown
        posted:
          type: boolean
        commentId:
          type: integer
        jobId:
          type: string
        sourceTaskId:
          type: string
        message:
          description: Present when the queue submission could not be confirmed.
          type: string
      required:
        - success
        - state
        - posted
        - commentId
        - jobId
        - sourceTaskId
      additionalProperties: false
      description: "Result of posting a follow-up comment. `state: unknown` means inspect the job before retrying."
    TaskHistory:
      type: object
      properties:
        taskId:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/TaskEvent"
          description: Lifecycle events, oldest first.
        taskInfo:
          anyOf:
            - type: object
              properties: {}
              additionalProperties: {}
            - type: "null"
          description: Repository, issue, pull request and agent details of the task.
        budget:
          description: Spend so far against the task's cost cap, when a cap applies.
          type: object
          properties: {}
          additionalProperties: {}
      required:
        - taskId
        - history
        - taskInfo
      additionalProperties: {}
      description: A task together with its lifecycle events.
    TaskPage:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskSummary"
        total:
          type: integer
          description: Matching runs, or matching tasks with `groupBy=task`.
        offset:
          type: integer
        limit:
          type: integer
        totalRuns:
          description: "With `groupBy=task`: matching runs across all tasks."
          type: integer
      required:
        - tasks
        - total
        - offset
        - limit
      additionalProperties: false
      description: A page of task runs.
    TaskSubject:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        number:
          type: integer
          description: Issue or pull request number.
        kind:
          type: string
          enum:
            - issue
            - pull_request
      required:
        - owner
        - repo
        - number
        - kind
      additionalProperties: false
      description: The GitHub issue or pull request a task is assigned through.
    TaskSubmission:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - prepared
            - creating
            - issue_created
            - queued
            - failed
        issueNumber:
          anyOf:
            - type: integer
            - type: "null"
        issueUrl:
          type:
            - string
            - "null"
        taskId:
          type:
            - string
            - "null"
        error:
          type:
            - string
            - "null"
      required:
        - id
        - state
        - issueNumber
        - issueUrl
        - taskId
        - error
      additionalProperties: false
      description: Progress of a task submission. `queued` means the run was enqueued.
    TaskSubmissionRequest:
      type: object
      properties:
        repository:
          type: string
          pattern: ^[\w.-]+\/[\w.-]+$
          description: "`owner/name` of an enabled repository you can push to."
        instruction:
          type: string
          minLength: 1
          maxLength: 50000
          pattern: \S
          description: What the agent should do; becomes the GitHub issue body. Must not be only whitespace.
        agentAlias:
          description: Agent to route to. Omit to use the instance default.
          type: string
        model:
          description: Model of the agent. Omit to use the agent default.
          type: string
        todoIds:
          description: Repository to-dos this submission resolves.
          type: array
          items:
            type: string
        autoMerge:
          type: boolean
        runUltrafix:
          type: boolean
        ultrafixGoal:
          description: "Requires `runUltrafix: true`."
          type: integer
          minimum: 1
          maximum: 10
        ultrafixMaxCycles:
          description: "Requires `runUltrafix: true`."
          type: integer
          minimum: 1
          maximum: 10
        maxCostUsd:
          description: Per-task spend cap in USD; 0 or omitted uses the repository or instance cap.
          type: number
          minimum: 0
          maximum: 100000
      required:
        - repository
        - instruction
      additionalProperties: false
      dependentSchemas:
        ultrafixGoal:
          required:
            - runUltrafix
          properties:
            runUltrafix:
              const: true
        ultrafixMaxCycles:
          required:
            - runUltrafix
          properties:
            runUltrafix:
              const: true
      description: A request to open a GitHub issue and start an implementation run for it.
    TaskSummary:
      type: object
      properties:
        id:
          type: string
          description: Task (run) identifier.
        issueId:
          type: string
          description: Same value as `id`; kept for older clients.
        repository:
          type: string
          description: "`owner/name` of the repository."
        repositoryOwner:
          type:
            - string
            - "null"
        repositoryName:
          type:
            - string
            - "null"
        issueNumber:
          anyOf:
            - type: integer
            - type: "null"
        prNumber:
          anyOf:
            - type: integer
            - type: "null"
        linkedIssueNumber:
          anyOf:
            - type: integer
            - type: "null"
        title:
          type:
            - string
            - "null"
        subtitle:
          type:
            - string
            - "null"
        status:
          type: string
          description: Worker lifecycle state, for example `processing`, `completed` or `failed`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        processedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        failedReason:
          type:
            - string
            - "null"
        commitHash:
          type:
            - string
            - "null"
        progress:
          type: number
          description: "Coarse progress percentage: 0, 50 or 100."
        modelName:
          type:
            - string
            - "null"
        llmProvider:
          type:
            - string
            - "null"
        planIssueStatus:
          type:
            - string
            - "null"
        score:
          description: Final review score of the run, when it was reviewed.
          type:
            - number
            - "null"
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/AttributedUser"
          description: Assignees of the GitHub issue or pull request, as last synced; empty when nobody is assigned.
      required:
        - id
        - issueId
        - repository
        - repositoryOwner
        - repositoryName
        - issueNumber
        - prNumber
        - linkedIssueNumber
        - title
        - subtitle
        - status
        - createdAt
        - updatedAt
        - completedAt
        - processedAt
        - failedReason
        - commitHash
        - progress
        - modelName
        - llmProvider
        - planIssueStatus
        - score
        - assignees
      additionalProperties: {}
      description: One task run as listed by `GET /api/tasks`.
  responses:
    EnvelopeUnauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvelopeForbidden:
      description: The caller lacks the instance permission named in `x-propr-permission`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvelopeUnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LegacyUnauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyForbidden:
      description: The caller lacks the instance permission named in `x-propr-permission`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyUnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Browser session created by the GitHub OAuth login (express-session's default cookie name, which auth.ts keeps).
    bearerAuth:
      type: http
      scheme: bearer
      description: A GitHub token (when `ENABLE_BEARER_AUTH` is not `false`) or a desktop/CLI instance token (`propr_it_…`).
    mcpOAuth:
      type: oauth2
      description: OAuth 2.1 access token issued to MCP clients by `/authorize` and `/token` (PKCE, public clients). Every token carries `read`, which is all `/api/mcp` itself requires; each MCP tool then checks its own scope, as listed in the MCP guide (docs/features/mcp).
      flows:
        authorizationCode:
          authorizationUrl: /authorize
          tokenUrl: /token
          scopes:
            read: MCP `read` scope
            plan: MCP `plan` scope
            publish: MCP `publish` scope
            execute: MCP `execute` scope
            review: MCP `review` scope
            merge: MCP `merge` scope
            deploy: MCP `deploy` scope
            manage: MCP `manage` scope
    webhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC SHA-256 signature of the body with `GH_WEBHOOK_SECRET`.
