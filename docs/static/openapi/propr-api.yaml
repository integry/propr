    TaskSubmission:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - prepared
            - creating
            - issue_created
            - queued
            - failed
        issueNumber:
          anyOf:
            - type: integer
            - type: "null"
        issueUrl:
          type:
            - string
            - "null"
        taskId:
          description: The first execution, kept for compatibility; equals `firstTaskId`.
          type:
            - string
            - "null"
        firstTaskId:
          description: The submission's first execution.
          type:
            - string
            - "null"
        latestTaskId:
          description: "The newest execution of the submission's issue: a label retry or an automatic replacement attempt. Follow it, then `GET /api/task/{taskId}/history` for its `attemptLineage`."
          type:
            - string
            - "null"
        error:
          type:
            - string
            - "null"
      required:
        - id
        - state
        - issueNumber
        - issueUrl
        - taskId
        - firstTaskId
        - latestTaskId
        - error
      additionalProperties: false
      description: Progress of a task submission. `queued` means the run was enqueued.
    TaskSubmissionExtensions:
      type: object
      properties:
        qualified:
          type: boolean
          description: False when the agent's runtime does not use extensions (only Claude and Codex do).
        revision:
          type: integer
          description: Current library revision; tasks resolve the library again at launch.
        servers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              capability:
                type: string
                enum:
                  - read
                  - write
            required:
              - name
              - capability
            additionalProperties: false
          description: MCP servers that would apply. Write servers apply only with `extensionAllowWrite`.
        skills:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
            required:
              - name
            additionalProperties: false
      required:
        - qualified
        - revision
        - servers
        - skills
      additionalProperties: false
      description: Library items that would apply automatically to a task for this repository and agent.
    TaskSubmissionRequest:
      type: object
      properties:
        extensionProfile:
          description: "Removed: extension profiles were replaced by the instance extension library. A non-null value is refused."
          anyOf:
            - $ref: "#/components/schemas/ExtensionSelection"
            - type: "null"
        extensionAllowWrite:
          description: "Write opt-in: library MCP servers with `capability: write` that apply to the repository and agent are exposed to this submission's initial task only (never retries, replacements or follow-ups). Requires the `X-ProPR-Extensions: 1` header; cannot be combined with `disableExtensions`."
          type: boolean
        disableExtensions:
          description: "Run without extensions: adds the `disable-extensions` label to the created issue, so no library MCP servers or skills apply."
          type: boolean
        repository:
          type: string
          pattern: ^[\w.-]+\/[\w.-]+$
          description: "`owner/name` of an enabled repository you can push to."
        instruction:
          type: string
          minLength: 1
          maxLength: 50000
          pattern: \S
          description: What the agent should do; becomes the GitHub issue body. Must not be only whitespace.
        agentAlias:
          description: Agent to route to. Omit to use the instance default.
          type: string
        model:
          description: Model of the agent. Omit to use the agent default.
          type: string
        todoIds:
          description: Repository to-dos this submission resolves.
          type: array
          items:
            type: string
        autoMerge:
          type: boolean
        runUltrafix:
          type: boolean
        ultrafixGoal:
          description: "Requires `runUltrafix: true`."
          type: integer
          minimum: 1
          maximum: 10
        ultrafixMaxCycles:
          description: "Requires `runUltrafix: true`."
          type: integer
          minimum: 1
          maximum: 10
        maxCostUsd:
          description: Per-task spend cap in USD; 0 or omitted uses the repository or instance cap.
          type: number
          minimum: 0
          maximum: 100000
      required:
        - repository
        - instruction
      additionalProperties: false
      dependentSchemas:
        ultrafixGoal:
          required:
            - runUltrafix
          properties:
            runUltrafix:
              const: true
        ultrafixMaxCycles:
          required:
            - runUltrafix
          properties:
            runUltrafix:
              const: true
      description: A request to open a GitHub issue and start an implementation run for it.
    TaskSummary:
      type: object
      properties:
        id:
          type: string
          description: Task (run) identifier.
        issueId:
          type: string
          description: Same value as `id`; kept for older clients.
        repository:
          type: string
          description: "`owner/name` of the repository."
        repositoryOwner:
          type:
            - string
            - "null"
        repositoryName:
          type:
            - string
            - "null"
        issueNumber:
          anyOf:
            - type: integer
            - type: "null"
        prNumber:
          anyOf:
            - type: integer
            - type: "null"
        linkedIssueNumber:
          anyOf:
            - type: integer
            - type: "null"
        title:
          type:
            - string
            - "null"
        subtitle:
          type:
            - string
            - "null"
        status:
          type: string
          description: Worker lifecycle state, for example `processing`, `completed` or `failed`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        processedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        failedReason:
          type:
            - string
            - "null"
        commitHash:
          type:
            - string
            - "null"
        progress:
          type: number
          description: "Coarse progress percentage: 0, 50 or 100."
        modelName:
          type:
            - string
            - "null"
        llmProvider:
          type:
            - string
            - "null"
        planIssueStatus:
          type:
            - string
            - "null"
        prState:
          description: "`merged` once the run's pull request has been merged; absent otherwise."
          type: string
          const: merged
        score:
          description: Final review score of the run, when it was reviewed.
          type:
            - number
            - "null"
        reviewOutcome:
          anyOf:
            - type: string
              enum:
                - clean
                - findings
                - reviewer_failed
            - type: "null"
          description: "What the review that recorded `score` came to: `clean` when every reviewer succeeded and none reported an actionable finding. Null when the run was not a review or its outcome is unknown."
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/AttributedUser"
          description: Assignees of the GitHub issue or pull request, as last synced; empty when nobody is assigned.
      required:
        - id
        - issueId
        - repository
        - repositoryOwner
        - repositoryName
        - issueNumber
        - prNumber
        - linkedIssueNumber
        - title
        - subtitle
        - status
        - createdAt
        - updatedAt
        - completedAt
        - processedAt
        - failedReason
        - commitHash
        - progress
        - modelName
        - llmProvider
        - planIssueStatus
        - score
        - reviewOutcome
        - assignees
      additionalProperties: {}
      description: One task run as listed by `GET /api/tasks`.
  responses:
    EnvelopeUnauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvelopeForbidden:
      description: The caller lacks the instance permission named in `x-propr-permission`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvelopeUnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LegacyUnauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyForbidden:
      description: The caller lacks the instance permission named in `x-propr-permission`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyUnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Browser session created by the GitHub OAuth login (express-session's default cookie name, which auth.ts keeps).
    bearerAuth:
      type: http
      scheme: bearer
      description: A GitHub token (when `ENABLE_BEARER_AUTH` is not `false`) or a desktop/CLI instance token (`propr_it_…`).
    extensionBearer:
      type: http
      scheme: bearer
      description: Ephemeral, run-scoped extension gateway token. Not a GitHub, Connect or MCP OAuth grant.
    mcpOAuth:
      type: oauth2
      description: OAuth 2.1 access token issued to MCP clients by `/authorize` and `/token` (PKCE, public clients). Every token carries `read`, which is all `/api/mcp` itself requires; each MCP tool then checks its own scope, as listed in the MCP guide (docs/features/mcp).
      flows:
        authorizationCode:
          authorizationUrl: /authorize
          tokenUrl: /token
          scopes:
            read: MCP `read` scope
            plan: MCP `plan` scope
            publish: MCP `publish` scope
            execute: MCP `execute` scope
            review: MCP `review` scope
            merge: MCP `merge` scope
            deploy: MCP `deploy` scope
            manage: MCP `manage` scope
    webhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC SHA-256 signature of the body with `GH_WEBHOOK_SECRET`.
    fleetSecret:
      type: apiKey
      in: header
      name: x-propr-fleet-secret
      description: The hosted Fleet control secret, `PROPR_FLEET_CONTROL_SECRET`. The routes that accept it are registered only when that secret is configured.
