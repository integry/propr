  /api/admin/followup-handoffs/{owner}/{repo}/{pr}/release:
    post:
      operationId: releaseFollowupHandoff
      summary: Release the handoff's branch from its retained worktree and retire the record
      description: |-
        Detaches the retained worktree's HEAD (keeping every file) so the branch is usable again, then marks the record released. Refuses while the bound agent is live or unverifiable, while another writer holds the PR lease, or when unpublished work remains — pass `force: true` to release despite unpublished work. Releasing a `usage_limit_retry_unconfirmed` hold records that the usage-limit retry job exists and owns the request (settlement becomes `usage_limit_retry_scheduled`), so its comments are never suppressed as a cancellation; resume instead when no retry job exists. Worktree files are never deleted.

        Requires the `instance.manage_runtime` instance permission.
      tags:
        - Administration
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          description: Repository owner (case-insensitive).
          schema:
            type: string
        - name: repo
          in: path
          required: true
          description: Repository name (case-insensitive).
          schema:
            type: string
        - name: pr
          in: path
          required: true
          description: Pull request number.
          schema:
            type: string
      requestBody:
        required: true
        description: Optional flags; `{}` performs a safe release.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowupHandoffReleaseRequest"
      responses:
        "200":
          description: The branch is free and the record retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowupHandoffReleaseResult"
        "400":
          description: Invalid target or non-boolean flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "403":
          $ref: "#/components/responses/LegacyForbidden"
        "404":
