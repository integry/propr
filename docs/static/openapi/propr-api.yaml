                - ineligible
                - transient
            reason:
              type: string
              description: Eligibility reason code, for example `pr_label`, `linked_issue_label`, `no_auto_merge_label`, `ultrafix_active`.
            policy:
              description: Auto-merge policy reason; null when auto-merge is not requested.
              type:
                - string
                - "null"
          required:
            - eligible
            - reason
            - policy
          additionalProperties: false
        evaluatedAt:
          type: string
          format: date-time
      required:
        - repository
        - number
        - head
        - base
        - state
        - draft
        - verdict
        - gates
        - blockingReasons
        - waitingReasons
        - review
        - ultrafix
        - checks
        - autoMerge
        - evaluatedAt
      additionalProperties: false
      description: Read-only readiness verdict of one pull request. Evaluating it never writes to GitHub or Redis, never updates the branch or merges, and never changes auto-merge state.
    RepositoryEvent:
