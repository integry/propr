                  clientId:
                    type: string
                    pattern: ^[\x21-\x7e]{1,512}$
                  repositories:
                    default: []
                    maxItems: 64
                    type: array
                    items:
                      type: string
                      pattern: ^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$
                  agents:
                    default: []
                    maxItems: 64
                    type: array
