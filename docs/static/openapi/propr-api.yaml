        - name: pr
          in: path
          required: true
          description: Pull request number.
          schema:
            type: string
      requestBody:
        required: true
        description: Optional flags; `{}` resumes a non-cancelled operator hold.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowupHandoffResumeRequest"
      responses:
        "200":
          description: The keyed pass ran; `summary` counts its outcome and `status` is the state afterwards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowupHandoffResumeResult"
        "400":
          description: Invalid target or non-boolean flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "403":
          $ref: "#/components/responses/LegacyForbidden"
        "404":
          description: No handoff is recorded for the pull request (code `not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "409":
          description: "The handoff cannot be resumed. `code` names why: `requires_cancellation_authorization`, `cancellation_authorization_unavailable` (also returned while another writer holds the PR lease), `lease_held_by_live_writer`, `released` or `superseded`."
