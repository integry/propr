                    type: string
                    pattern: ^[a-z][a-z0-9_-]{0,47}$
                  catalogId:
                    type: string
                    pattern: ^[a-z][a-z0-9_-]{0,63}$
                  digest:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  enabled:
                    type: boolean
                  tools:
                    maxItems: 64
                    type: array
                    items:
                      type: string
                      pattern: ^[A-Za-z0-9_.-]{1,128}$
                  capability:
                    type: string
                    enum:
                      - read
                      - write
                  repositories:
                    default: []
                    maxItems: 64
                    type: array
                    items:
                      type: string
                      pattern: ^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$
                  agents:
                    default: []
                    maxItems: 64
                    type: array
                    items:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{1,100}$
                  autoApply:
                    default: true
                    type: boolean
                required:
                  - kind
                  - name
                  - catalogId
                  - digest
                  - enabled
                  - tools
                  - capability
                  - repositories
                  - agents
                  - autoApply
                additionalProperties: false
              - type: object
                properties:
                  name:
                    type: string
                    pattern: ^[a-z][a-z0-9_-]{0,47}$
                  enabled:
                    type: boolean
                  tools:
                    maxItems: 64
                    type: array
                    items:
                      type: string
                      pattern: ^[A-Za-z0-9_.-]{1,128}$
                  capability:
                    type: string
