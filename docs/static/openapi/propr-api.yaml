  /api/tasks/{taskId}/followup:
    post:
      operationId: postTaskFollowup
      summary: Post a follow-up instruction on a task
      description: |-
        Posts the comment on the task's pull request and queues a follow-up run for it. A failed implementation that has no pull request is retried on its issue instead: the comment is posted there and a new issue run is queued.

        When the task, session or correlation id belongs to a goal, only the goal owner can use this route (others get `404`), and only for reads: other methods answer `409` and the goal controls must be used instead.
      tags:
        - Tasks
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          description: Task (run) identifier, as returned in `TaskSummary.id`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFollowupRequest"
      responses:
        "202":
          description: The comment was posted; the outcome distinguishes queued, batched, handled, refused, failed and unknown submissions. An issue retry refuses the comment, without posting it, while it restarts an earlier retry whose start was never confirmed; `restartedRequest` reports that restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskFollowupResult"
        "400":
          description: The comment body or target is invalid, or a pull request command was sent for a task without a pull request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "409":
          description: "The issue cannot be retried: the run has not failed, the issue is closed or done, a run is already queued, or an earlier retry may still start."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "502":
          description: The issue's label history could not be read from GitHub, so the retry could not be tied to its trigger and nothing was posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "503":
          description: The issue retry could not be recorded, so nothing was posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        default:
          $ref: "#/components/responses/LegacyUnexpectedError"
      x-propr-auth: member
      x-legacy-error: true
