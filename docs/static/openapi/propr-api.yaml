      summary: List task runs
      description: Newest first. Filter by status, repository or search text, and page with `limit` and `offset`. With `groupBy=task`, paging counts tasks (the pull request or issue a run belongs to) and a page returns every matching run of its tasks.
      tags:
        - Tasks
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: "`all` (default), `active`, `waiting`, `attention`, or a worker state."
          schema:
            type: string
        - name: repository
          in: query
          required: false
          description: "`owner/name`, or `all` (default)."
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
        - name: forReview
          in: query
          required: false
          description: Only runs whose pull request awaits review.
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: excludeMerged
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: groupBy
          in: query
          required: false
          description: Page by task instead of by run.
          schema:
            type: string
            const: task
        - name: task
          in: query
          required: false
          description: "With `groupBy=task`: only the task this run belongs to."
