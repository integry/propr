<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProPR Dashboard API reference</title>
    <meta name="description" content="OpenAPI 3.1 reference of the ProPR dashboard HTTP API." />
    <link rel="icon" href="/img/logo-mark.png" />
  </head>
  <body>
    <noscript>
      This reference needs JavaScript. Download the
      <a href="/openapi/propr-api.yaml">OpenAPI 3.1 spec (propr-api.yaml)</a> instead.
    </noscript>
    <div id="app"></div>
    <!-- Scalar renders the spec generated by `npm run gen:openapi`. @scalar/api-reference@1.73.0 is
         vendored (see scalar/README.md) so the page also works offline; the hash is pinned. -->
    <script
      src="/openapi/scalar/standalone.js"
      integrity="sha384-OKyMdsDX84ypSZEhVun8YElXk5c2GQaH3EXPOc6ItmVcLDUAvKHYwvDLvAgsqVtB"
    ></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/openapi/propr-api.yaml',
        metaData: { title: 'ProPR Dashboard API reference' },
        hideClientButton: true,
        withDefaultFonts: false,
        // Keep the page self-contained: no telemetry and no hosted Scalar services.
        telemetry: false,
        agent: { disabled: true },
        mcp: { disabled: true },
        showDeveloperTools: 'never',
      });
    </script>
  </body>
</html>
