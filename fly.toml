# fly.toml app configuration file generated for propr-dash-3852 on 2026-11-27T22:33:29Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'propr-dash-3852'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '1m0s'

[build]
  dockerfile = 'docker/Dockerfile.app.prod'

[env]
  CONFIG_REPO_PATH = '/tmp/config_repo'
  DASHBOARD_API_HOST = '::'
  DASHBOARD_API_PORT = '4000'
  DATA_DIR = '/usr/src/app/data'
  DB_FILENAME = '/usr/src/app/data/propr.sqlite'
  NODE_ENV = 'production'
  PROPR_CONTAINERIZED = '1'
  PROPR_FLY_EXIT_STOPS_MACHINE = '1'
  PROPR_FLY_LAUNCH = '1'
  PROPR_INDEXING = 'inline'
  PROPR_INTERNAL_API_URL = 'http://127.0.0.1:4000'
  PROPR_MANAGED_CREDENTIALS_DIR = '/usr/src/app/data/agent-credentials'
  PROPR_PROFILE = 'minimal'
  PROPR_SERVED_UI_API_URL = ''
  PROPR_SERVE_UI = '1'
  PROPR_TRUSTED_PROXY_PEERS = '172.16.0.0/12'
  REDIS_HOST = '127.0.0.1'
  REDIS_PORT = '6379'
  SESSION_REDIS_HOST = '127.0.0.1'
  SESSION_REDIS_PORT = '6379'

[processes]
  app = 'sh scripts/fly-launch-entrypoint.sh'

[[mounts]]
  source = 'propr_data'
  destination = '/usr/src/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[restart]]
  policy = 'on-failure'
  retries = 10

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
