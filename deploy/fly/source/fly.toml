# Fly dashboard launch: Launch an App -> From GitHub (see docs/docs/tutorials/setup-fly.md).
# Builds from source (modified forks, PR branches): set the dashboard's Config path to this file.
# Generated by packages/cli/src/commands/deploy/flyLaunchToml.ts from the same builders as
# `propr deploy fly`; regenerate with `npx tsx packages/cli/scripts/render-fly-launch-toml.ts`.
# No secrets and no account-specific values: the dashboard picks the app name,
# organization and region, and the instance generates its secrets on first boot.

# allInOne drains on SIGTERM; give it time to finish acks and close SQLite.
kill_signal = "SIGTERM"
kill_timeout = "60s"
# Headroom for clone and indexing spikes on the 512 MB Machine, instead of an OOM kill.
swap_size_mb = 512

[build]
  # Builds this checkout. flyctl resolves the path from this file's directory;
  # the build context is the repository root.
  dockerfile = "../../../docker/Dockerfile.app.prod"

[processes]
  # ProPR and Redis in one container (secrets reach it without a per-container list).
  # An image without the launch entry logs how to build from source and stays stopped.
  app = "sh -c 'if [ -f scripts/fly-launch-entrypoint.sh ]; then exec sh scripts/fly-launch-entrypoint.sh; fi; echo fly-launch: this propr/app image has no scripts/fly-launch-entrypoint.sh, it predates the Fly dashboard launch. Set the Config path to deploy/fly/source/fly.toml to build from source, or deploy a newer release. >&2; exit 0'"

[env]
  CONFIG_REPO_PATH = "/tmp/config_repo"
  DASHBOARD_API_HOST = "::"
  DASHBOARD_API_PORT = "4000"
  DATA_DIR = "/usr/src/app/data"
  DB_FILENAME = "/usr/src/app/data/propr.sqlite"
  NODE_ENV = "production"
  PROPR_CONTAINERIZED = "1"
  PROPR_FLY_EXIT_STOPS_MACHINE = "1"
  PROPR_FLY_LAUNCH = "1"
  PROPR_INDEXING = "inline"
  PROPR_INTERNAL_API_URL = "http://127.0.0.1:4000"
  PROPR_MANAGED_CREDENTIALS_DIR = "/usr/src/app/data/agent-credentials"
  PROPR_PROFILE = "minimal"
  PROPR_SERVED_UI_API_URL = ""
  PROPR_SERVE_UI = "1"
  PROPR_TRUSTED_PROXY_PEERS = "172.16.0.0/12"
  REDIS_HOST = "127.0.0.1"
  REDIS_PORT = "6379"
  SESSION_REDIS_HOST = "127.0.0.1"
  SESSION_REDIS_PORT = "6379"

[[mounts]]
  source = "propr_data"
  destination = "/usr/src/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 4000
  force_https = true
  # Fly proxy autostop is traffic-based and would stop the Machine during an
  # agent run that has no HTTP traffic, so it stays off. ProPR's own idle
  # shutdown (off unless chosen in the setup wizard) exits instead, and any
  # request (UI, API, MCP, webhook) starts the stopped Machine again.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[restart]]
  # Only an idle stop exits 0; leave the Machine stopped then, restart anything else.
  policy = "on-failure"
  retries = 10

[[vm]]
  # Free Plan friendly. For large repositories or heavy indexing:
  # `fly scale memory 1024` (or the dashboard's Scaling page).
  size = "shared-cpu-1x"
  memory = "512mb"
