# NOTE: This compose file requires the HOME environment variable to be set.
# Agent credential directories are mounted at ${HOME}/.<agent> on both the host
# and inside containers so path references remain valid when spawning sibling
# agent containers. In CI or systemd contexts where HOME may be unset, export it
# explicitly before running docker-compose (e.g., export HOME=/root).
#
# PREFLIGHT: Before starting, create credential and cache directories for the
# agents you intend to use (Docker will create missing directories as root-owned
# otherwise, which can cause write failures):
#   mkdir -p ~/.claude ~/.codex ~/.gemini /tmp/propr-vibe-prompts
# The CLI/launcher default host Vibe prompt cache is UID-suffixed
# (/tmp/propr-vibe-prompts-$(id -u)); this development compose file mounts the
# explicit /tmp/propr-vibe-prompts path shown below.
#
# For Vibe support, also create:
#   mkdir -p ~/.vibe
#
# For OpenCode support, also create the OpenCode directories and include the
# override file:
#   mkdir -p ~/.config/opencode ~/.local/share/opencode
#   docker compose -f docker-compose.yml -f docker-compose.opencode.yml up
#
# For production deployments that only use a subset of agents, use the launcher
# (docker/launcher/) which conditionally mounts only configured agent directories.
# This compose file is intended for development environments.
services:
  redis:
    restart: unless-stopped
    image: redis:alpine
    ports:
      # Expose Redis for PR preview environments to share sessions
      # Bind to loopback by default so running this development compose file on
      # a public host does not expose unauthenticated Redis to the internet.
      # REDIS_EXTERNAL_PORT allows different ports for different stacks;
      # REDIS_EXTERNAL_BIND_HOST must be set explicitly for trusted bridge access.
      - '${REDIS_EXTERNAL_BIND_HOST:-127.0.0.1}:${REDIS_EXTERNAL_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    networks:
      - propr-net

  daemon:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    init: true
    command: npm run daemon
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/usr/src/app/logs
      # An absolute PROPR_DATA_DIR is mounted at the same path so host DB_FILENAME paths work.
      - ${PROPR_DATA_DIR:-./data}:${PROPR_DATA_DIR:-/usr/src/app/data}
      - /tmp/git-processor:/tmp/git-processor
      # Docker socket for PR preview deployments
      - /var/run/docker.sock:/var/run/docker.sock
      # Worktrees directory for PR branch checkouts
      - /tmp/pr-worktrees:/tmp/pr-worktrees
      # Mount .env for deploy-pr.sh script
      - ${PROPR_ENV_FILE:-./.env}:/usr/src/app/.env:ro
    env_file:
      # Later files win: bundled defaults, then existing installation settings,
      # then this checkout's overrides.
      - docker/compose-backend-defaults.env
      - ${PROPR_ENV_FILE:-.env}
      - .env
    environment:
      - DATA_DIR=${PROPR_DATA_DIR:-/usr/src/app/data}
      # Startup refuses a database outside this bind mount (e.g. a relative DB_FILENAME with a custom PROPR_DATA_DIR).
      - PROPR_DATA_MOUNT=${PROPR_DATA_DIR:-/usr/src/app/data}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:${API_PORT:-4000}}
      - GITHUB_BOT_USERNAME=${GITHUB_BOT_USERNAME:-propr-dev[bot]}
      - STAGING_ENV_FILE=/usr/src/app/.env
    depends_on:
      redis:
        condition: service_started
    networks:
      - propr-net

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    init: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: npm run worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/usr/src/app/logs
      - ./repos:/usr/src/app/repos
      # An absolute PROPR_DATA_DIR is mounted at the same path so host DB_FILENAME paths work.
      - ${PROPR_DATA_DIR:-./data}:${PROPR_DATA_DIR:-/usr/src/app/data}
      - /tmp/git-processor:/tmp/git-processor
      # Mount agent credentials at the same path on both sides so the worker
      # can pass host-valid paths when spawning sibling agent containers.
      # IMPORTANT: Create any missing directories before starting:
      #   mkdir -p ~/.claude ~/.codex ~/.gemini ~/.vibe
      # Docker will create them as root-owned if they do not exist.
      - ${HOME:?HOME must be set}/.claude:${HOME:?HOME must be set}/.claude
      - ${HOME:?HOME must be set}/.gemini:${HOME:?HOME must be set}/.gemini
      - ${HOME:?HOME must be set}/.codex:${HOME:?HOME must be set}/.codex
      - ${HOME:?HOME must be set}/.vibe:${HOME:?HOME must be set}/.vibe:ro
      - ${HOME:?HOME must be set}/.propr/agent-credentials:${HOME:?HOME must be set}/.propr/agent-credentials
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/claude-logs:/tmp/claude-logs
      # Vibe prompt cache — mounted by default so Vibe works when MISTRAL_API_KEY
      # is set. PREFLIGHT for this compose file: mkdir -p /tmp/propr-vibe-prompts
      - /tmp/propr-vibe-prompts:/tmp/propr-vibe-prompts
      # Restricted agent networking: per-run egress proxy sockets, bind-mounted
      # into agent containers by the host Docker daemon at the same path.
      - /tmp/propr-egress:/tmp/propr-egress
    env_file:
      # Later files win: bundled defaults, then existing installation settings,
      # then this checkout's overrides.
      - docker/compose-backend-defaults.env
      - ${PROPR_ENV_FILE:-.env}
      - .env
    environment:
      - DATA_DIR=${PROPR_DATA_DIR:-/usr/src/app/data}
      # Startup refuses a database outside this bind mount (e.g. a relative DB_FILENAME with a custom PROPR_DATA_DIR).
      - PROPR_DATA_MOUNT=${PROPR_DATA_DIR:-/usr/src/app/data}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:${API_PORT:-4000}}
      - CLAUDE_CONFIG_PATH=${HOME:?HOME must be set}/.claude
      - CODEX_CONFIG_PATH=${HOME:?HOME must be set}/.codex
      - ANTIGRAVITY_CONFIG_PATH=${HOME:?HOME must be set}/.gemini
      # Requires docker-compose.opencode.yml to mount this host path for OpenCode.
      - OPENCODE_CONFIG_PATH=${HOME:?HOME must be set}/.config/opencode
      - VIBE_CONFIG_PATH=${HOME:?HOME must be set}/.vibe
      - PROPR_MANAGED_CREDENTIALS_DIR=${HOME:?HOME must be set}/.propr/agent-credentials
      # Optional override for the encrypted OAuth credential collected through
      # the Web UI. App installation tokens cannot upload GitHub attachments.
      - GITHUB_VISUAL_PREVIEW_TOKEN=${GITHUB_VISUAL_PREVIEW_TOKEN:-}
      - PROPR_CONTAINERIZED=1
    depends_on:
      redis:
        condition: service_started
    networks:
      - propr-net

  indexing-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    init: true
    command: npm run indexing-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/usr/src/app/logs
      # An absolute PROPR_DATA_DIR is mounted at the same path so host DB_FILENAME paths work.
      - ${PROPR_DATA_DIR:-./data}:${PROPR_DATA_DIR:-/usr/src/app/data}
      - /tmp/git-processor:/tmp/git-processor
      - ${HOME:?HOME must be set}/.claude:${HOME:?HOME must be set}/.claude:ro
      - ${HOME:?HOME must be set}/.gemini:${HOME:?HOME must be set}/.gemini:ro
      - ${HOME:?HOME must be set}/.codex:${HOME:?HOME must be set}/.codex:ro
      - ${HOME:?HOME must be set}/.vibe:${HOME:?HOME must be set}/.vibe:ro
      - ${HOME:?HOME must be set}/.propr/agent-credentials:${HOME:?HOME must be set}/.propr/agent-credentials
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/claude-logs:/tmp/claude-logs
      # Vibe prompt cache — mounted by default so indexing summarization can
      # pass large prompts to sibling Vibe containers via the host Docker daemon.
      - /tmp/propr-vibe-prompts:/tmp/propr-vibe-prompts
      # Restricted agent networking: per-run egress proxy sockets for summarization containers.
      - /tmp/propr-egress:/tmp/propr-egress
    env_file:
      # Later files win: bundled defaults, then existing installation settings,
      # then this checkout's overrides.
      - docker/compose-backend-defaults.env
      - ${PROPR_ENV_FILE:-.env}
      - .env
    environment:
      - DATA_DIR=${PROPR_DATA_DIR:-/usr/src/app/data}
      # Startup refuses a database outside this bind mount (e.g. a relative DB_FILENAME with a custom PROPR_DATA_DIR).
      - PROPR_DATA_MOUNT=${PROPR_DATA_DIR:-/usr/src/app/data}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:${API_PORT:-4000}}
      - CLAUDE_CONFIG_PATH=${HOME:?HOME must be set}/.claude
      - CODEX_CONFIG_PATH=${HOME:?HOME must be set}/.codex
      - ANTIGRAVITY_CONFIG_PATH=${HOME:?HOME must be set}/.gemini
      # Requires docker-compose.opencode.yml to mount this host path for OpenCode.
      - OPENCODE_CONFIG_PATH=${HOME:?HOME must be set}/.config/opencode
      - VIBE_CONFIG_PATH=${HOME:?HOME must be set}/.vibe
      - PROPR_MANAGED_CREDENTIALS_DIR=${HOME:?HOME must be set}/.propr/agent-credentials
      - PROPR_CONTAINERIZED=1
      # How often to scan for repos needing indexing (default: 5 minutes)
      - INDEXING_SCAN_INTERVAL_MS=${INDEXING_SCAN_INTERVAL_MS:-300000}
      # How often to re-index repos (default: 24 hours)
      - INDEXING_REINDEX_INTERVAL_MS=${INDEXING_REINDEX_INTERVAL_MS:-86400000}
    depends_on:
      redis:
        condition: service_started
    networks:
      - propr-net

  web-ui:
    restart: unless-stopped
    build:
      context: .
      dockerfile: propr-ui/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_OAUTH_API_URL=${VITE_OAUTH_API_URL:-}
    environment:
      # The static UI has no /api proxy; supply its browser-visible API origin at startup.
      # Unset falls back to the local API; set it empty to keep same-origin (reverse proxy) access.
      - PROPR_UI_PUBLIC_API_URL=${PROPR_UI_PUBLIC_API_URL-${VITE_API_BASE_URL:-http://localhost:${API_PORT:-4000}}}
    ports:
      # Allow injection of UI_PORT for PR preview environments, default to 5173
      - '${UI_PORT:-5173}:5173'
    networks:
      - propr-net

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    init: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - sh
      - -c
      - |
        case "$${DB_FILENAME}" in
          "") export DB_FILENAME="$${DATA_DIR:-/usr/src/app/data}/propr.sqlite" ;;
          /*|:memory:|file:*) ;;
          *)
            # Resolve from /usr/src/app like the daemon and workers, and refuse a
            # database that would live outside the data bind mount.
            export DB_FILENAME="$$(node -p 'require("path").resolve("/usr/src/app", process.env.DB_FILENAME)')"
            case "$${DB_FILENAME}" in
              "$${PROPR_DATA_MOUNT:-/usr/src/app/data}"/*) ;;
              *) echo "DB_FILENAME resolves to $${DB_FILENAME}, outside the mounted data directory $${PROPR_DATA_MOUNT:-/usr/src/app/data}. Set an absolute DB_FILENAME inside PROPR_DATA_DIR." >&2; exit 1 ;;
            esac ;;
        esac
        cd /usr/src/app/packages/api && exec npx tsx server.ts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Allow injection of API_PORT for PR preview environments, default to 4000
      - '${API_PORT:-4000}:4000'
    volumes:
      - ${HOME:?HOME must be set}/.claude:${HOME:?HOME must be set}/.claude:ro
      - ${HOME:?HOME must be set}/.gemini:${HOME:?HOME must be set}/.gemini:ro
      - ${HOME:?HOME must be set}/.codex:${HOME:?HOME must be set}/.codex:ro
      - ${HOME:?HOME must be set}/.vibe:${HOME:?HOME must be set}/.vibe:ro
      - ${HOME:?HOME must be set}/.propr/agent-credentials:${HOME:?HOME must be set}/.propr/agent-credentials
      # An absolute PROPR_DATA_DIR is mounted at the same path so host DB_FILENAME paths work.
      - ${PROPR_DATA_DIR:-./data}:${PROPR_DATA_DIR:-/usr/src/app/data}
      - /tmp/claude-logs:/tmp/claude-logs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/git-processor:/tmp/git-processor
      # Vibe prompt cache — mounted by default for consistency with worker.
      - /tmp/propr-vibe-prompts:/tmp/propr-vibe-prompts
      # Worktrees directory for PR branch checkouts
      - /tmp/pr-worktrees:/tmp/pr-worktrees
      # Mount the env file - uses STAGING_ENV_FILE if set, defaults to ./.env
      - ${STAGING_ENV_FILE:-./.env}:/usr/src/app/.env:ro
    env_file:
      # Later files win: bundled defaults, then existing credentials, then the
      # selected local/preview settings.
      - docker/compose-backend-defaults.env
      - ${PROPR_ENV_FILE:-.env}
      - ${STAGING_ENV_FILE:-.env}
    environment:
      - DATA_DIR=${PROPR_DATA_DIR:-/usr/src/app/data}
      # Startup refuses a database outside this bind mount (e.g. a relative DB_FILENAME with a custom PROPR_DATA_DIR).
      - PROPR_DATA_MOUNT=${PROPR_DATA_DIR:-/usr/src/app/data}
      - CLAUDE_CONFIG_PATH=${HOME:?HOME must be set}/.claude
      - CODEX_CONFIG_PATH=${HOME:?HOME must be set}/.codex
      - ANTIGRAVITY_CONFIG_PATH=${HOME:?HOME must be set}/.gemini
      # Requires docker-compose.opencode.yml to mount this host path for OpenCode.
      - OPENCODE_CONFIG_PATH=${HOME:?HOME must be set}/.config/opencode
      - VIBE_CONFIG_PATH=${HOME:?HOME must be set}/.vibe
      - PROPR_MANAGED_CREDENTIALS_DIR=${HOME:?HOME must be set}/.propr/agent-credentials
      - PROPR_CONTAINERIZED=1
      - PROPR_STACK=${PROPR_STACK:-propr}
      - CONFIG_REPO_PATH=/tmp/config_repo
      # Keep API-owned durable state on the mounted data directory. The startup
      # command preserves env_file database paths and resolves relative filenames
      # from /usr/src/app, matching the daemon and workers before changing cwd.
      # Allow injection of API_PUBLIC_URL for PR preview environments
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:${API_PORT:-4000}}
      # Allow injection of FRONTEND_URL for CORS in PR preview environments
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${UI_PORT:-5173}}
      # Allow injection of GH_OAUTH_CALLBACK_URL for PR preview environments
      - GH_OAUTH_CALLBACK_URL=${GH_OAUTH_CALLBACK_URL:-http://localhost:${API_PORT:-4000}/api/auth/github/callback}
      # Allow PR previews to share sessions via host Redis
      - SESSION_REDIS_HOST=${SESSION_REDIS_HOST:-redis}
      - SESSION_REDIS_PORT=${SESSION_REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_started
      daemon:
        condition: service_started
    networks:
      - propr-net
      - propr-agent-mcp

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      # Allow injection of DOCS_PORT for PR preview environments, default to 8080
      - '${DOCS_PORT:-8080}:3000'
    networks:
      - propr-net
    restart: unless-stopped

networks:
  propr-net:
    driver: bridge
  # Agent containers can reach the API without joining the private service network.
  propr-agent-mcp:
    driver: bridge

volumes:
  redis_data:
