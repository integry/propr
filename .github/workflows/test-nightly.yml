name: Nightly Test Suite (Tier 3)

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

jobs:
  e2e-tests:
    name: Run E2E Test Suite
    runs-on: [self-hosted, linux, x64, propr]
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            propr-ui/package-lock.json
            docs/package-lock.json
            packages/shared/package-lock.json
            packages/api/package-lock.json
            packages/core/package-lock.json

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Build workspace packages
        id: build
        run: npm run test:prepare

      - name: Validate docs site
        id: docs
        env:
          PROPR_WORKSPACE: ${{ github.workspace }}
        run: ./.propr/setup.sh

      - name: Start isolated Redis
        id: redis
        run: ./scripts/ci-redis.sh start

      - name: Run Full Test Suite
        id: full_tests
        continue-on-error: true
        env:
          NODE_ENV: test
        run: |
          echo "Running full test suite with Redis..."
          npm run test:full:prepared 2>&1 | tee test_output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "test_result=success" >> $GITHUB_OUTPUT
            echo "All tests passed"
          else
            echo "test_result=failure" >> $GITHUB_OUTPUT
            echo "Some tests failed"
          fi

          exit $TEST_EXIT_CODE

      - name: Validate live E2E configuration
        id: e2e_config
        if: steps.full_tests.outcome == 'success'
        continue-on-error: true
        env:
          PROPR_E2E_API_URL: ${{ secrets.PROPR_E2E_API_URL }}
          PROPR_E2E_TOKEN: ${{ secrets.PROPR_E2E_TOKEN }}
          PROPR_E2E_REPO: ${{ vars.PROPR_E2E_REPO }}
        run: |
          missing=()
          for name in PROPR_E2E_API_URL PROPR_E2E_TOKEN PROPR_E2E_REPO; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required nightly E2E configuration: ${missing[*]}" >&2
            exit 1
          fi

      - name: Run E2E Tests
        id: e2e_tests
        if: steps.full_tests.outcome == 'success' && steps.e2e_config.outcome == 'success'
        continue-on-error: true
        env:
          NODE_ENV: test
          PROPR_E2E_API_URL: ${{ secrets.PROPR_E2E_API_URL }}
          PROPR_E2E_TOKEN: ${{ secrets.PROPR_E2E_TOKEN }}
          PROPR_E2E_REPO: ${{ vars.PROPR_E2E_REPO }}
        run: |
          echo "Running E2E test suite..."
          npm run test:e2e 2>&1 | tee e2e_output.txt
          E2E_EXIT_CODE=${PIPESTATUS[0]}

          if [ $E2E_EXIT_CODE -eq 0 ]; then
            echo "e2e_result=success" >> $GITHUB_OUTPUT
            echo "E2E tests passed"
          else
            echo "e2e_result=failure" >> $GITHUB_OUTPUT
            echo "E2E tests failed"
          fi

          exit $E2E_EXIT_CODE

      - name: Create Failure Issue
        if: always() && !cancelled() && (failure() || steps.full_tests.outcome == 'failure' || steps.e2e_config.outcome == 'failure' || steps.e2e_tests.outcome == 'failure')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PROPR_E2E_API_URL_TO_REDACT: ${{ secrets.PROPR_E2E_API_URL }}
          PROPR_E2E_TOKEN_TO_REDACT: ${{ secrets.PROPR_E2E_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const date = new Date().toISOString().split('T')[0];

            const redactOutput = (value) => {
              let redacted = String(value);
              const knownSecrets = [
                process.env.PROPR_E2E_API_URL_TO_REDACT,
                process.env.PROPR_E2E_TOKEN_TO_REDACT,
              ].filter(secret => secret && secret.length > 0);
              for (const secret of knownSecrets) {
                redacted = redacted.split(secret).join('[REDACTED]');
              }
              const credentialPatterns = [
                [/(\b(?:authorization|proxy-authorization)\s*[:=]\s*(?:bearer|token)?\s*)[^\s,;]+/gi, '$1[REDACTED]'],
                [/(\bPROPR_E2E_TOKEN\s*[:=]\s*)[^\s,;]+/gi, '$1[REDACTED]'],
                [/(["'](?:access_?token|api_?key|client_?secret|password)["']\s*:\s*["'])[^"']+(["'])/gi, '$1[REDACTED]$2'],
                [/\b(?:github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]{20,})\b/g, '[REDACTED]'],
                [/(https?:\/\/)[^\s\/:@]+:[^\s\/@]+@/gi, '$1[REDACTED]@'],
              ];
              for (const [pattern, replacement] of credentialPatterns) {
                redacted = redacted.replace(pattern, replacement);
              }
              return redacted.replace(/~~~/g, '~~\u200b~');
            };

            let testOutput = '';
            try { testOutput = fs.readFileSync('test_output.txt', 'utf8'); }
            catch (e) { testOutput = 'Test output file not available.'; }

            let e2eOutput = '';
            try { e2eOutput = fs.readFileSync('e2e_output.txt', 'utf8'); }
            catch (e) { e2eOutput = 'E2E output file not available or not run.'; }

            // Log masking only protects the Actions log. Redact again before
            // sending captured process output through the Issues API.
            testOutput = redactOutput(testOutput);
            e2eOutput = redactOutput(e2eOutput);

            // Truncate outputs if too long
            if (testOutput.length > 30000) {
              testOutput = testOutput.substring(0, 30000) + "\n\n...(truncated)";
            }
            if (e2eOutput.length > 30000) {
              e2eOutput = e2eOutput.substring(0, 30000) + "\n\n...(truncated)";
            }

            const outcomes = {
              install: '${{ steps.install.outcome }}',
              build: '${{ steps.build.outcome }}',
              docs: '${{ steps.docs.outcome }}',
              redis: '${{ steps.redis.outcome }}',
              fullTests: '${{ steps.full_tests.outcome }}',
              e2eConfig: '${{ steps.e2e_config.outcome }}',
              e2eTests: '${{ steps.e2e_tests.outcome }}',
            };

            const body = [
              '## Nightly Test Suite Failure Report',
              '',
              `**Date:** ${date}`,
              `**Dependency install:** ${outcomes.install}`,
              `**Workspace build:** ${outcomes.build}`,
              `**Docs validation:** ${outcomes.docs}`,
              `**Redis startup:** ${outcomes.redis}`,
              `**Full test suite:** ${outcomes.fullTests}`,
              `**Live E2E configuration:** ${outcomes.e2eConfig}`,
              `**Live E2E tests:** ${outcomes.e2eTests}`,
              '',
              '### Full Test Suite Output',
              '',
              '<details>',
              '<summary>View Test Output</summary>',
              '',
              '~~~text',
              testOutput,
              '~~~',
              '</details>',
              '',
              '### E2E Test Output',
              '',
              '<details>',
              '<summary>View E2E Output</summary>',
              '',
              '~~~text',
              e2eOutput,
              '~~~',
              '</details>',
              '',
              `**[View Workflow Run](${runUrl})**`,
            ].join('\n');

            // Check for existing open issues with the same title pattern
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-test-failure',
              per_page: 10,
            });

            const todayTitle = `Nightly Test Suite Failed - ${date}`;
            const existingToday = existingIssues.data.find(issue => issue.title === todayTitle);

            if (existingToday) {
              // Update existing issue with new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingToday.number,
                body: `## Re-run Results\n\n${body}`,
              });
              console.log(`Updated existing issue #${existingToday.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: todayTitle,
                body: body,
                labels: ['nightly-test-failure', 'bug'],
              });
              console.log(`Created issue #${issue.data.number}`);
            }

      - name: Fail Job
        if: steps.full_tests.outcome == 'failure' || steps.e2e_config.outcome == 'failure' || steps.e2e_tests.outcome == 'failure'
        run: exit 1

      - name: Stop isolated Redis
        if: always()
        run: ./scripts/ci-redis.sh stop
