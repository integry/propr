name: Docker Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Optional version that must match package.json, for example 0.8.0'
        required: false
        type: string
      ghcr_namespace:
        description: 'GHCR namespace to publish under'
        required: true
        default: 'ghcr.io/integry'
        type: string
      dockerhub_namespace:
        description: 'Docker Hub namespace to publish under'
        required: true
        default: 'propr'
        type: string
      push_latest:
        description: 'Also update the latest tags'
        required: true
        default: true
        type: boolean

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-smoke-and-push:
    name: Build, Smoke Test, Push
    runs-on: [self-hosted, linux, x64, propr]
    env:
      GHCR_NS: ${{ github.event.inputs.ghcr_namespace || 'ghcr.io/integry' }}
      DOCKERHUB_NS: ${{ github.event.inputs.dockerhub_namespace || 'propr' }}
      PUSH_LATEST: ${{ github.event.inputs.push_latest || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Check toolchain
        run: |
          node --version
          npm --version
          docker version

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          EXPECTED_VERSION: ${{ github.event.inputs.expected_version }}
        run: |
          npm run release:verify
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build GHCR-tagged images
        run: ./scripts/build-images.sh --ghcr

      - name: Smoke test app image
        env:
          APP_TAG: ${{ env.GHCR_NS }}/propr-app:${{ steps.version.outputs.version }}
        run: npm run images:smoke

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TOKEN="${GHCR_TOKEN:-$GITHUB_TOKEN}"
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push GHCR images
        run: ./scripts/build-images.sh --push --ghcr

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required" >&2
            exit 1
          fi

          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build Docker Hub-tagged images
        run: ./scripts/build-images.sh --dockerhub

      - name: Smoke test Docker Hub app image
        env:
          APP_TAG: ${{ env.DOCKERHUB_NS }}/app:${{ steps.version.outputs.version }}
        run: npm run images:smoke

      - name: Push Docker Hub images
        run: ./scripts/build-images.sh --push --dockerhub

      - name: Sync Docker Hub metadata
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npm run images:metadata

  publish-cli:
    name: Publish CLI with provenance
    if: github.ref_type == 'tag'
    needs: build-smoke-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global 'npm@>=11.5.1 <12'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify CLI package
        run: npm run cli:pack

      - name: Pack release artifact
        run: npm pack --pack-destination "$RUNNER_TEMP" ./dist-publish/propr-cli

      - name: Smoke test packed CLI
        run: |
          PREFIX="$RUNNER_TEMP/propr-cli-install"
          TARBALL="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'propr-cli-*.tgz' -print -quit)"
          npm install --global --prefix "$PREFIX" "$TARBALL"
          "$PREFIX/bin/propr" --version

      - name: Publish CLI to npm
        working-directory: dist-publish/propr-cli
        run: npm publish --access public

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: propr-cli-${{ github.ref_name }}
          path: ${{ runner.temp }}/propr-cli-*.tgz
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build-smoke-and-push, publish-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download CLI artifact
        uses: actions/download-artifact@v6
        with:
          name: propr-cli-${{ github.ref_name }}
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-artifacts/*
          --repo "${{ github.repository }}"
          --verify-tag
          --generate-notes
          --title "ProPR ${{ github.ref_name }}"
