name: Fly end-to-end smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: fly-e2e-fixture
  cancel-in-progress: false

jobs:
  fixture:
    if: github.event_name == 'workflow_dispatch' || vars.FLY_E2E_NIGHTLY == 'true'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ENABLED: ${{ secrets.FLY_E2E_TOKEN != '' && secrets.FLY_E2E_SPRITES_TOKEN != '' && secrets.FLY_E2E_APP_ENV != '' && secrets.FLY_E2E_GITHUB_TOKEN != '' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [[ $ENABLED == false ]]; then
            echo "Skipping live smoke because fixture secrets are missing." >> "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    needs: fixture
    if: needs.fixture.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      APP: propr-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      ORG: ${{ vars.FLY_E2E_ORG }}
      REPO: ${{ vars.FLY_E2E_REPO }}
      REGION: iad
      IDLE_AFTER: 2m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Prepare the fixture and build this checkout
        run: |
          : "${ORG:?Set FLY_E2E_ORG}" "${REPO:?Set FLY_E2E_REPO}"
          [[ "$REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ && "${REPO,,}" != "${GITHUB_REPOSITORY,,}" ]]
          npm ci
          npm run test:prepare
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$GITHUB_WORKSPACE/packages/cli/dist/index.js" "$RUNNER_TEMP/bin/propr"
          chmod +x packages/cli/dist/index.js
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          image="registry.fly.io/$APP:control-plane-$GITHUB_SHA"
          docker build -f docker/Dockerfile.app.prod -t "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "ENV_FILE=$RUNNER_TEMP/fly.env" >> "$GITHUB_ENV"

      - name: Create disposable app
        id: app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: flyctl apps create "$APP" --org "$ORG"

      - name: Run propr deploy fly with Sprites and idle shutdown
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
          APP_ENV: ${{ secrets.FLY_E2E_APP_ENV }}
          SPRITES_TOKEN: ${{ secrets.FLY_E2E_SPRITES_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$APP_ENV" > "$ENV_FILE"
          for key in PROPR_ADMIN_USERS GH_OAUTH_CLIENT_ID GH_OAUTH_CLIENT_SECRET GH_APP_ID GH_INSTALLATION_ID PROPR_GH_PRIVATE_KEY_B64 CLAUDE_SETTINGS_B64; do
            grep -q "^${key}=." "$ENV_FILE" || { echo "Missing $key"; exit 1; }
          done
          openssl rand -hex 32 > "$OUT/hook-secret"
          {
            echo "GITHUB_REPOS_TO_MONITOR=$REPO"
            echo "WORKER_CONCURRENCY=1"
            echo "PROPR_SPRITES_MAX=1"
            echo "GH_WEBHOOK_SECRET=$(cat "$OUT/hook-secret")"
          } >> "$ENV_FILE"
          # Fly's Apps caveat uses the internal numeric ID. Zero would grant access to all apps.
          app_id=$(curl --fail --silent --show-error -H "Authorization: $FLY_API_TOKEN" \
            "https://api.machines.dev/v1/apps/$APP" | jq -er '.internal_numeric_id | numbers | select(. > 0)')
          [[ $app_id =~ ^[1-9][0-9]*$ ]]
          stop_token=$(jq -n --arg id "$app_id" '[
            {type: "Apps", body: {apps: {($id): "rwC"}}},
            {type: "ValidityWindow", body: {not_after: ((now | floor) + 7200)}}
          ]' | flyctl tokens attenuate)
          echo "::add-mask::$stop_token"
          flyctl auth docker
          docker push "$IMAGE"
          propr deploy fly --app "$APP" --org "$ORG" --region "$REGION" --image "$IMAGE" \
            --backend flyctl --agent-runtime sprites --idle-shutdown "$IDLE_AFTER" \
            --machine-stop-token "$stop_token" --env-file "$ENV_FILE" --no-relay --out "$OUT/propr-fly"
          status=$(curl --fail --retry 8 --retry-all-errors -o /dev/null -w '%{http_code}' "https://$APP.fly.dev/health")
          [[ $status == 200 ]]

      - name: Configure the fixture Claude agent before idle shutdown
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          setup=$(base64 -w0 <<'JS'
          const { saveAgents, closeConnection, AGENT_DEFAULTS } = await import('@propr/core');
          const { getManagedAgentConfigPath } = await import('@propr/shared');
          const { dockerImage, defaultModels } = AGENT_DEFAULTS.claude;
          await saveAgents([{ id: 'claude', type: 'claude', alias: 'claude', enabled: true,
            configPath: getManagedAgentConfigPath('claude', 'claude'), dockerImage,
            supportedModels: defaultModels, defaultModel: 'claude-sonnet-5-5' }]);
          await closeConnection();
          JS
          )
          flyctl ssh console --app "$APP" --container app -C "sh -c 'cd /usr/src/app && echo $setup | base64 -d | node --input-type=module'"
          # Install and verify the settings over SSH after the volume is mounted.
          awk '/^```bash title="Install headless Claude settings"$/{copy=1; next}
               copy && /^```$/{exit} copy' docs/docs/tutorials/setup-fly.md > "$OUT/claude-settings.sh"
          test -s "$OUT/claude-settings.sh"
          bash -eu "$OUT/claude-settings.sh"

      - name: Configure the signed App webhook and create the agent-labeled issue
        env:
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Cleanup can run after the JWT expires, so mint on each invocation.
          cat > "$OUT/app-jwt.sh" <<'BASH'
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          sed -n 's/^PROPR_GH_PRIVATE_KEY_B64=//p' "$ENV_FILE" | base64 -d > "$key"
          app_id=$(sed -n 's/^GH_APP_ID=//p' "$ENV_FILE")
          [[ $app_id =~ ^[0-9]+$ ]]
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          now=$(date +%s)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now-60))" "$((now+540))" "$app_id" | b64url)
          signature=$(printf '%s' "$header.$payload" | openssl dgst -sha256 -sign "$key" | b64url)
          printf '%s' "$header.$payload.$signature"
          BASH
          cat > "$OUT/installation-token.sh" <<'BASH'
          set -euo pipefail
          installation_id=$(sed -n 's/^GH_INSTALLATION_ID=//p' "$ENV_FILE")
          [[ $installation_id =~ ^[0-9]+$ ]]
          jwt=$(bash "$OUT/app-jwt.sh")
          echo "::add-mask::$jwt" >&2
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $jwt" \
            -H 'Accept: application/vnd.github+json' "https://api.github.com/app/installations/$installation_id/access_tokens" |
            jq -er '.token | strings | select(length > 0)'
          BASH
          jwt=$(bash "$OUT/app-jwt.sh")
          echo "::add-mask::$jwt"
          app_api() { curl --fail --silent --show-error -H "Authorization: Bearer $jwt" "https://api.github.com/app$1" "${@:2}"; }
          registration=$(app_api '')
          if ! jq -e '.events | contains(["issues","pull_request"])' <<< "$registration" > /dev/null; then
            echo "::error::Activate the fixture App webhook and subscribe to Issues and Pull request under Permissions & events."
            exit 1
          fi
          # Mark before PATCH so teardown also handles a lost configuration response.
          touch "$OUT/reset-app-hook"
          jq -n --rawfile secret "$OUT/hook-secret" --arg url "https://$APP.fly.dev/webhook" \
            '{url:$url,content_type:"json",insecure_ssl:"0",secret:($secret|rtrimstr("\n"))}' |
            app_api /hook/config -X PATCH -H 'Content-Type: application/json' --data-binary @- > /dev/null
          bash "$OUT/installation-token.sh" > /dev/null

          issue=$(gh api "repos/$REPO/issues" -f title="Fly smoke $APP" -F 'labels[]=llm-claude' \
            -f body="Create $APP.txt containing exactly the line $APP. Open a PR resolving this issue." --jq .number)
          echo "ISSUE=$issue" >> "$GITHUB_ENV"
          # GET /app does not expose the Active checkbox. Verify the actual delivery.
          for _ in {1..12}; do
            delivery=$(app_api '/hook/deliveries?per_page=20' | jq -r \
              '[.[] | select(.event == "issues" and .action == "opened" and .status_code == 200)][0].id // empty')
            if [[ -n $delivery ]] && app_api "/hook/deliveries/$delivery" |
              jq -e --arg title "Fly smoke $APP" '.request.payload.issue.title == $title' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::No successful App webhook delivery for $REPO#$issue. Check Webhook → Active in the fixture App settings and its recent deliveries."
          exit 1

      - name: Observe idle stop and labeled-issue wake
        timeout-minutes: 12
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          machine=$(flyctl machine list --app "$APP" --json | jq -er 'select(length == 1) | .[0].id')
          wait_state() {
            for _ in {1..55}; do
              state=$(flyctl machine list --app "$APP" --json | jq -er --arg id "$machine" '.[] | select(.id == $id) | .state')
              [[ $state != "$1" ]] || return 0
              sleep 5
            done
            echo "Machine $machine remained $state waiting for $1"
            return 1
          }
          wait_state stopped
          gh issue edit "$ISSUE" --repo "$REPO" --add-label AI
          wait_state started

      - name: Verify the linked PR and its Sprites execution
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          set -o pipefail
          for _ in {1..24}; do
            if recovery=$(flyctl logs --app "$APP" --no-tail --json |
              jq -sce '[.[] | .message | fromjson? | select(.msg == "Woke from idle shutdown")]
                | max_by(.wokeAt).webhookRecovery | objects'); then
              break
            fi
            sleep 5
          done
          [[ -n $recovery ]] || { echo "::error::Missing idle-wake webhookRecovery record"; exit 1; }
          redelivered=$(jq -er '.redelivered | numbers' <<< "$recovery")
          echo "Idle wake webhookRecovery.redelivered=$redelivered"
          jq -e '.error == null' <<< "$recovery" > /dev/null || { echo "::error::App webhook recovery reported an error"; exit 1; }

          for _ in {1..150}; do
            pr=$(gh pr list --repo "$REPO" --json number,closingIssuesReferences,isCrossRepository |
              jq -r --argjson issue "$ISSUE" '.[] | select(.isCrossRepository == false and any(.closingIssuesReferences[]; .number == $issue)) | .number')
            [[ -z $pr ]] || break
            sleep 15
          done
          [[ $pr =~ ^[0-9]+$ ]] || { echo "No unique linked PR for $REPO#$ISSUE"; exit 1; }
          sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          token=$(bash "$OUT/installation-token.sh")
          echo "::add-mask::$token"
          contents=$(GH_TOKEN="$token" gh api "repos/$REPO/contents/$APP.txt?ref=$sha" --jq .content | base64 -d)
          [[ $contents == "$APP" ]]
          # Read the worker's measurement for this issue AND PR, after wake was observed.
          check=$(base64 -w0 <<JS
          const db = require('/usr/src/app/node_modules/better-sqlite3')('/usr/src/app/data/propr.sqlite', {readonly:true});
          const run = db.prepare(\`SELECT e.compute_runtime, e.compute_wall_time_ms, e.compute_cost_usd
            FROM llm_executions e JOIN tasks t USING (task_id)
            WHERE t.repository = ? COLLATE NOCASE AND t.issue_number = ? AND t.pr_number = ?
              AND e.success = 1 AND e.compute_runtime = 'sprites' LIMIT 1\`).get('$REPO', $ISSUE, $pr);
          if (!run) process.exit(1);
          console.log(JSON.stringify(run));
          JS
          )
          for _ in {1..12}; do
            if flyctl ssh console --app "$APP" --container app -C "node -e \"eval(Buffer.from('$check','base64').toString())\""; then
              exit 0
            fi
            sleep 5
          done
          echo "Missing successful Sprites execution for $REPO#$ISSUE, PR #$pr"
          exit 1

      - name: Reset the fixture App webhook to its placeholder URL
        if: always() && steps.app.outcome == 'success'
        run: |
          if [[ -f $OUT/reset-app-hook ]]; then
            jwt=$(bash "$OUT/app-jwt.sh")
            echo "::add-mask::$jwt"
            curl --fail --silent --show-error --retry 3 -o /dev/null -X PATCH \
              -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' \
              --data '{"url":"https://example.invalid/webhook"}' https://api.github.com/app/hook/config
          fi
      - name: Dump app logs on failure
        if: failure() && steps.app.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          timeout 60s flyctl logs --app "$APP" --no-tail 2>&1 |
            perl -pe '
              s{((?:token|secret|key|password|authorization)\w*"?\s*[=:]\s*)(?:"(?:\\.|[^"\\])*"|(?:Bearer\s+|Basic\s+)?(?!ENOENT:)[^\s,"]+)}{$1<masked>}gi;
              s{[A-Za-z0-9+/_=-]{32,}}{<long>}g;
            ' | tail -n 200 || true

      - name: Destroy test app, Machines and volume
        if: always() && steps.app.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: flyctl apps destroy "$APP" --yes
      - name: Reap remaining Sprites owned by this deployment
        if: always() && steps.app.outcome == 'success'
        env:
          SPRITES_TOKEN: ${{ secrets.FLY_E2E_SPRITES_TOKEN }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { SpritesClient } from '@fly/sprites';
          import { spritePoolKey } from './packages/shared/src/statusKeys.ts';
          const marker = createHash('sha256').update(spritePoolKey(process.env.APP)).digest('hex').slice(0, 16);
          const prefix = 'propr-' + marker + '-';
          const client = new SpritesClient(process.env.SPRITES_TOKEN);
          for (const sprite of await client.listAllSprites(prefix)) {
            if (sprite.name.startsWith(prefix)) await client.deleteSprite(sprite.name);
          }
          JS
      - name: Close fixture work
        if: always() && env.ISSUE != ''
        env:
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --json number,headRefName,closingIssuesReferences,isCrossRepository |
            jq -r --argjson issue "$ISSUE" '.[] | select(.isCrossRepository == false and any(.closingIssuesReferences[]; .number == $issue)) | [.number, (.headRefName | split("/") | map(@uri) | join("/"))] | @tsv')
          if [[ -n $prs ]]; then
            token=$(bash "$OUT/installation-token.sh")
            echo "::add-mask::$token"
            while IFS=$'\t' read -r pr ref; do
              gh pr close "$pr" --repo "$REPO"
              status=$(curl --silent --show-error -o "$OUT/delete-ref.json" -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $token" "https://api.github.com/repos/$REPO/git/refs/heads/$ref")
              [[ $status == 204 ]] && continue
              if [[ $status == 404 || $status == 422 ]] && jq -e --arg status "$status" '
                .message | test("^Reference does not exist[.]?$"; "i") or ($status == "404" and . == "Not Found")
              ' "$OUT/delete-ref.json" >/dev/null; then
                continue
              fi
              echo "::error::Deleting the head branch for PR #$pr returned HTTP $status"
              exit 1
            done <<< "$prs"
          fi
          gh issue close "$ISSUE" --repo "$REPO"
