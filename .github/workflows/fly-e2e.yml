name: Fly end-to-end smoke

on:
  workflow_dispatch:
    inputs:
      agent_runtime:
        description: Agent runtime the control plane runs the fixture issue on
        type: choice
        options: [sprites, fly-machines]
        default: sprites
      extensions:
        description: >-
          Also verify Extension Library items on the remote runtime: a skill bundle, a pinned npm MCP server and four
          URL MCP servers (stateful, stateless, Bearer and a disposable OAuth server: a Fly Machine on Sprites runs, a Sprite on Fly Machines runs)
        type: boolean
        default: false
      mcp:
        description: >-
          Also check ProPR MCP from Sprites: deploy with PROPR_SPRITES_MCP_TRANSPORT=forward
          and run one automation that calls a ProPR MCP tool over the SSH reverse forward.
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: fly-e2e-fixture
  cancel-in-progress: false

jobs:
  fixture:
    if: github.event_name == 'workflow_dispatch' || vars.FLY_E2E_NIGHTLY == 'true'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          AGENT_RUNTIME: ${{ inputs.agent_runtime || 'sprites' }}
          EXTENSIONS: ${{ (github.event_name == 'workflow_dispatch' && inputs.extensions) || (github.event_name == 'schedule' && vars.FLY_E2E_NIGHTLY_EXTENSIONS == 'true') }}
          FLY_E2E_TOKEN: ${{ secrets.FLY_E2E_TOKEN != '' }}
          FLY_E2E_SPRITES_TOKEN: ${{ secrets.FLY_E2E_SPRITES_TOKEN != '' }}
          FLY_E2E_APP_ENV: ${{ secrets.FLY_E2E_APP_ENV != '' }}
          FLY_E2E_GITHUB_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN != '' }}
          FLY_E2E_GH_OAUTH_CLIENT_ID: ${{ secrets.FLY_E2E_GH_OAUTH_CLIENT_ID != '' }}
          FLY_E2E_GH_OAUTH_CLIENT_SECRET: ${{ secrets.FLY_E2E_GH_OAUTH_CLIENT_SECRET != '' }}
        run: |
          missing=()
          required=(FLY_E2E_TOKEN FLY_E2E_APP_ENV FLY_E2E_GITHUB_TOKEN FLY_E2E_GH_OAUTH_CLIENT_ID FLY_E2E_GH_OAUTH_CLIENT_SECRET)
          # Fly Machines runs host the extensions mode's OAuth fixture on a Sprite (Sprites runs use a Fly Machine).
          [[ $AGENT_RUNTIME != sprites && $EXTENSIONS != true ]] || required+=(FLY_E2E_SPRITES_TOKEN)
          for name in "${required[@]}"; do
            [[ ${!name} == true ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live smoke because fixture secrets are missing: ${missing[*]}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: fixture
    if: needs.fixture.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.mcp || vars.FLY_E2E_NIGHTLY_MCP == 'true') && 130 || 100 }}
    env:
      APP: propr-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      # ProPR MCP mode: on when dispatched with mcp, and nightly only when FLY_E2E_NIGHTLY_MCP=true.
      MCP: ${{ (github.event_name == 'workflow_dispatch' && inputs.mcp) || (github.event_name == 'schedule' && vars.FLY_E2E_NIGHTLY_MCP == 'true') }}
      ORG: ${{ vars.FLY_E2E_ORG }}
      REPO: ${{ vars.FLY_E2E_REPO }}
      REGION: iad
      IDLE_AFTER: 2m
      # The nightly schedule has no inputs, so it always runs on Sprites.
      AGENT_RUNTIME: ${{ inputs.agent_runtime || 'sprites' }}
      # Fly Machines start agents in a separate app with their own image and token.
      AGENT_APP: propr-e2e-agents-${{ github.run_id }}-${{ github.run_attempt }}
      # A small instance runtime package absent from Dockerfile.agent's explicit apt
      # set, so the fixture file can only contain its banner if the runtime installed it.
      RUNTIME_PACKAGE: figlet
      RUNTIME_PACKAGE_COMMAND: figlet -v | head -1
      RUNTIME_PACKAGE_BANNER: '^FIGlet Copyright \(C\) [0-9]'
      # Sprites run Fly's Ubuntu base, not Dockerfile.agent's Debian: an Ubuntu-only name (bookworm has
      # libssl3 instead) must pass the Sprite base's package check rather than be refused by the Debian one.
      SPRITE_DISTRO_PACKAGE: libssl3t64
      # Manual runs follow the input; nightly runs opt in with the repository variable.
      # The extensions mode runs on the selected agent runtime (Sprites or Fly Machines).
      EXTENSIONS: ${{ (github.event_name == 'workflow_dispatch' && inputs.extensions) || (github.event_name == 'schedule' && vars.FLY_E2E_NIGHTLY_EXTENSIONS == 'true') }}
      RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
      # A small, well-known npm MCP server with a deterministic `echo` tool, pinned to an exact version and integrity.
      EXT_PACKAGE: '@modelcontextprotocol/server-everything'
      EXT_PACKAGE_VERSION: 2.3.1
      EXT_PACKAGE_INTEGRITY: sha512-fOONra8VnAjlVp5xO+dWWoKGkZYg8sBEg52txVoLT0N43B3F5nX3UmsgHch79DM0L+nVCi/w5d/WV6UfhBH7kA==
      # URL MCP servers. mcptest.io's echo fixture is stateful (2025 sessions) and takes `message`;
      # DeepWiki answers without a session; the Bearer fixture publishes its token in its 401 reply.
      URL_STATEFUL: https://mcptest.io/fixtures/echo/mcp
      URL_STATELESS: https://mcp.deepwiki.com/mcp
      URL_STATELESS_TOOL: read_wiki_structure
      URL_BEARER: https://mcptest.io/fixtures/auth-bearer/mcp
      URL_BEARER_TOKEN: mcptest-public-token
      # The OAuth fixture runs in the pool the run's agents don't use: the Free plan allows three Sprites and three
      # Machines per org. Sprites runs host it on a Fly Machine in its own disposable app (with the control plane,
      # 2 of 3 Machines); Fly Machines runs host it on a disposable Sprite, leaving the Machines to the agents.
      OAUTH_FIXTURE_HOST: ${{ (inputs.agent_runtime || 'sprites') == 'sprites' && 'fly-machine' || 'sprite' }}
      # The Sprite's or Fly app's name.
      OAUTH_FIXTURE_NAME: propr-e2e-oauth-${{ github.run_id }}-${{ github.run_attempt }}
      # Core refreshes one minute before expiry, so a 90 s token forces refreshes during the run.
      OAUTH_ACCESS_TTL: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Prepare the fixture and build this checkout
        run: |
          : "${ORG:?Set FLY_E2E_ORG}" "${REPO:?Set FLY_E2E_REPO}"
          [[ $AGENT_RUNTIME == sprites || $AGENT_RUNTIME == fly-machines ]]
          # ProPR MCP mode checks the Sprites SSH reverse forward, so it needs the Sprites runtime.
          [[ $MCP != true || $AGENT_RUNTIME == sprites ]] || { echo "::error::MCP mode requires agent_runtime=sprites"; exit 1; }
          # The package must be missing from the agent image, or the smoke proves nothing.
          ! grep -Eq "(^|[^a-z0-9.+-])${RUNTIME_PACKAGE}([^a-z0-9.+-]|$)" Dockerfile.agent scripts/sprites-agent-setup.sh
          [[ "$REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ && "${REPO,,}" != "${GITHUB_REPOSITORY,,}" ]]
          npm ci
          npm run test:prepare
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$GITHUB_WORKSPACE/packages/cli/dist/index.js" "$RUNNER_TEMP/bin/propr"
          chmod +x packages/cli/dist/index.js
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          image="registry.fly.io/$APP:control-plane-$GITHUB_SHA"
          docker build -f docker/Dockerfile.app.prod -t "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "ENV_FILE=$RUNNER_TEMP/fly.env" >> "$GITHUB_ENV"

      - name: Create disposable app
        id: app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: flyctl apps create "$APP" --org "$ORG"

      - name: Create the disposable agent app, image and token for Fly Machines
        if: env.AGENT_RUNTIME == 'fly-machines'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          flyctl apps create "$AGENT_APP" --org "$ORG"
          touch "$OUT/destroy-agent-app"
          DOCKERHUB_NS=propr GIT_SHA="$GITHUB_SHA" ./scripts/build-images.sh --sha-only --only agent --platform linux/amd64
          ref="registry.fly.io/$AGENT_APP:agent-$GITHUB_SHA"
          docker tag "propr/agent:$GITHUB_SHA" "$ref"
          flyctl auth docker
          docker push "$ref"
          image=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" |
            grep -m1 -E "^registry\.fly\.io/$AGENT_APP@sha256:[0-9a-f]{64}$")
          # Org tokens can't create tokens, so derive one locally from FLY_E2E_TOKEN, scoped to the agent
          # app only: read (images, logs), write, create, delete and control (start/stop) Machines, for 2 h.
          # Fly's Apps caveat uses the internal numeric ID. Zero would grant access to all apps.
          agent_app_id=$(curl --fail --silent --show-error -H "Authorization: $FLY_API_TOKEN" \
            "https://api.machines.dev/v1/apps/$AGENT_APP" | jq -er '.internal_numeric_id | numbers | select(. > 0)')
          [[ $agent_app_id =~ ^[1-9][0-9]*$ ]]
          agent_token=$(jq -n --arg id "$agent_app_id" '[
            {type: "Apps", body: {apps: {($id): "rwcdC"}}},
            {type: "ValidityWindow", body: {not_after: ((now | floor) + 7200)}}
          ]' | flyctl tokens attenuate)
          [[ -n $agent_token ]]
          echo "::add-mask::$agent_token"
          {
            echo "PROPR_FLY_APP=$AGENT_APP"
            echo "PROPR_FLY_IMAGE=$image"
            echo "PROPR_FLY_REGION=$REGION"
            echo "PROPR_FLY_API_TOKEN=$agent_token"
          } > "$OUT/agent-runtime.env"
          echo "Fly Machines agent image: $image"

      - name: Run propr deploy fly with the selected agent runtime and idle shutdown
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
          APP_ENV: ${{ secrets.FLY_E2E_APP_ENV }}
          SPRITES_TOKEN: ${{ (inputs.agent_runtime || 'sprites') == 'sprites' && secrets.FLY_E2E_SPRITES_TOKEN || '' }}
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.FLY_E2E_GH_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.FLY_E2E_GH_OAUTH_CLIENT_SECRET }}
          OWNER_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          umask 077
          echo "::add-mask::$OAUTH_CLIENT_SECRET"
          printf '%s\n' "$APP_ENV" > "$ENV_FILE"
          for key in PROPR_ADMIN_USERS GH_APP_ID GH_INSTALLATION_ID PROPR_GH_PRIVATE_KEY_B64 CLAUDE_SETTINGS_B64; do
            grep -q "^${key}=." "$ENV_FILE" || { echo "Missing $key"; exit 1; }
          done
          if [[ $EXTENSIONS == true ]]; then
            # The Extension Library API needs a durable instance administrator. The
            # fixture token's user becomes a bootstrap administrator and claims the role.
            login=$(gh api user --jq .login)
            [[ $login =~ ^[A-Za-z0-9-]+$ ]]
            echo "EXT_ADMIN=$login" >> "$GITHUB_ENV"
            if ! grep -E "^PROPR_ADMIN_USERS=" "$ENV_FILE" | tr ',=' '\n\n' | grep -qixF "$login"; then
              sed -i "s/^PROPR_ADMIN_USERS=.*/&,$login/" "$ENV_FILE"
            fi
          fi
          openssl rand -hex 32 > "$OUT/hook-secret"
          {
            echo "GH_OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID"
            echo "GH_OAUTH_CLIENT_SECRET=$OAUTH_CLIENT_SECRET"
            echo "GITHUB_REPOS_TO_MONITOR=$REPO"
            echo "WORKER_CONCURRENCY=1"
            [[ $AGENT_RUNTIME != sprites ]] || echo "PROPR_SPRITES_MAX=1"
            echo "GH_WEBHOOK_SECRET=$(cat "$OUT/hook-secret")"
          } >> "$ENV_FILE"
          [[ $AGENT_RUNTIME != fly-machines ]] || cat "$OUT/agent-runtime.env" >> "$ENV_FILE"
          # propr deploy fly generates SYSTEM_TASK_SECRET; one from the fixture env would hide a deploy that does not.
          sed -i '/^SYSTEM_TASK_SECRET=/d' "$ENV_FILE"
          if [[ $MCP == true ]]; then
            # The automation's owner is the fixture token's user; ProPR MCP grants need an admitted user.
            owner=$(GH_TOKEN="$OWNER_TOKEN" gh api user --jq .login)
            sed -n 's/^PROPR_ADMIN_USERS=//p' "$ENV_FILE" | tr ',' '\n' | tr -d ' ' | grep -qixF "$owner" ||
              { echo "::error::MCP mode needs the FLY_E2E_GITHUB_TOKEN user ($owner) in PROPR_ADMIN_USERS"; exit 1; }
            # MCP itself (MCP_ENABLED, origin, instance id, key, internal API URL) is the deploy's default,
            # so drop any fixture MCP settings. The forward relays to the in-Machine API, so the Sprites
            # never use the app's public origin.
            mcp_keys='MCP_ENABLED|MCP_PUBLIC_ORIGIN|MCP_INSTANCE_ID|MCP_ENCRYPTION_KEY|PROPR_SPRITES_MCP_TRANSPORT|PROPR_SPRITES_MCP_FORWARD|PROPR_SPRITES_MCP_URL|PROPR_INTERNAL_API_URL|PROPR_E2E_MCP_OWNER_TOKEN'
            sed -i -E "/^($mcp_keys)=/d" "$ENV_FILE"
            {
              echo "PROPR_SPRITES_MCP_TRANSPORT=forward"
              # Read once over SSH to record the owner's GitHub grant, as a browser sign-in would.
              echo "PROPR_E2E_MCP_OWNER_TOKEN=$OWNER_TOKEN"
            } >> "$ENV_FILE"
          fi
          # Fly's Apps caveat uses the internal numeric ID. Zero would grant access to all apps.
          app_id=$(curl --fail --silent --show-error -H "Authorization: $FLY_API_TOKEN" \
            "https://api.machines.dev/v1/apps/$APP" | jq -er '.internal_numeric_id | numbers | select(. > 0)')
          [[ $app_id =~ ^[1-9][0-9]*$ ]]
          stop_token=$(jq -n --arg id "$app_id" '[
            {type: "Apps", body: {apps: {($id): "rwC"}}},
            {type: "ValidityWindow", body: {not_after: ((now | floor) + 7200)}}
          ]' | flyctl tokens attenuate)
          echo "::add-mask::$stop_token"
          flyctl auth docker
          docker push "$IMAGE"
          propr deploy fly --app "$APP" --org "$ORG" --region "$REGION" --image "$IMAGE" \
            --backend flyctl --agent-runtime "$AGENT_RUNTIME" --idle-shutdown "$IDLE_AFTER" \
            --machine-stop-token "$stop_token" --env-file "$ENV_FILE" --no-relay --out "$OUT/propr-fly"
          status=$(curl --fail --retry 8 --retry-all-errors -o /dev/null -w '%{http_code}' "https://$APP.fly.dev/health")
          [[ $status == 200 ]]

      - name: Configure the fixture Claude agent and runtime package before idle shutdown
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          set -euo pipefail
          [[ $RUNTIME_PACKAGE =~ ^[a-z0-9][a-z0-9+.-]*$ && $SPRITE_DISTRO_PACKAGE =~ ^[a-z0-9][a-z0-9+.-]*$ ]]
          packages=$(jq -cn --arg pkg "$RUNTIME_PACKAGE" --arg distro "$SPRITE_DISTRO_PACKAGE" --arg runtime "$AGENT_RUNTIME" \
            '[$pkg] + (if $runtime == "sprites" then [$distro] else [] end) | sort')
          setup=$(sed -e "s/__RUNTIME_PACKAGES__/$packages/" -e "s/__AGENT_RUNTIME__/$AGENT_RUNTIME/" <<'JS' | base64 -w0
          const {
            saveAgents, closeConnection, AGENT_DEFAULTS, agentRuntimePackagesDigest,
            requestAgentRuntimePackageBuild, buildAgentRuntimePackageProfile,
          } = await import('@propr/core');
          const { getManagedAgentConfigPath } = await import('@propr/shared');
          const { dockerImage, defaultModels } = AGENT_DEFAULTS.claude;
          await saveAgents([{ id: 'claude', type: 'claude', alias: 'claude', enabled: true,
            configPath: getManagedAgentConfigPath('claude', 'claude'), dockerImage,
            supportedModels: defaultModels, defaultModel: 'claude-sonnet-5-5' }]);
          // Settings → Agent runtime packages → Apply: the API records the list
          // (requestAgentRuntimePackageBuild) and the worker's build job applies it.
          // The runtime accepts the list once it passes its own package index check (Sprites: the Sprite base's).
          const packages = __RUNTIME_PACKAGES__;
          const job = await requestAgentRuntimePackageBuild(packages, [dockerImage]);
          const state = await buildAgentRuntimePackageProfile(job);
          await closeConnection();
          const accepted = state.remote?.['__AGENT_RUNTIME__'];
          const summary = { status: state.status, packages: state.activePackages,
            packagesDigest: agentRuntimePackagesDigest(state.activePackages), appliedBy: state.appliedBy, error: state.error,
            accepted: accepted?.packages, base: accepted?.base, warning: accepted?.warning };
          console.log('PROPR_RUNTIME_PACKAGES ' + JSON.stringify(summary));
          if (state.status !== 'ready' || !state.appliedBy || state.activePackages.join() !== packages.join()
            || accepted?.packages.join() !== packages.join()) process.exit(1);
          JS
          )
          flyctl ssh console --app "$APP" --container app -C "sh -c 'cd /usr/src/app && echo $setup | base64 -d | node --input-type=module'" |
            tee "$OUT/runtime-packages.log"
          applied=$(sed -n 's/^PROPR_RUNTIME_PACKAGES //p' "$OUT/runtime-packages.log" | tr -d '\r' | tail -n 1)
          expected=$([[ $AGENT_RUNTIME == sprites ]] && echo 'when Sprites are provisioned' || echo 'at every Fly Machine start')
          jq -e --argjson pkgs "$packages" --arg expected "$expected" \
            '.status == "ready" and .packages == $pkgs and .accepted == $pkgs and (.appliedBy | contains($expected))' <<< "$applied" > /dev/null || {
            echo "::error::Runtime packages $packages were not applied for $AGENT_RUNTIME: $applied"
            exit 1
          }
          echo "RUNTIME_PACKAGE_COUNT=$(jq length <<< "$packages")" >> "$GITHUB_ENV"
          jq -r '"Accepted for \(.base // "unknown base"): \(.accepted | join(" "))\(if .warning then " (" + .warning + ")" else "" end)"' <<< "$applied"
          digest=$(jq -er '.packagesDigest | strings | select(test("^[0-9a-f]{16}$"))' <<< "$applied")
          echo "RUNTIME_PACKAGES_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Configured runtime packages $packages (packagesDigest $digest) before the idle stop"
          # Install and verify the settings over SSH after the volume is mounted.
          awk '/^```bash title="Install headless Claude settings"$/{copy=1; next}
               copy && /^```$/{exit} copy' docs/docs/tutorials/setup-fly.md > "$OUT/claude-settings.sh"
          test -s "$OUT/claude-settings.sh"
          bash -eu "$OUT/claude-settings.sh"

      - name: Start the OAuth MCP fixture on a disposable Sprite
        if: env.EXTENSIONS == 'true' && env.OAUTH_FIXTURE_HOST == 'sprite'
        timeout-minutes: 8
        env:
          SPRITES_TOKEN: ${{ secrets.FLY_E2E_SPRITES_TOKEN }}
        run: |
          set -euo pipefail
          # Marker first: teardown deletes the Sprite even if creation's response is lost.
          touch "$OUT/delete-oauth-sprite"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { SpritesClient } from '@fly/sprites';
          const client = new SpritesClient(process.env.SPRITES_TOKEN);
          const name = process.env.OAUTH_FIXTURE_NAME;
          // A public URL: ProPR's gateway and OAuth client reach it like any provider, over HTTPS on 443.
          await client.createSprite(name, { urlSettings: { auth: 'public' } });
          const sprite = await client.getSprite(name);
          if (!sprite.url?.startsWith('https://')) throw new Error(`Sprite ${name} has no public HTTPS URL`);
          const origin = new URL(sprite.url).origin;
          const home = (await sprite.execFile('sh', ['-c', 'mkdir -p ~/oauth-fixture && cd ~/oauth-fixture && pwd'])).stdout.toString().trim();
          await sprite.filesystem().writeFile(`${home}/fixture.mjs`, readFileSync('.github/fly-e2e/oauth-mcp-fixture.mjs'), { mode: 0o755 });
          // Sprites ship Node through a login-shell shim; a service survives the Sprite sleeping and waking.
          const started = await sprite.createService('oauth-mcp', {
            cmd: 'bash', args: ['-lc', `exec node ${home}/fixture.mjs`], dir: home, httpPort: 8080,
            env: { PUBLIC_URL: origin, PORT: '8080', ACCESS_TTL: process.env.OAUTH_ACCESS_TTL, STATE_FILE: `${home}/state.json` },
          });
          started.close();
          for (let attempt = 0; ; attempt++) {
            try { const health = await fetch(`${origin}/health`); if (health.ok) break; } catch { /* not up yet */ }
            if (attempt >= 60) throw new Error('The OAuth fixture did not answer /health');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          const metadata = await (await fetch(`${origin}/.well-known/oauth-protected-resource/mcp`)).json();
          if (metadata.resource !== `${origin}/mcp`) throw new Error('The OAuth fixture names another resource');
          appendFileSync(process.env.GITHUB_ENV, `OAUTH_FIXTURE_ORIGIN=${origin}\n`);
          console.log(`OAuth MCP fixture at ${origin}/mcp on a Sprite (access tokens ${process.env.OAUTH_ACCESS_TTL} s)`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- OAuth MCP fixture host: Sprite \`${name}\` (${origin}/mcp)\n`);
          JS

      - name: Start the OAuth MCP fixture on a Fly Machine in a disposable app
        if: env.EXTENSIONS == 'true' && env.OAUTH_FIXTURE_HOST == 'fly-machine'
        timeout-minutes: 8
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          set -euo pipefail
          # Marker first: teardown destroys the app even if creation's response is lost.
          touch "$OUT/destroy-oauth-app"
          flyctl apps create "$OAUTH_FIXTURE_NAME" --org "$ORG"
          origin="https://$OAUTH_FIXTURE_NAME.fly.dev"
          dir="$OUT/oauth-fixture-app"
          mkdir -p "$dir"
          cp .github/fly-e2e/oauth-mcp-fixture.mjs "$dir/fixture.mjs"
          # One Machine that never auto-stops: OAuth registrations, tokens and sessions stay in its memory and
          # STATE_FILE for the whole run. The Fly proxy terminates HTTPS on 443 for the *.fly.dev name.
          cat > "$dir/fly.toml" <<TOML
          app = "$OAUTH_FIXTURE_NAME"
          primary_region = "$REGION"

          [build]
            image = "node:22-slim"

          [env]
            PUBLIC_URL = "$origin"
            PORT = "8080"
            ACCESS_TTL = "$OAUTH_ACCESS_TTL"
            STATE_FILE = "/tmp/oauth-mcp-fixture.json"

          [processes]
            app = "node /oauth-fixture/fixture.mjs"

          [[files]]
            guest_path = "/oauth-fixture/fixture.mjs"
            local_path = "$dir/fixture.mjs"

          [http_service]
            internal_port = 8080
            force_https = true
            auto_stop_machines = "off"
            auto_start_machines = true
            min_machines_running = 1
            processes = ["app"]

          [[vm]]
            size = "shared-cpu-1x"
            memory = "256mb"
          TOML
          # --ha=false: one Machine, not the default two, so the org stays within its three.
          flyctl deploy --config "$dir/fly.toml" --app "$OAUTH_FIXTURE_NAME" --ha=false --yes --wait-timeout 5m
          # Deploy allocates public IPs for an http_service; allocate them here if it did not.
          if flyctl ips list --app "$OAUTH_FIXTURE_NAME" --json | jq -e 'length == 0' > /dev/null; then
            flyctl ips allocate-v4 --shared --app "$OAUTH_FIXTURE_NAME"
            flyctl ips allocate-v6 --app "$OAUTH_FIXTURE_NAME"
          fi
          machines=$(flyctl machines list --app "$OAUTH_FIXTURE_NAME" --json | jq length)
          [[ $machines == 1 ]] || { echo "::error::The OAuth fixture app has $machines Machines, expected 1"; exit 1; }
          for attempt in $(seq 0 60); do
            curl --fail --silent --show-error --max-time 10 -o /dev/null "$origin/health" && break
            [[ $attempt -lt 60 ]] || { echo "::error::The OAuth fixture did not answer /health"; exit 1; }
            sleep 5
          done
          curl --fail --silent --show-error "$origin/.well-known/oauth-protected-resource/mcp" |
            jq -e --arg resource "$origin/mcp" '.resource == $resource' > /dev/null ||
            { echo "::error::The OAuth fixture names another resource"; exit 1; }
          echo "OAUTH_FIXTURE_ORIGIN=$origin" >> "$GITHUB_ENV"
          echo "OAuth MCP fixture at $origin/mcp on a Fly Machine (access tokens $OAUTH_ACCESS_TTL s)"
          echo "- OAuth MCP fixture host: Fly Machine in the disposable app \`$OAUTH_FIXTURE_NAME\` ($origin/mcp)" >> "$GITHUB_STEP_SUMMARY"

      - name: Add Extension Library items before idle shutdown
        if: env.EXTENSIONS == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The same API the Settings → Extensions page uses, authenticated with the
          # fixture user's GitHub token as a bearer.
          base="https://$APP.fly.dev"
          api() {
            local path=$1; shift
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/json' "$base$path" "$@"
          }
          # Only reads retry; a repeated save would fail on the expected library revision.
          get() { api "$1" --retry 4 --retry-all-errors; }
          post() { api "$1" -X POST -H 'Content-Type: application/json' -H 'X-ProPR-Extensions: 1' --data-binary @- "${@:2}"; }
          # Wake the Machine if the proxy stopped it, then store the bootstrap administrator role.
          get /health > /dev/null
          echo '{}' | api /api/admin/members/claim -X POST -H 'Content-Type: application/json' --data-binary @- |
            jq -e --arg login "$EXT_ADMIN" '.member.role == "admin" and (.member.githubUsername | ascii_downcase) == ($login | ascii_downcase)' > /dev/null

          # Skill bundle: one SKILL.md with a token unique to this run, uploaded as a ustar archive.
          skill="$OUT/fixture-skill"
          mkdir -p "$skill"
          cat > "$skill/SKILL.md" <<MD
          ---
          name: fixture-token
          description: Gives the fixture skill token. Use it whenever a task asks for the fixture skill token.
          ---

          When asked for the fixture skill token, answer exactly \`SKILL-OK-$RUN_TOKEN\` and nothing else.
          MD
          tar --format=ustar --owner=0 --group=0 --numeric-owner -cf "$OUT/fixture-skill.tar" -C "$skill" SKILL.md
          bundle=$(jq -n --rawfile archive <(base64 -w0 "$OUT/fixture-skill.tar") '{archive: $archive, filename: "fixture-skill.tar"}' |
            post /api/instance/extensions/v1/skills/archive | jq -er '.bundle.id | strings')

          # Package server: Settings' "Check" resolves the registry integrity; it must match the pin.
          resolved=$(jq -n --arg package "$EXT_PACKAGE" --arg version "$EXT_PACKAGE_VERSION" \
            '{ecosystem: "npm", package: $package, version: $version, bin: "mcp-server-everything"}' |
            post /api/instance/extensions/v1/packages/resolve)
          jq -e --arg integrity "$EXT_PACKAGE_INTEGRITY" '.package.integrity == $integrity' <<< "$resolved" > /dev/null ||
            { echo "::error::$EXT_PACKAGE@$EXT_PACKAGE_VERSION no longer resolves to the pinned integrity"; exit 1; }

          current=$(get /api/instance/extensions/v1)
          # The OAuth sign-in needs the instance's public callback URL.
          jq -e '.oauth.redirectUri | strings | startswith("https://")' <<< "$current" > /dev/null ||
            { echo "::error::The deployment has no public base URL, so OAuth sign-in is unavailable"; exit 1; }
          # The Bearer server is saved with a wrong token first: Test connections must refuse it promptly.
          jq -n --argjson current "$current" --arg bundle "$bundle" --arg repo "$REPO" \
            --arg package "$EXT_PACKAGE" --arg version "$EXT_PACKAGE_VERSION" \
            --arg stateful "$URL_STATEFUL" --arg stateless "$URL_STATELESS" --arg statelessTool "$URL_STATELESS_TOOL" \
            --arg bearer "$URL_BEARER" --arg oauth "$OAUTH_FIXTURE_ORIGIN/mcp" --arg wrong "wrong-token-$RUN_TOKEN" '
            def url($name; $url; $tool; $auth): {kind: "https", name: $name, url: $url, enabled: true, tools: [$tool], capability: "read",
              authentication: $auth, repositories: [$repo], agents: [], autoApply: true};
            {
              expectedRevision: $current.library.revision,
              secrets: {"url-bearer": $wrong},
              input: {
                version: $current.contract.version,
                servers: ($current.library.servers + [{
                  kind: "package", name: "fixture-echo", enabled: true, tools: ["echo"], capability: "read",
                  ecosystem: "npm", package: $package, version: $version, bin: "mcp-server-everything", args: ["stdio"],
                  env: [], secretEnv: [], repositories: [$repo], agents: [], autoApply: true
                },
                  url("url-stateful"; $stateful; "echo"; "none"),
                  url("url-stateless"; $stateless; $statelessTool; "none"),
                  url("url-bearer"; $bearer; "echo"; "bearer"),
                  url("url-oauth"; $oauth; "echo"; "oauth")
                ]),
                skills: ($current.library.skills + [{bundleId: $bundle, enabled: true, repositories: [$repo], agents: [], autoApply: true}])
              }
            }' | post /api/instance/extensions/v1/library > "$OUT/library.json"
          jq -e --arg bundle "$bundle" --arg integrity "$EXT_PACKAGE_INTEGRITY" '
            (.library.skills | any(.bundleId == $bundle and .enabled and .autoApply)) and
            (.library.servers | any(.name == "fixture-echo" and .enabled and .autoApply and .integrity == $integrity)) and
            ([.library.servers[] | select(.kind == "https" and .enabled and .autoApply) | .name] | sort == ["url-bearer", "url-oauth", "url-stateful", "url-stateless"])
          ' "$OUT/library.json" > /dev/null

          # Test connections with the wrong Bearer token: a clean, prompt "not reachable", not a hang.
          started=$(date +%s)
          echo '{}' | post /api/instance/extensions/v1/validate > "$OUT/validate-wrong.json"
          elapsed=$(( $(date +%s) - started ))
          jq -e '.results[] | select(.name == "url-bearer") | .reachable == false and .status == "unavailable" and .authentication == "bearer"' "$OUT/validate-wrong.json" > /dev/null ||
            { echo "::error::A wrong Bearer token was not refused: $(jq -c '.results[] | select(.name == "url-bearer")' "$OUT/validate-wrong.json")"; exit 1; }
          (( elapsed < 60 )) || { echo "::error::Test connections took ${elapsed}s with a wrong Bearer token"; exit 1; }
          echo "Wrong Bearer token refused in ${elapsed}s"
          revision=$(jq -r .library.revision "$OUT/library.json")
          jq -n --arg secret "$URL_BEARER_TOKEN" --argjson revision "$revision" '{name: "url-bearer", secret: $secret, expectedRevision: $revision}' |
            post /api/instance/extensions/v1/secrets > "$OUT/library.json"

          # OAuth sign-in through the Settings API, no browser: Check, Connect, the provider's consent
          # (the fixture approves at once) and ProPR's callback, in one cookie session as a browser would.
          jq -n --arg url "$OAUTH_FIXTURE_ORIGIN/mcp" '{url: $url}' | post /api/instance/extensions/v1/oauth/check > "$OUT/oauth-check.json"
          jq -e --arg issuer "$OAUTH_FIXTURE_ORIGIN" '.check.authorizationRequired and .check.registration == "dynamic" and .check.issuer == $issuer' "$OUT/oauth-check.json" > /dev/null ||
            { echo "::error::OAuth discovery of the fixture failed: $(jq -c .check "$OUT/oauth-check.json")"; exit 1; }
          jar="$OUT/oauth-cookies"
          authorization=$(echo '{"name":"url-oauth"}' | post /api/instance/extensions/v1/oauth/start -c "$jar" -b "$jar" | jq -er '.authorizationUrl | strings')
          [[ $authorization == "$OAUTH_FIXTURE_ORIGIN/authorize?"* ]]
          callback=$(curl --silent --show-error -o /dev/null -w '%{redirect_url}' "$authorization")
          [[ $callback == "$base/api/instance/extensions/v1/oauth/callback?"* ]] ||
            { echo "::error::The fixture's consent did not redirect to ProPR's callback"; exit 1; }
          api "${callback#"$base"}" -c "$jar" -b "$jar" > "$OUT/oauth-callback.html"
          grep -q 'is connected' "$OUT/oauth-callback.html" || { echo "::error::The OAuth callback did not connect url-oauth"; exit 1; }
          rm -f "$jar"
          get /api/instance/extensions/v1 | jq -e '.oauth.connections["url-oauth"].state == "connected"' > /dev/null

          # Test connections again: every URL server is reached and reports its session mode and authentication.
          echo '{}' | post /api/instance/extensions/v1/validate > "$OUT/validate.json"
          jq -e '[.results[] | select(.name | startswith("url-")) | {key: .name, value: [.reachable, .session, .authentication]}] | from_entries == {
              "url-stateful": [true, "stateful", "none"], "url-stateless": [true, "stateless", "none"],
              "url-bearer": [true, "stateful", "bearer"], "url-oauth": [true, "stateful", "oauth"]
            }' "$OUT/validate.json" > /dev/null ||
            { echo "::error::Test connections: $(jq -c '[.results[] | select(.name | startswith("url-"))]' "$OUT/validate.json")"; exit 1; }
          {
            echo "### Extension Library (revision $(jq -r .library.revision "$OUT/library.json"))"
            echo "- Skill bundle \`fixture-token\` ($bundle), auto-applied to $REPO"
            echo "- Package MCP server \`fixture-echo\`: \`$EXT_PACKAGE@$EXT_PACKAGE_VERSION\` ($EXT_PACKAGE_INTEGRITY), auto-applied to $REPO"
            echo "- URL MCP servers after Test connections (a wrong Bearer token was refused in ${elapsed}s first):"
            jq -r --arg stateful "$URL_STATEFUL" --arg stateless "$URL_STATELESS" --arg bearer "$URL_BEARER" --arg oauth "$OAUTH_FIXTURE_ORIGIN/mcp" '
              {"url-stateful": $stateful, "url-stateless": $stateless, "url-bearer": $bearer, "url-oauth": $oauth} as $urls
              | .results[] | select(.name | startswith("url-"))
              | "  - `\(.name)` \($urls[.name]): \(.session), auth \(.authentication)"' "$OUT/validate.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure the signed App webhook and create the agent-labeled issue
        env:
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Cleanup can run after the JWT expires, so mint on each invocation.
          cat > "$OUT/app-jwt.sh" <<'BASH'
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          sed -n 's/^PROPR_GH_PRIVATE_KEY_B64=//p' "$ENV_FILE" | base64 -d > "$key"
          app_id=$(sed -n 's/^GH_APP_ID=//p' "$ENV_FILE")
          [[ $app_id =~ ^[0-9]+$ ]]
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          now=$(date +%s)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now-60))" "$((now+540))" "$app_id" | b64url)
          signature=$(printf '%s' "$header.$payload" | openssl dgst -sha256 -sign "$key" | b64url)
          printf '%s' "$header.$payload.$signature"
          BASH
          cat > "$OUT/installation-token.sh" <<'BASH'
          set -euo pipefail
          installation_id=$(sed -n 's/^GH_INSTALLATION_ID=//p' "$ENV_FILE")
          [[ $installation_id =~ ^[0-9]+$ ]]
          jwt=$(bash "$OUT/app-jwt.sh")
          echo "::add-mask::$jwt" >&2
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $jwt" \
            -H 'Accept: application/vnd.github+json' "https://api.github.com/app/installations/$installation_id/access_tokens" |
            jq -er '.token | strings | select(length > 0)'
          BASH
          jwt=$(bash "$OUT/app-jwt.sh")
          echo "::add-mask::$jwt"
          app_api() { curl --fail --silent --show-error -H "Authorization: Bearer $jwt" "https://api.github.com/app$1" "${@:2}"; }
          registration=$(app_api '')
          if ! jq -e '.events | contains(["issues","pull_request"])' <<< "$registration" > /dev/null; then
            echo "::error::Activate the fixture App webhook and subscribe to Issues and Pull request under Permissions & events."
            exit 1
          fi
          # Mark before PATCH so teardown also handles a lost configuration response.
          touch "$OUT/reset-app-hook"
          jq -n --rawfile secret "$OUT/hook-secret" --arg url "https://$APP.fly.dev/webhook" \
            '{url:$url,content_type:"json",insecure_ssl:"0",secret:($secret|rtrimstr("\n"))}' |
            app_api /hook/config -X PATCH -H 'Content-Type: application/json' --data-binary @- > /dev/null
          bash "$OUT/installation-token.sh" > /dev/null

          body="Create $APP.txt with exactly two lines. The first line is exactly $APP. The second line is the output of running \`$RUNTIME_PACKAGE_COMMAND\` in your shell, copied verbatim; do not install anything or edit that output. Open a PR resolving this issue."
          if [[ $EXTENSIONS == true ]]; then
            body="Create $APP.txt containing exactly eight lines and nothing else:
          1. \`$APP\`
          2. the output of running \`$RUNTIME_PACKAGE_COMMAND\` in your shell, copied verbatim; do not install anything or edit that output
          3. the fixture skill token (the \`fixture-token\` skill tells you what it is)
          4. the exact text returned by the \`echo\` tool of the \`fixture-echo\` MCP server when called with message \`MCP-OK-$RUN_TOKEN\`
          5. the exact text returned by the \`echo\` tool of the \`url-stateful\` MCP server when called with message \`URL-STATEFUL-OK-$RUN_TOKEN\`
          6. \`URL-STATELESS-OK-$RUN_TOKEN\` if the \`$URL_STATELESS_TOOL\` tool of the \`url-stateless\` MCP server, called with repoName \`modelcontextprotocol/modelcontextprotocol\`, returned a non-empty result; otherwise \`URL-STATELESS-FAILED\`
          7. the exact text returned by the \`echo\` tool of the \`url-bearer\` MCP server when called with message \`URL-BEARER-OK-$RUN_TOKEN\`
          8. the exact text returned by the \`echo\` tool of the \`url-oauth\` MCP server when called with message \`URL-OAUTH-OK-$RUN_TOKEN\`

          Open a PR resolving this issue."
          fi
          issue=$(gh api "repos/$REPO/issues" -f title="Fly smoke $APP" -F 'labels[]=llm-claude' \
            -f body="$body" --jq .number)
          echo "ISSUE=$issue" >> "$GITHUB_ENV"
          # GET /app does not expose the Active checkbox. Verify the actual delivery.
          for _ in {1..12}; do
            delivery=$(app_api '/hook/deliveries?per_page=20' | jq -r \
              '[.[] | select(.event == "issues" and .action == "opened" and .status_code == 200)][0].id // empty')
            if [[ -n $delivery ]] && app_api "/hook/deliveries/$delivery" |
              jq -e --arg title "Fly smoke $APP" '.request.payload.issue.title == $title' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::No successful App webhook delivery for $REPO#$issue. Check Webhook → Active in the fixture App settings and its recent deliveries."
          exit 1

      - name: Observe idle stop and labeled-issue wake
        timeout-minutes: 12
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          machine=$(flyctl machine list --app "$APP" --json | jq -er 'select(length == 1) | .[0].id')
          wait_state() {
            for _ in {1..55}; do
              state=$(flyctl machine list --app "$APP" --json | jq -er --arg id "$machine" '.[] | select(.id == $id) | .state')
              [[ $state != "$1" ]] || return 0
              sleep 5
            done
            echo "Machine $machine remained $state waiting for $1"
            return 1
          }
          wait_state stopped
          # Anything the runtime installs after this point ran for the post-wake run.
          echo "STOPPED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          if [[ $MCP == true ]]; then
            # Keep the worker log from the wake on: `flyctl logs --no-tail` only returns the latest lines.
            nohup flyctl logs --app "$APP" --json > "$OUT/app-logs.jsonl" 2> "$OUT/app-logs.err" &
          fi
          gh issue edit "$ISSUE" --repo "$REPO" --add-label AI
          wait_state started

      - name: Start an automation run that uses ProPR MCP
        if: env.MCP == 'true'
        timeout-minutes: 10
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl --fail --retry 12 --retry-all-errors -o /dev/null -w '%{http_code}' "https://$APP.fly.dev/health")
          [[ $status == 200 ]]
          # Record the owner's GitHub grant (a browser sign-in does this); agent-run MCP grants require it.
          seed=$(base64 -w0 <<'JS'
          const { githubUserGrantService } = await import('/usr/src/app/dist/packages/api/githubUserGrantService.js');
          const { closeConnection } = await import('@propr/core');
          const token = process.env.PROPR_E2E_MCP_OWNER_TOKEN;
          const response = await fetch('https://api.github.com/user', { headers: { Authorization: `Bearer ${token}`, 'User-Agent': 'propr-fly-e2e' } });
          if (!response.ok) throw new Error(`GitHub /user returned ${response.status}`);
          const { id, login } = await response.json();
          const captured = await githubUserGrantService.capture({ id: String(id), login, username: login, displayName: login,
            email: null, avatarUrl: null, accessToken: token, oauthSource: 'github' });
          if (!captured) throw new Error('The GitHub user grant was not recorded');
          console.log(`Recorded the GitHub grant for ${login}`);
          // No repository seed: the daemon seeds the stored list from GITHUB_REPOS_TO_MONITOR at startup.
          await closeConnection();
          process.exit(0);
          JS
          )
          flyctl ssh console --app "$APP" --container app -C "sh -c 'cd /usr/src/app && echo $seed | base64 -d | node --input-type=module'"
          source .github/fly-e2e/propr-api.sh
          # The same payload test/flyE2eMcpAutomation.test.ts pushes through the real route handlers.
          definition=$(jq --arg repo "$REPO" '.repositories = [$repo]' .github/fly-e2e/mcp-automation-definition.json |
            propr_api POST /automation-definitions --data-binary @- | jq -er '.definition.id | strings')
          echo "Created automation definition $definition"
          echo "MCP_TRIGGERED_AT=$(( $(date +%s) * 1000 ))" >> "$GITHUB_ENV"
          run=$(propr_api POST "/automation-definitions/$definition/runs" -H "Idempotency-Key: $APP-mcp" --data '{"source":"fly-e2e"}' |
            jq -er '.run.id | strings')
          echo "Started automation run $run"
          echo "AUTOMATION_RUN=$run" >> "$GITHUB_ENV"

      - name: Verify the linked PR, its runtime package and its agent execution
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          set -o pipefail
          if [[ $EXTENSIONS == true ]]; then
            # The no-tail buffer holds only recent lines; keep the whole run's log for the extension records.
            flyctl logs --app "$APP" --json > "$OUT/app-logs.json" 2> /dev/null &
            log_stream=$!
          fi
          for _ in {1..24}; do
            if recovery=$(flyctl logs --app "$APP" --no-tail --json |
              jq -sce '[.[] | .message | fromjson? | select(.msg == "Woke from idle shutdown")]
                | max_by(.wokeAt).webhookRecovery | objects'); then
              break
            fi
            sleep 5
          done
          [[ -n $recovery ]] || { echo "::error::Missing idle-wake webhookRecovery record"; exit 1; }
          redelivered=$(jq -er '.redelivered | numbers' <<< "$recovery")
          echo "Idle wake webhookRecovery.redelivered=$redelivered"
          jq -e '.error == null' <<< "$recovery" > /dev/null || { echo "::error::App webhook recovery reported an error"; exit 1; }

          for _ in {1..150}; do
            pr=$(gh pr list --repo "$REPO" --json number,closingIssuesReferences,isCrossRepository |
              jq -r --argjson issue "$ISSUE" '.[] | select(.isCrossRepository == false and any(.closingIssuesReferences[]; .number == $issue)) | .number')
            [[ -z $pr ]] || break
            sleep 15
          done
          [[ $pr =~ ^[0-9]+$ ]] || { echo "No unique linked PR for $REPO#$ISSUE"; exit 1; }
          sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          token=$(bash "$OUT/installation-token.sh")
          echo "::add-mask::$token"
          GH_TOKEN="$token" gh api "repos/$REPO/contents/$APP.txt?ref=$sha" --jq .content | base64 -d > "$OUT/fixture.txt"
          mapfile -t lines < <(tr -d '\r' < "$OUT/fixture.txt")
          expected_lines=$([[ $EXTENSIONS == true ]] && echo 8 || echo 2)
          for i in $(seq 0 $((expected_lines - 1))); do printf 'Fixture file line %s: %s\n' $((i + 1)) "${lines[i]-}"; done
          [[ ${#lines[@]} == "$expected_lines" && ${lines[0]} == "$APP" ]] ||
            { echo "::error::$APP.txt must have exactly $expected_lines lines, the first being $APP"; exit 1; }
          if [[ -z ${lines[1]// } || ${lines[1]} == *"not found"* ]] || ! grep -Eq -- "$RUNTIME_PACKAGE_BANNER" <<< "${lines[1]}"; then
            echo "::error::Line 2 of $APP.txt is not the $RUNTIME_PACKAGE version banner, so the runtime package was not installed for the run"
            exit 1
          fi
          # Evidence: the runtime installed the configured list after the idle stop (Sprite provisioning or Fly Machine start).
          expected_log=$([[ $AGENT_RUNTIME == sprites ]] && echo 'Installed agent runtime packages on Sprite' ||
            echo 'Installed agent runtime packages at Fly Machine start')
          install=$(flyctl logs --app "$APP" --no-tail --json |
            jq -sc --argjson since "$STOPPED_AT_MS" --arg msg "$expected_log" '[.[] | .message | fromjson?
              | select((.msg // "") == $msg and (.time // 0) >= $since)] | last // empty')
          [[ -n $install ]] || { echo "::error::Missing '$expected_log' log after the idle stop"; exit 1; }
          jq -r '"\(.msg): packagesDigest=\(.packagesDigest) packageCount=\(.packageCount) installMs=\(.installMs)"' <<< "$install"
          jq -e --arg digest "$RUNTIME_PACKAGES_DIGEST" --argjson count "$RUNTIME_PACKAGE_COUNT" \
            '.packagesDigest == $digest and .packageCount == $count and (.installMs | numbers) >= 0' \
            <<< "$install" > /dev/null || { echo "::error::Runtime package install log does not match packagesDigest $RUNTIME_PACKAGES_DIGEST"; exit 1; }
          if [[ $EXTENSIONS == true ]]; then
            expected=("SKILL-OK-$RUN_TOKEN" "Echo: MCP-OK-$RUN_TOKEN" "URL-STATEFUL-OK-$RUN_TOKEN"
              "URL-STATELESS-OK-$RUN_TOKEN" "URL-BEARER-OK-$RUN_TOKEN" "URL-OAUTH-OK-$RUN_TOKEN")
            for i in "${!expected[@]}"; do
              [[ ${lines[i + 2]:-} == "${expected[i]}" ]] ||
                { echo "::error::$APP.txt line $((i + 3)) is '${lines[i + 2]:-}', expected '${expected[i]}'"; exit 1; }
            done
            kill "$log_stream" 2> /dev/null || true
            logs=$({ cat "$OUT/app-logs.json"; flyctl logs --app "$APP" --no-tail --json; } |
              jq -sc '[.[] | .message? | strings | fromjson? | objects] | unique')
            applied=$(jq -ce --arg runtime "$AGENT_RUNTIME" '[.[] | select(.msg == "Extension Library items applied to this run"
              and .runtime == $runtime and .skills >= 1 and .packageServers >= 1 and .urlServers == 4)] | max_by(.time) | objects' <<< "$logs") ||
              { echo "::error::No 'Extension Library items applied to this run' record for $AGENT_RUNTIME with skills>=1, packageServers>=1 and urlServers=4"; exit 1; }
            installed=$(jq -ce --arg digest "$(jq -r .packageServersDigest <<< "$applied")" '[.[] | select(
              (.msg == "Installed package MCP servers on Sprite" or .msg == "Installed package MCP servers at Fly Machine start")
              and .packageServersDigest == $digest)] | max_by(.time) | objects' <<< "$logs") ||
              { echo "::error::No 'Installed package MCP servers' record for the applied package-server digest"; exit 1; }
            {
              echo "### Extension Library on the remote runtime ($AGENT_RUNTIME)"
              echo "- extensionDigest: \`$(jq -r .extensionDigest <<< "$applied")\`"
              echo "- packageServersDigest: \`$(jq -r .packageServersDigest <<< "$applied")\`"
              echo "- skills=$(jq -r .skills <<< "$applied"), packageServers=$(jq -r .packageServers <<< "$applied"), urlServers=$(jq -r .urlServers <<< "$applied")"
              echo "- $(jq -r .msg <<< "$installed"): installMs=$(jq -r .installMs <<< "$installed")"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            # The gateway's upstream sessions for this run: opened while the agent ran, closed (with a DELETE
            # for stateful ones) once the grant ended. The API sweeps ended grants every 15 s.
            task=$(jq -r .taskId <<< "$applied")
            servers='["url-bearer","url-oauth","url-stateful","url-stateless"]'
            for _ in {1..12}; do
              logs=$({ cat "$OUT/app-logs.json"; timeout 60s flyctl logs --app "$APP" --no-tail --json; } |
                jq -sc '[.[] | .message? | strings | fromjson? | objects] | unique')
              closed=$(jq -c --arg task "$task" '[.[] | select(.msg == "Closed extension URL MCP upstream session" and .taskId == $task)]
                | group_by(.server) | map(max_by(.time))' <<< "$logs")
              jq -e --argjson servers "$servers" '[.[].server] | sort == $servers' <<< "$closed" > /dev/null && break
              sleep 10
            done
            opened=$(jq -c --arg task "$task" '[.[] | select(.msg == "Opened extension URL MCP upstream session" and .taskId == $task)]' <<< "$logs")
            jq -e --argjson servers "$servers" '[.[].server] | unique == $servers' <<< "$opened" > /dev/null ||
              { echo "::error::Missing 'Opened extension URL MCP upstream session' records: $(jq -c '[.[] | {server, sessionMode}]' <<< "$opened")"; exit 1; }
            jq -e '[.[] | {key: .server, value: [.sessionMode, .authentication]}] | from_entries == {
                "url-stateful": ["stateful", "none"], "url-stateless": ["stateless", "none"],
                "url-bearer": ["stateful", "bearer"], "url-oauth": ["stateful", "oauth"]
              }' <<< "$opened" > /dev/null ||
              { echo "::error::Unexpected session or auth modes: $(jq -c '[.[] | {server, sessionMode, authentication}]' <<< "$opened")"; exit 1; }
            jq -e --argjson servers "$servers" '([.[].server] | sort == $servers) and all(.toolCalls >= 1)
              and all(if .sessionMode == "stateful" then .deleted else true end)' <<< "$closed" > /dev/null ||
              { echo "::error::The run's URL MCP sessions were not all used and closed: $(jq -c '[.[] | {server, toolCalls, deleted, reason}]' <<< "$closed")"; exit 1; }
            stats=$(curl --fail --silent --show-error --retry 4 --retry-all-errors "$OAUTH_FIXTURE_ORIGIN/stats")
            jq -e --arg token "URL-OAUTH-OK-$RUN_TOKEN" '.refreshes >= 1 and (.echoes | index($token)) != null and .sessionsDeleted >= 1' <<< "$stats" > /dev/null ||
              { echo "::error::The OAuth fixture saw no refresh, echo or DELETE: $(jq -c '{refreshes, sessionsOpened, sessionsDeleted, sessionNotFound, unauthorized}' <<< "$stats")"; exit 1; }
            {
              echo "### URL MCP servers through the gateway ($AGENT_RUNTIME)"
              echo "| Server | Session | Auth | Tool calls | Token refreshes | Re-initialized | Closed |"
              echo "| --- | --- | --- | --- | --- | --- | --- |"
              jq -r '.[] | "| `\(.server)` | \(.sessionMode) | \(.authentication) | \(.toolCalls) | \(.refreshes) | \(.reinitialized) | \(.reason)\(if .deleted then ", DELETE sent" else "" end) |"' <<< "$closed"
              echo "- OAuth fixture on a $([[ $OAUTH_FIXTURE_HOST == sprite ]] && echo Sprite || echo 'Fly Machine') (\`$OAUTH_FIXTURE_NAME\`, access tokens ${OAUTH_ACCESS_TTL}s): $(jq -r '"\(.refreshes) refreshes, \(.sessionsOpened) sessions opened, \(.sessionsDeleted) deleted, \(.sessionNotFound) session-not-found replies"' <<< "$stats")"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Read the worker's measurement for this issue AND PR, after wake was observed.
          check=$(base64 -w0 <<JS
          const db = require('/usr/src/app/node_modules/better-sqlite3')('/usr/src/app/data/propr.sqlite', {readonly:true});
          const run = db.prepare(\`SELECT e.compute_runtime, e.compute_wall_time_ms, e.compute_cost_usd
            FROM llm_executions e JOIN tasks t USING (task_id)
            WHERE t.repository = ? COLLATE NOCASE AND t.issue_number = ? AND t.pr_number = ?
              AND e.success = 1 AND e.compute_runtime = ? LIMIT 1\`).get('$REPO', $ISSUE, $pr, '$AGENT_RUNTIME');
          if (!run) process.exit(1);
          console.log(JSON.stringify(run));
          JS
          )
          for _ in {1..12}; do
            if flyctl ssh console --app "$APP" --container app -C "node -e \"eval(Buffer.from('$check','base64').toString())\""; then
              exit 0
            fi
            sleep 5
          done
          echo "Missing successful compute_runtime: $AGENT_RUNTIME execution for $REPO#$ISSUE, PR #$pr"
          exit 1

      - name: Verify the ProPR MCP automation over the SSH reverse forward
        if: env.MCP == 'true'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          set -euo pipefail
          : "${AUTOMATION_RUN:?The automation run was not started}"
          source .github/fly-e2e/propr-api.sh
          # On any failure, read the run, its task timeline and logs, and the worker lines that name
          # them while the app is still up: the failure dump only has flyctl's last few minutes.
          trap 'status=$?; (( status == 0 )) || bash .github/fly-e2e/mcp-run-diagnostics.sh "$AUTOMATION_RUN" "$OUT/app-logs.jsonl"; exit $status' EXIT
          # 25 minutes, which leaves the step time for the diagnostics.
          for _ in {1..100}; do
            run=$(propr_api GET "/automation-runs/$AUTOMATION_RUN" | jq -ec '.run | objects')
            state=$(jq -r .state <<< "$run")
            case $state in completed|failed|skipped|rejected|cancelled) break ;; esac
            sleep 15
          done
          echo "Automation run $AUTOMATION_RUN: $state"
          [[ $state == completed ]] || {
            echo "::error::Automation run ended $state: $(jq -r '.failureReason // .skipReason // .error // "no reason recorded"' <<< "$run" | propr_redact)"
            exit 1
          }
          task=$(jq -er '.reportTaskId | strings' <<< "$run")

          # 1. The report carries the tool's deterministic result: this fixture's only repository.
          line=$(jq -r '.report // ""' <<< "$run" | grep -m1 '^PROPR_MCP_' || true)
          echo "Report: $line"
          [[ ${line,,} == "propr_mcp_repositories: ${REPO,,}" ]] ||
            { echo "::error::The automation report does not show list_repositories returning $REPO"; exit 1; }

          # 2. The API recorded that tool call: the report cannot have been guessed.
          check=$(base64 -w0 <<JS
          const db = require('/usr/src/app/node_modules/better-sqlite3')('/usr/src/app/data/propr.sqlite', {readonly:true});
          const row = db.prepare(\`SELECT COUNT(*) AS calls FROM mcp_access_log
            WHERE kind = 'tool' AND name = 'list_repositories' AND outcome = 'success' AND occurred_at >= ?\`).get($MCP_TRIGGERED_AT);
          console.log(JSON.stringify(row));
          if (!row.calls) process.exit(1);
          JS
          )
          flyctl ssh console --app "$APP" --container app -C "node -e \"eval(Buffer.from('$check','base64').toString())\"" ||
            { echo "::error::No successful list_repositories call in the MCP access log"; exit 1; }

          # 3. The run's task log line, which the worker also logs with the task id.
          transport() {
            jq -c --arg task "$1" '.message | fromjson? | objects
              | select(.taskId == $task and .mcpTransport == "ssh-reverse-forward"
                and (.msg | strings | startswith("ProPR MCP transport: ssh-reverse-forward")))' "${@:2}"
          }
          found=$(transport "$task" "$OUT/app-logs.jsonl" 2>/dev/null | head -n1 || true)
          if [[ -z $found ]]; then
            timeout 60s flyctl logs --app "$APP" --no-tail --json > "$OUT/app-logs-recent.jsonl" || true
            found=$(transport "$task" "$OUT/app-logs-recent.jsonl" 2>/dev/null | head -n1 || true)
          fi
          [[ -n $found ]] || { echo "::error::No 'ProPR MCP transport: ssh-reverse-forward' line for task $task"; exit 1; }
          echo "Task $task: $(jq -r .msg <<< "$found")"
          {
            echo "### ProPR MCP over the SSH reverse forward"
            echo "- Automation run \`$AUTOMATION_RUN\` completed; report: \`$line\`"
            echo "- Task \`$task\` log: \`$(jq -r .msg <<< "$found")\`"
            echo "- Issue-labeled runs get no ProPR MCP grant, so the issue run has no MCP transport line."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reset the fixture App webhook to its placeholder URL
        if: always() && steps.app.outcome == 'success'
        run: |
          if [[ -f $OUT/reset-app-hook ]]; then
            jwt=$(bash "$OUT/app-jwt.sh")
            echo "::add-mask::$jwt"
            curl --fail --silent --show-error --retry 3 -o /dev/null -X PATCH \
              -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' \
              --data '{"url":"https://example.invalid/webhook"}' https://api.github.com/app/hook/config
          fi
      - name: Dump app logs on failure
        if: failure() && steps.app.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: |
          source .github/fly-e2e/propr-api.sh
          timeout 60s flyctl logs --app "$APP" --no-tail 2>&1 | propr_redact | tail -n 200 || true

      - name: Destroy test app, Machines and volume
        if: always() && steps.app.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: flyctl apps destroy "$APP" --yes
      - name: Destroy the Fly Machines agent app
        # Keyed only on the marker written right after the app is created, so it runs whatever failed.
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: if [[ -f $OUT/destroy-agent-app ]]; then flyctl apps destroy "$AGENT_APP" --yes; fi
      - name: Reap remaining Sprites owned by this deployment
        if: always() && steps.app.outcome == 'success' && env.AGENT_RUNTIME == 'sprites'
        env:
          SPRITES_TOKEN: ${{ secrets.FLY_E2E_SPRITES_TOKEN }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { SpritesClient } from '@fly/sprites';
          import { spritePoolKey } from './packages/shared/src/statusKeys.ts';
          const marker = createHash('sha256').update(spritePoolKey(process.env.APP)).digest('hex').slice(0, 16);
          const prefix = 'propr-' + marker + '-';
          const client = new SpritesClient(process.env.SPRITES_TOKEN);
          for (const sprite of await client.listAllSprites(prefix)) {
            if (sprite.name.startsWith(prefix)) await client.deleteSprite(sprite.name);
          }
          JS
      - name: Delete the OAuth fixture Sprite
        # Keyed only on the marker written before the Sprite is created, so it runs whatever failed.
        if: always() && env.EXTENSIONS == 'true'
        env:
          SPRITES_TOKEN: ${{ secrets.FLY_E2E_SPRITES_TOKEN }}
        run: |
          [[ -f $OUT/delete-oauth-sprite ]] || exit 0
          node --input-type=module <<'JS'
          import { SpritesClient } from '@fly/sprites';
          const client = new SpritesClient(process.env.SPRITES_TOKEN);
          const name = process.env.OAUTH_FIXTURE_NAME;
          const remaining = await client.listAllSprites(name);
          for (const sprite of remaining) if (sprite.name === name) await client.deleteSprite(name);
          if ((await client.listAllSprites(name)).some(sprite => sprite.name === name)) throw new Error(`Sprite ${name} is still listed`);
          console.log(`Deleted the OAuth fixture Sprite ${name}`);
          JS
      - name: Destroy the OAuth fixture's Fly app
        # Keyed only on the marker written before the app is created, so it runs whatever failed.
        if: always() && env.EXTENSIONS == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_E2E_TOKEN }}
        run: if [[ -f $OUT/destroy-oauth-app ]]; then flyctl apps destroy "$OAUTH_FIXTURE_NAME" --yes; fi
      - name: Close fixture work
        if: always() && env.ISSUE != ''
        env:
          GH_TOKEN: ${{ secrets.FLY_E2E_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token=$(bash "$OUT/installation-token.sh")
          echo "::add-mask::$token"
          # $1 is the URI-encoded branch name; a branch already gone is fine.
          delete_branch() {
            status=$(curl --silent --show-error -o "$OUT/delete-ref.json" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $token" "https://api.github.com/repos/$REPO/git/refs/heads/$1")
            [[ $status == 204 ]] && return 0
            if [[ $status == 404 || $status == 422 ]] && jq -e --arg status "$status" '
              .message | test("^Reference does not exist[.]?$"; "i") or ($status == "404" and . == "Not Found")
            ' "$OUT/delete-ref.json" >/dev/null; then
              return 0
            fi
            echo "::error::Deleting branch $1 returned HTTP $status"
            return 1
          }
          encode='split("/") | map(@uri) | join("/")'
          prs=$(gh pr list --repo "$REPO" --json number,headRefName,closingIssuesReferences,isCrossRepository |
            jq -r --argjson issue "$ISSUE" '.[] | select(.isCrossRepository == false and any(.closingIssuesReferences[]; .number == $issue)) | [.number, (.headRefName | '"$encode"')] | @tsv')
          if [[ -n $prs ]]; then
            while IFS=$'\t' read -r pr ref; do
              gh pr close "$pr" --repo "$REPO"
              delete_branch "$ref"
            done <<< "$prs"
          fi
          # A run that failed before opening a PR still leaves its "<issue>/..." branch behind.
          branches=$(gh api --paginate "repos/$REPO/git/matching-refs/heads/$ISSUE/" |
            jq -r '.[].ref | ltrimstr("refs/heads/") | '"$encode")
          if [[ -n $branches ]]; then
            while read -r ref; do
              echo "Deleting leftover fixture branch $ref"
              delete_branch "$ref"
            done <<< "$branches"
          fi
          gh issue close "$ISSUE" --repo "$REPO"
