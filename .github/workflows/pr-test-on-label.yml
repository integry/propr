name: Full Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: full-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Must match the shard matrix below. The aggregate gate proves that exactly
  # this many shard summaries together ran every discovered test unit once.
  PROPR_TEST_SHARD_COUNT: '4'

# Four workers, one matrix shard per worker. The opt-in is an activation gate,
# not an access-control boundary; editable fork workflows require careful approval.
#
# Backend coverage is never narrowed: the four shards and their exactly-once
# coverage verification run for every ready pull request and every dispatch,
# and do not depend on the classifier. Only the docs site validation and the
# hosted native Electron units are gated, on the shared classifier's `docs` and
# `desktop` surfaces. See docs/ci-change-classification.md.

jobs:
  # The shared classifier (scripts/ci-change-classification.mjs) decides which
  # surfaces a ready pull request touches. Manual dispatch never consults it,
  # so the gated jobs below see an empty decision and run.
  classify:
    name: Classify changed surfaces
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      status: ${{ steps.classify.outputs.status }}
      broad: ${{ steps.classify.outputs.broad }}
      docs: ${{ steps.classify.outputs.docs }}
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the merge base of the captured base and head is a
          # real commit rather than a shallow boundary.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed surfaces
        id: classify
        uses: ./.github/actions/classify-changes

  # Not gated and not dependent on the classifier: every shard installs and
  # builds the workspace (`npm ci`, `npm run test:prepare`) and asserts the
  # built outputs, so test preparation is enforced here even when the docs job
  # below is skipped.
  shard:
    name: Full Test Suite Shard ${{ matrix.shard }}/4
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    # Rootless opt-in; approval-based trust, not strict admission control. See docs/ci-runners.md.
    runs-on: ${{ fromJSON(vars.PROPR_ROOTLESS_PR_CHECKS == 'true' && github.actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && '["self-hosted","Linux","X64","propr-rootless"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Keep the token out of .git/config in a persistent runner workspace.
          # The default clean checkout also removes files left there by an
          # earlier job (node_modules, dist).
          persist-credentials: false

      # Self-hosted only: RUNNER_TEMP is private to this job on this runner
      # worker and emptied by the runner, so nothing below reads or writes the
      # host's /root, shared caches or another worker's state. TMPDIR is this
      # job's own directory under /tmp, removed by the last step.
      - name: Isolate job state from the shared host
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          ./scripts/ci-rootless-preflight.sh
          job_root="$RUNNER_TEMP/ci"
          rm -rf -- "$job_root"
          mkdir -p "$job_root/home" "$job_root/pw"
          # TMPDIR is a private 0700 directory directly under the sticky /tmp,
          # the same ancestry tests get on hosted runners. The runner's own
          # tree can have a group-writable ancestor, which the CLI's private
          # directory checks rightly reject, and its long path overflows
          # Chromium's singleton socket path.
          tmp_dir="$(mktemp -d /tmp/propr-ci.XXXXXX)"
          {
            echo "HOME=$job_root/home"
            echo "DOCKER_CONFIG=$job_root/home/.docker"
            echo "TMPDIR=$tmp_dir"
            echo "PROPR_CI_TMPDIR=$tmp_dir"
            echo "XDG_CONFIG_HOME=$job_root/home/.config"
            echo "XDG_CACHE_HOME=$job_root/home/.cache"
            echo "PLAYWRIGHT_BROWSERS_PATH=$job_root/pw"
          } >> "$GITHUB_ENV"

      # Placement evidence for docs/ci-runners.md: which worker ran this job,
      # as which user, and the limits of the cgroup its processes run in.
      - name: Record runner placement
        env:
          PROPR_EVIDENCE_LABEL: shard ${{ matrix.shard }}/4
        run: ./scripts/ci-runner-evidence.sh

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            propr-ui/package-lock.json
            docs/package-lock.json
            packages/shared/package-lock.json
            packages/api/package-lock.json
            packages/core/package-lock.json

      - name: Install Dependencies
        id: install
        run: npm ci

      # The clean checkout must have removed any earlier job's output, so a
      # stale build can never stand in for one that did not run.
      - name: Build workspace packages
        id: build
        run: |
          test ! -e packages/shared/dist
          test ! -e packages/client/dist
          npm run test:prepare
          test -f packages/shared/dist/index.js
          test -f packages/client/dist/index.js

      # Browser-backed server tests need the same Chromium that the docs
      # validation job installs through .propr/setup.sh. Only the browser is
      # downloaded (into PLAYWRIGHT_BROWSERS_PATH on self-hosted workers);
      # system packages are never installed on the shared host.
      - name: Install Chromium for browser tests
        id: browser
        run: npm exec --workspace propr-ui -- playwright install chromium

      # Matrix entries share GITHUB_RUN_ID and GITHUB_JOB and may run on the
      # same host, so the instance names the shard; ci-redis.sh adds the run
      # attempt and applies explicit Docker resource limits.
      - name: Start isolated Redis
        id: redis
        env:
          CI_REDIS_INSTANCE: shard-${{ matrix.shard }}
        run: ./scripts/ci-redis.sh start

      - name: Run Full Test Suite shard
        id: tests
        continue-on-error: true
        env:
          NODE_ENV: test
          PROPR_TEST_SHARD_INDEX: ${{ matrix.shard }}
          PROPR_TEST_SUMMARY_FILE: ${{ github.workspace }}/shard-output/summary.json
        run: |
          mkdir -p shard-output
          echo "Running full test suite shard ${PROPR_TEST_SHARD_INDEX}/${PROPR_TEST_SHARD_COUNT} with Redis..."
          npm run test:full:prepared 2>&1 | tee test_output.txt
          exit "${PIPESTATUS[0]}"

      - name: Record shard stage outcomes
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          REDIS_RESULT: ${{ steps.redis.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          mkdir -p shard-output
          node -e '
            const env = process.env;
            const stages = {
              "Dependency install": env.INSTALL_RESULT,
              "Workspace build": env.BUILD_RESULT,
              "Chromium install": env.BROWSER_RESULT,
              "Redis startup": env.REDIS_RESULT,
              "Test shard": env.TEST_RESULT,
            };
            const runner = { name: env.RUNNER_NAME, environment: env.RUNNER_ENVIRONMENT };
            const record = { shard: Number(env.SHARD), runAttempt: Number(env.GITHUB_RUN_ATTEMPT), runner, stages };
            require("fs").writeFileSync("shard-output/stages.json", JSON.stringify(record, null, 2));
          '

      - name: Sanitize test output
        if: always()
        env:
          GITHUB_TOKEN_TO_REDACT: ${{ github.token }}
        run: node scripts/sanitize-ci-output.mjs test_output.txt shard-output/test_output.sanitized.txt

      - name: Remove raw test output
        if: always()
        run: rm -f -- "$GITHUB_WORKSPACE/test_output.txt"

      - name: Upload shard output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: full-test-output-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: shard-output/
          if-no-files-found: ignore

      - name: Fail Job
        if: steps.tests.outcome == 'failure'
        run: exit 1

      # Stops only this shard's own container for this attempt, also on
      # failure and cancellation.
      - name: Stop isolated Redis
        if: always() && (runner.environment != 'self-hosted' || env.PROPR_ROOTLESS_DOCKER_READY == 'true')
        env:
          CI_REDIS_INSTANCE: shard-${{ matrix.shard }}
        run: ./scripts/ci-redis.sh stop

      # Self-hosted only, also on failure and cancellation: removes this job's
      # untracked and ignored files (node_modules, dist, outputs) from its own
      # persistent workspace. .git stays for the checkout post step.
      - name: Remove job files from the persistent workspace
        if: always() && runner.environment == 'self-hosted'
        run: |
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          case "${PROPR_CI_TMPDIR:-}" in /tmp/propr-ci.*) rm -rf -- "$PROPR_CI_TMPDIR" ;; esac

  # Inputs: docs/ (site sources and its own lockfile), .propr/setup.sh, the
  # propr-ui Playwright version and the Node toolchain. The site imports nothing
  # from outside docs/; everything else is a lockfile, manifest or broad path,
  # which selects every surface. The install and workspace build here are only
  # this job's prerequisites; the shards enforce them unconditionally.
  docs:
    name: Validate Docs Site
    needs: classify
    # Only an explicit `false` skips. A failed or missing decision (dispatch
    # never classifies) leaves the output empty, which runs the job.
    # `!cancelled()` keeps superseded-run cancellation intact.
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft) &&
          needs.classify.outputs.docs != 'false' }}
    # Rootless opt-in; approval-based trust, not strict admission control. See docs/ci-runners.md.
    runs-on: ${{ fromJSON(vars.PROPR_ROOTLESS_PR_CHECKS == 'true' && github.actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && '["self-hosted","Linux","X64","propr-rootless"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      install_result: ${{ steps.install.outcome }}
      build_result: ${{ steps.build.outcome }}
      docs_result: ${{ steps.docs.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Keep the token out of .git/config in a persistent runner workspace.
          # The default clean checkout also removes files left there by an
          # earlier job (node_modules, dist).
          persist-credentials: false

      # Self-hosted only: RUNNER_TEMP is private to this job on this runner
      # worker and emptied by the runner, so nothing below reads or writes the
      # host's /root, shared caches or another worker's state. TMPDIR is this
      # job's own directory under /tmp, removed by the last step.
      - name: Isolate job state from the shared host
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          ./scripts/ci-rootless-preflight.sh
          job_root="$RUNNER_TEMP/ci"
          rm -rf -- "$job_root"
          mkdir -p "$job_root/home" "$job_root/pw" "$job_root/setup"
          # TMPDIR is a private 0700 directory directly under the sticky /tmp,
          # the same ancestry tests get on hosted runners. The runner's own
          # tree can have a group-writable ancestor, which the CLI's private
          # directory checks rightly reject, and its long path overflows
          # Chromium's singleton socket path.
          tmp_dir="$(mktemp -d /tmp/propr-ci.XXXXXX)"
          {
            echo "HOME=$job_root/home"
            echo "DOCKER_CONFIG=$job_root/home/.docker"
            echo "TMPDIR=$tmp_dir"
            echo "PROPR_CI_TMPDIR=$tmp_dir"
            echo "XDG_CONFIG_HOME=$job_root/home/.config"
            echo "XDG_CACHE_HOME=$job_root/home/.cache"
            echo "PLAYWRIGHT_BROWSERS_PATH=$job_root/pw"
            echo "PROPR_CACHE_DIR=$job_root/setup"
          } >> "$GITHUB_ENV"

      # Placement evidence for docs/ci-runners.md: which worker ran this job,
      # as which user, and the limits of the cgroup its processes run in.
      - name: Record runner placement
        run: ./scripts/ci-runner-evidence.sh

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            propr-ui/package-lock.json
            docs/package-lock.json
            packages/shared/package-lock.json
            packages/api/package-lock.json
            packages/core/package-lock.json

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Build workspace packages
        id: build
        run: npm run test:prepare

      # Runs once per workflow instead of once per shard.
      - name: Validate docs site
        id: docs
        env:
          PROPR_WORKSPACE: ${{ github.workspace }}
          PROPR_WORKSPACE_PREPARED: 'true'
        run: ./.propr/setup.sh

      # Self-hosted only, also on failure and cancellation: removes this job's
      # untracked and ignored files (node_modules, dist, outputs) from its own
      # persistent workspace. .git stays for the checkout post step.
      - name: Remove job files from the persistent workspace
        if: always() && runner.environment == 'self-hosted'
        run: |
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          case "${PROPR_CI_TMPDIR:-}" in /tmp/propr-ci.*) rm -rf -- "$PROPR_CI_TMPDIR" ;; esac

  native-electron:
    # The rootless pilot does not provide the native sandbox/session contract. Require
    # actual native assertions on hosted runners on either shard route.
    # Inputs: apps/desktop/scripts, packages/client/dist (built from
    # @propr/client and @propr/shared), the Electron binary from the lockfile and
    # scripts/run-test-suite.mjs. The classifier's `desktop` surface covers every
    # one of them; the lockfile and scripts/ select every surface.
    name: Full Test Suite Native Electron (hosted)
    needs: classify
    # Only an explicit `false` skips; see the docs job above.
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft) &&
          needs.classify.outputs.desktop != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            propr-ui/package-lock.json
            docs/package-lock.json
            packages/shared/package-lock.json
            packages/api/package-lock.json
            packages/core/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run test:prepare

      - name: Run native Electron units without skipping
        env:
          NODE_ENV: test
          PROPR_REQUIRE_NATIVE_ELECTRON: '1'
          # Clears the workflow-level count: these units run unsharded.
          PROPR_TEST_SHARD_COUNT: ''
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -l 'prepareNativeElectronTest(' apps/desktop/scripts/*.test.mjs | grep -v '/electron-native-test-setup\.test\.mjs$')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No native Electron test units were found." >&2
            exit 1
          fi
          printf 'Native Electron unit: %s\n' "${files[@]}"
          node scripts/run-test-suite.mjs "${files[@]}"

  test:
    # Required status check. Keep this name stable: it aggregates the shards
    # and docs validation so branch protection keeps the same merge gate.
    name: Run Full Test Suite
    needs: [classify, shard, docs, native-electron]
    if: >-
      ${{ always() &&
          (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      coverage_result: ${{ steps.coverage.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Download shard summaries
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          # Includes earlier attempts: re-running only failed shards keeps the
          # passing shards' artifacts from the attempt that produced them.
          pattern: full-test-output-${{ github.run_id }}-*-shard-*
          path: shard-artifacts

      - name: Verify shards ran every discovered test exactly once
        id: coverage
        continue-on-error: true
        run: |
          shopt -s nullglob
          summaries=(shard-artifacts/*/summary.json)
          if [ "${#summaries[@]}" -eq 0 ]; then
            echo "No shard summaries were uploaded." >&2
            exit 1
          fi
          node scripts/run-test-suite.mjs --verify-shard-summaries "${summaries[@]}"

      - name: Enforce shard and docs results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CLASSIFY_STATUS: ${{ needs.classify.outputs.status }}
          CLASSIFY_BROAD: ${{ needs.classify.outputs.broad }}
          DOCS_DECISION: ${{ needs.classify.outputs.docs }}
          DESKTOP_DECISION: ${{ needs.classify.outputs.desktop }}
          SHARD_RESULT: ${{ needs.shard.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          ELECTRON_RESULT: ${{ needs.native-electron.result }}
          COVERAGE_RESULT: ${{ steps.coverage.outcome }}
        run: |
          status=0
          require() {
            if [ "$2" != success ]; then
              echo "::error::$1 finished with result '$2'."
              status=1
            fi
          }
          # A skip is accepted only when the classifier ran for a pull request,
          # resolved the change set and explicitly reported the job's surface as
          # `false`. A failed, fallback or missing classification, a dispatch or
          # any other result still requires success.
          surface_gated() {
            if [ "$2" = skipped ] \
              && [ "${EVENT_NAME:-}" = pull_request ] \
              && [ "${CLASSIFY_RESULT:-}" = success ] \
              && [ "${CLASSIFY_STATUS:-}" = ok ] \
              && [ "${CLASSIFY_BROAD:-}" = false ] \
              && [ "$3" = false ]; then
              echo "::notice::$1 proved inapplicable to this change set; see the classifier job summary for the reasons."
              echo "$1: not applicable to this change set." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              return
            fi
            require "$1" "$2"
          }
          # A matrix result is success only when every shard succeeded. The
          # shards are never gated, so a skipped shard always fails.
          require "Full test suite shards" "$SHARD_RESULT"
          surface_gated "Docs site validation" "$DOCS_RESULT" "${DOCS_DECISION:-}"
          # Missing or unexplained skipped native assertions fail closed.
          surface_gated "Hosted native Electron units" "$ELECTRON_RESULT" "${DESKTOP_DECISION:-}"
          if [ "$COVERAGE_RESULT" != success ]; then
            echo "::error::Shard coverage verification finished with result '$COVERAGE_RESULT'."
            status=1
          fi
          exit "$status"

  comment:
    # The gate above still runs, and fails, when a newer push cancels this
    # run. Only runs that were not cancelled post a report, so a superseded
    # commit's cancelled shards are not reported as a test failure.
    name: Report Full Test Failure
    needs: [classify, shard, docs, native-electron, test]
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'pull_request' &&
          needs.test.result == 'failure' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download shard output
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          # Includes earlier attempts: re-running only failed shards keeps the
          # passing shards' artifacts from the attempt that produced them.
          pattern: full-test-output-${{ github.run_id }}-*-shard-*
          path: shard-artifacts

      - name: Post result comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
          DOCS_JOB_RESULT: ${{ needs.docs.result }}
          ELECTRON_RESULT: ${{ needs.native-electron.result }}
          INSTALL_RESULT: ${{ needs.docs.outputs.install_result }}
          BUILD_RESULT: ${{ needs.docs.outputs.build_result }}
          DOCS_RESULT: ${{ needs.docs.outputs.docs_result }}
          DOCS_DECISION: ${{ needs.classify.outputs.docs }}
          DESKTOP_DECISION: ${{ needs.classify.outputs.desktop }}
          COVERAGE_RESULT: ${{ needs.test.outputs.coverage_result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shardCount = Number(process.env.PROPR_TEST_SHARD_COUNT);
            const read = (file) => { try { return fs.readFileSync(file, 'utf8'); } catch { return null; } };
            const shards = new Map();
            for (const entry of fs.existsSync('shard-artifacts') ? fs.readdirSync('shard-artifacts') : []) {
              const directory = path.join('shard-artifacts', entry);
              let stages = null;
              try { stages = JSON.parse(read(path.join(directory, 'stages.json'))); } catch {}
              let summary = null;
              try { summary = JSON.parse(read(path.join(directory, 'summary.json'))); } catch {}
              const shard = stages?.shard ?? summary?.shard?.index;
              const runAttempt = stages?.runAttempt ?? summary?.runAttempt ?? 1;
              if (!shard || (shards.get(shard)?.runAttempt ?? 0) > runAttempt) continue;
              shards.set(shard, { runAttempt, runner: stages?.runner, stages: stages?.stages ?? {}, summary, output: read(path.join(directory, 'test_output.sanitized.txt')) });
            }

            const docsOutcomes = {
              'Dependency install': process.env.INSTALL_RESULT,
              'Workspace build': process.env.BUILD_RESULT,
              'Docs validation': process.env.DOCS_RESULT,
            };
            const failedStages = [];
            for (const [stage, outcome] of Object.entries(docsOutcomes)) {
              if (outcome === 'failure') failedStages.push(`${stage} (docs job)`);
            }
            const lines = [];
            const failedOutputs = [];
            for (let index = 1; index <= shardCount; index += 1) {
              const shard = shards.get(index);
              if (!shard) {
                lines.push(`- Shard ${index}/${shardCount}: no output uploaded (failed early, cancelled or skipped)`);
                continue;
              }
              const failed = Object.entries(shard.stages).filter(([, outcome]) => outcome === 'failure').map(([stage]) => stage);
              // A step stopped by a timeout records 'cancelled', not 'failure'.
              const cancelled = Object.entries(shard.stages).filter(([, outcome]) => outcome === 'cancelled').map(([stage]) => stage);
              failedStages.push(...failed.map(stage => `${stage} (shard ${index})`));
              failedStages.push(...cancelled.map(stage => `${stage} (shard ${index}, cancelled)`));
              const failures = (shard.summary?.results ?? []).filter(result => result.status === 'failed');
              const duration = shard.summary ? ` in ${(shard.summary.durationMs / 1000).toFixed(1)}s` : '';
              const status = failed.length > 0
                ? `failed during ${failed.join(', ')}`
                : cancelled.length > 0 ? `cancelled during ${cancelled.join(', ')}` : 'passed';
              const runner = shard.runner?.name ? ` on ${shard.runner.name}` : '';
              lines.push(`- Shard ${index}/${shardCount}: ${status}${duration}${runner}`);
              for (const failure of failures) lines.push(`  - \`${failure.id}\`${failure.kind === 'workspace' ? ' (workspace)' : ''}: ${failure.reason}`);
              if (failed.length > 0 || cancelled.length > 0) failedOutputs.push([index, shard.output ?? 'Output file not available.']);
            }
            if (process.env.COVERAGE_RESULT === 'failure') failedStages.push('Shard coverage verification');
            if (['failure', 'cancelled'].includes(process.env.ELECTRON_RESULT)) failedStages.push('Hosted native Electron units');

            const summary = failedStages.length > 0
              ? `Validation failed during: ${failedStages.join(', ')}.`
              : `Validation did not complete successfully (shards: ${process.env.SHARD_RESULT || 'unknown'}, docs: ${process.env.DOCS_JOB_RESULT || 'unknown'}, native Electron: ${process.env.ELECTRON_RESULT || 'unknown'}).`;
            // A surface-gated job reports the classifier decision that the
            // aggregate gate judged its skip against.
            const skipped = (decision) => `skipped (classifier decision: ${decision || 'none'})`;
            // Reserve the footer and truncation notice before adding any content.
            // String.length counts UTF-16 units, conservatively bounding characters.
            const limit = 65536;
            const footer = `\n**[View Workflow](${runUrl})**\n[View uploaded artifacts](${runUrl}#artifacts)`;
            const notice = '\nDetails truncated; see the uploaded artifacts for complete failure rows and logs.\n';
            const contentLimit = limit - footer.length - notice.length;
            let body = '';
            let truncated = false;
            const append = (text, ceiling) => {
              if (body.length + text.length > ceiling) {
                truncated = true;
                return false;
              }
              body += text;
              return true;
            };
            const marker = '<!-- propr-full-test-results -->';
            const reportLines = [
              marker,
              '### Full Test Suite Results',
              '',
              summary,
              '',
              ...(process.env.DOCS_JOB_RESULT === 'skipped'
                ? [`- Docs site validation: ${skipped(process.env.DOCS_DECISION)}`]
                : Object.entries(docsOutcomes).map(([stage, outcome]) => `- ${stage}: ${outcome || 'not run'}`)),
              `- Shard coverage verification: ${process.env.COVERAGE_RESULT || 'not run'}`,
              ...(process.env.ELECTRON_RESULT ? [`- Hosted native Electron units: ${process.env.ELECTRON_RESULT === 'skipped' ? skipped(process.env.DESKTOP_DECISION) : process.env.ELECTRON_RESULT}`] : []),
              ...lines,
              '',
            ];
            // Keep whole rows when they fit, leaving space for log excerpts.
            for (const line of reportLines) append(`${line}\n`, Math.min(24000, contentLimit));
            for (const [position, [index, output]] of failedOutputs.entries()) {
              const prefix = `<details>\n<summary>View shard ${index}/${shardCount} output</summary>\n\n~~~text\n`;
              const suffix = '\n~~~\n</details>\n\n';
              const budget = Math.floor((contentLimit - body.length) / (failedOutputs.length - position)) - prefix.length - suffix.length;
              const omitted = '...(truncated)\n\n';
              if (budget < omitted.length) {
                truncated = true;
                continue;
              }
              let text = output.replace(/~~~/g, '~~​~');
              if (text.length > budget) {
                truncated = true;
                const tailLength = budget - omitted.length;
                text = omitted + (tailLength > 0 ? text.slice(-tailLength) : '');
              }
              append(prefix + text + suffix, contentLimit);
            }
            body += (truncated ? notice : '') + footer;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
