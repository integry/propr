name: Full Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: full-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Full Test Suite
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      test_result: ${{ steps.tests.outputs.test_result }}
      install_result: ${{ steps.install.outcome }}
      build_result: ${{ steps.build.outcome }}
      docs_result: ${{ steps.docs.outcome }}
      redis_result: ${{ steps.redis.outcome }}
      test_step_result: ${{ steps.tests.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            propr-ui/package-lock.json
            docs/package-lock.json
            packages/shared/package-lock.json
            packages/api/package-lock.json
            packages/core/package-lock.json

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Build workspace packages
        id: build
        run: npm run test:prepare

      - name: Validate docs site
        id: docs
        env:
          PROPR_WORKSPACE: ${{ github.workspace }}
        run: ./.propr/setup.sh

      - name: Start isolated Redis
        id: redis
        run: ./scripts/ci-redis.sh start

      - name: Run Full Test Suite
        id: tests
        continue-on-error: true
        env:
          NODE_ENV: test
        run: |
          echo "Running full test suite with Redis..."
          npm run test:full:prepared 2>&1 | tee test_output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "test_result=success" >> $GITHUB_OUTPUT
            echo "All tests passed"
          else
            echo "test_result=failure" >> $GITHUB_OUTPUT
            echo "Some tests failed"
          fi

          exit $TEST_EXIT_CODE

      - name: Sanitize test output
        if: always()
        env:
          GITHUB_TOKEN_TO_REDACT: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          let output = 'Test output file not available.';
          try { output = fs.readFileSync('test_output.txt', 'utf8'); } catch {}
          const knownSecrets = [process.env.GITHUB_TOKEN_TO_REDACT]
            .filter(secret => secret && secret.length > 0);
          for (const secret of knownSecrets) output = output.split(secret).join('[REDACTED]');
          const credentialPatterns = [
            [/(\b(?:authorization|proxy-authorization)\s*[:=]\s*(?:bearer|token)?\s*)[^\s,;]+/gi, '$1[REDACTED]'],
            [/(\b(?:GITHUB_TOKEN|PROPR_E2E_TOKEN)\s*[:=]\s*)[^\s,;]+/gi, '$1[REDACTED]'],
            [/(["'](?:access_?token|api_?key|client_?secret|password)["']\s*:\s*["'])[^"']+(["'])/gi, '$1[REDACTED]$2'],
            [/\b(?:github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]{20,})\b/g, '[REDACTED]'],
            [/(https?:\/\/)[^\s\/:@]+:[^\s\/@]+@/gi, '$1[REDACTED]@'],
          ];
          for (const [pattern, replacement] of credentialPatterns) {
            output = output.replace(pattern, replacement);
          }
          output = output.replace(/~~~/g, '~~\u200b~');
          fs.writeFileSync('test_output.sanitized.txt', output);
          NODE

      - name: Upload test output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: full-test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_output.sanitized.txt
          if-no-files-found: ignore

      - name: Fail Job
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Stop isolated Redis
        if: always()
        run: ./scripts/ci-redis.sh stop

  comment:
    name: Report Full Test Result
    needs: test
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          needs.test.result != 'skipped' &&
          needs.test.result != 'cancelled' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download test output
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: full-test-output-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Post result comment
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TEST_JOB_RESULT: ${{ needs.test.result }}
          TEST_STEP_RESULT: ${{ needs.test.outputs.test_result }}
          INSTALL_RESULT: ${{ needs.test.outputs.install_result }}
          BUILD_RESULT: ${{ needs.test.outputs.build_result }}
          DOCS_RESULT: ${{ needs.test.outputs.docs_result }}
          REDIS_RESULT: ${{ needs.test.outputs.redis_result }}
          TEST_STEP_OUTCOME: ${{ needs.test.outputs.test_step_result }}
        with:
          script: |
            const fs = require('fs');
            const succeeded = process.env.TEST_JOB_RESULT === 'success' && process.env.TEST_STEP_RESULT === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcomes = {
              'Dependency install': process.env.INSTALL_RESULT,
              'Workspace build': process.env.BUILD_RESULT,
              'Docs validation': process.env.DOCS_RESULT,
              'Redis startup': process.env.REDIS_RESULT,
              'Full test suite': process.env.TEST_STEP_OUTCOME,
            };
            const failedStages = Object.entries(outcomes)
              .filter(([, outcome]) => outcome === 'failure')
              .map(([stage]) => stage);
            const summary = succeeded
              ? 'All tests passed.'
              : failedStages.length > 0
                ? `Validation failed during: ${failedStages.join(', ')}.`
                : 'Validation did not complete successfully.';
            let output = 'Output file not available.';
            try { output = fs.readFileSync('test_output.sanitized.txt', 'utf8'); } catch {}
            const credentialPatterns = [
              [/(\b(?:authorization|proxy-authorization)\s*[:=]\s*(?:bearer|token)?\s*)[^\s,;]+/gi, '$1[REDACTED]'],
              [/(\b(?:GITHUB_TOKEN|PROPR_E2E_TOKEN)\s*[:=]\s*)[^\s,;]+/gi, '$1[REDACTED]'],
              [/(["'](?:access_?token|api_?key|client_?secret|password)["']\s*:\s*["'])[^"']+(["'])/gi, '$1[REDACTED]$2'],
              [/\b(?:github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]{20,})\b/g, '[REDACTED]'],
              [/(https?:\/\/)[^\s\/:@]+:[^\s\/@]+@/gi, '$1[REDACTED]@'],
            ];
            for (const [pattern, replacement] of credentialPatterns) {
              output = output.replace(pattern, replacement);
            }
            output = output.replace(/~~~/g, '~~\u200b~');
            if (output.length > 60000) output = output.substring(0, 60000) + '\n\n...(truncated)';
            const marker = '<!-- propr-full-test-results -->';
            const body = [
              marker,
              '### Full Test Suite Results',
              '',
              summary,
              '',
              ...Object.entries(outcomes).map(([stage, outcome]) => `- ${stage}: ${outcome || 'not run'}`),
              '',
              '<details>',
              '<summary>View Test Output</summary>',
              '',
              '~~~text',
              output,
              '~~~',
              '</details>',
              '',
              `**[View Workflow](${runUrl})**`,
            ].join('\n');
            const commentParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            };
            const comments = await github.paginate(github.rest.issues.listComments, commentParams);
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
