name: Full Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: full-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Full Test Suite
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      test_result: ${{ steps.tests.outputs.test_result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            propr-ui/package-lock.json
            docs/package-lock.json
            packages/shared/package-lock.json
            packages/api/package-lock.json
            packages/core/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run test:prepare

      - name: Validate docs site
        env:
          PROPR_WORKSPACE: ${{ github.workspace }}
        run: ./.propr/setup.sh

      - name: Start isolated Redis
        run: ./scripts/ci-redis.sh start

      - name: Run Full Test Suite
        id: tests
        continue-on-error: true
        env:
          NODE_ENV: test
        run: |
          echo "Running full test suite with Redis..."
          npm run test:full:prepared 2>&1 | tee test_output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "test_result=success" >> $GITHUB_OUTPUT
            echo "All tests passed"
          else
            echo "test_result=failure" >> $GITHUB_OUTPUT
            echo "Some tests failed"
          fi

          exit $TEST_EXIT_CODE

      - name: Upload test output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: full-test-output-${{ github.run_id }}
          path: test_output.txt
          if-no-files-found: ignore

      - name: Fail Job
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Stop isolated Redis
        if: always()
        run: ./scripts/ci-redis.sh stop

  comment:
    name: Report Full Test Result
    needs: test
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          needs.test.result != 'skipped' &&
          needs.test.result != 'cancelled' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download test output
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: full-test-output-${{ github.run_id }}

      - name: Post result comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TEST_JOB_RESULT: ${{ needs.test.result }}
          TEST_STEP_RESULT: ${{ needs.test.outputs.test_result }}
        with:
          script: |
            const fs = require('fs');
            const succeeded = process.env.TEST_JOB_RESULT === 'success' && process.env.TEST_STEP_RESULT === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let output = 'Output file not available.';
            try { output = fs.readFileSync('test_output.txt', 'utf8'); } catch {}
            if (output.length > 60000) output = output.substring(0, 60000) + '\n\n...(truncated)';
            const body = [
              '### Full Test Suite Results',
              '',
              succeeded ? 'All tests passed.' : 'Some tests failed. Please review the output below.',
              '',
              '<details>',
              '<summary>View Test Output</summary>',
              '',
              '~~~text',
              output,
              '~~~',
              '</details>',
              '',
              `**[View Workflow](${runUrl})**`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
